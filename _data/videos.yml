# Labels for the video watch pages, /prensa-y-tv/<slug>/ and its translations.
#
# The titles, descriptions, dates and YouTube ids live in _videos/. Only the
# furniture is here: the pager and the link back to the index.
ui:
  # `newer` and `older` are gone with the pager they labelled. They said "Más
  # reciente" and "Anterior" rather than "Anterior" and "Siguiente", because
  # there is no ambiguity about which way time runs and plenty about which way
  # a "next" arrow points — good reasoning, and it stopped applying when the
  # two-neighbour pager became a grid of all the others with a year on each.
  # Removed rather than left behind: an unused string is a string that gets
  # translated, reviewed and kept in step for nothing.
  #
  # `pager` was the nav's accessible name and is now the heading the reader
  # sees, so it is called what it is.
  others: { es: "Otros vídeos", ca: "Altres vídeos",
            en: "More videos",  ja: "ほかの動画" }
  all:   { es: "Ver todos los vídeos", ca: "Veure tots els vídeos",
           en: "See all the videos",   ja: "すべての動画を見る" }
