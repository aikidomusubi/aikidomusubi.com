# THE VENUE NAMES ARE NOT WRITTEN HERE. `venue:` is an id from
# _data/venues.yml and _includes/ura.html reads `facility[L]` across it.
#
# They used to be a `name` plus a `name_ja` per entry, which is a second copy of
# a name that also appears on /acceso/, on the home page, on the three location
# pages and in the map buttons. Copies drift, and these had: Marina-Besòs was
# マリナ・バゾス市立スポーツセンター here and マリナ・ベソス市立スポーツセンター in
# venues.yml, and Espronceda was 複合施設 here and 施設 on the location pages.
# Neither is wrong on its own; having both is.
#
# Reading them across also gets the Spanish, Catalan and English right, which a
# single `name` never could — this list printed the Catalan name to all four
# languages.
venues:
  - { venue: sant-adria-de-besos, url: "https://marinabesos.net/" }
  - { venue: cxem-espronceda, url: "https://www.asme.cat/cxemespronceda/" }
  - venue: university-of-barcelona
    url: { es: "https://web.ub.edu/es/web/facultat-dret/", ca: "https://web.ub.edu/ca/web/facultat-dret",
           en: "https://web.ub.edu/en/web/facultat-dret/", ja: "https://web.ub.edu/en/web/facultat-dret/" }

