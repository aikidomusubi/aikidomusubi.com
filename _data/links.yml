# `name_ja` is the name the Japanese page shows instead of the Latin one. It is
# what the site already publishes on /ja/, not a transliteration invented here,
# and it is absent on the entries that page never carried — those keep the Latin
# name rather than acquire a guess.
#
# The links. Exactly the eighteen dojos, three organisations, three venues and
# two shops that the home page used to carry, no more and no fewer. They live
# here now because Ura carries them, and _includes/links.html — which wrote each
# one out with a 1.5 KB inline SVG icon — is gone.
#
# The dojos are ordered by name, not by country: eighteen dojos across eight
# countries would need eight columns of one or two entries each, so the place
# rides on the row instead.

