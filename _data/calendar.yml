  # -------------------------------------------------------------------------
  # The general assembly, and the week around it
  #
  # These are the association rather than the tatami, which is what the
  # `association` type is for. Three of them have no time yet and are all-day
  # entries: an entry with no `start` renders without one, which is honest,
  # where inventing 20:00 would not be.
  #
  # The order they happen in is the order they are read in: the deadline for
  # standing comes first, then the assembly that elects, then the grading day
  # that ends with the dinner.
  # -------------------------------------------------------------------------
  - date: "2026-11-30"
    type: association
    title:
      es: "Último día para presentar candidaturas"
      ca: "Últim dia per presentar candidatures"
      en: "Last day to stand for the board"
      ja: "役員立候補の締切"
    note:
      es: "Quien quiera optar a presidencia, secretaría, tesorería o cualquier otro cargo de la junta tiene hasta hoy para presentar su candidatura, de cara a la Asamblea General del 10 de diciembre."
      ca: "Qui vulgui optar a presidència, secretaria, tresoreria o qualsevol altre càrrec de la junta té fins avui per presentar la seva candidatura, de cara a l'Assemblea General del 10 de desembre."
      en: "Anyone standing for president, secretary, treasurer or any other post on the board has until today to put their name forward, ahead of the general assembly on 10 December."
      ja: "会長・書記・会計などの役員に立候補する方は、１２月１０日の総会に向けて本日までにお申し出ください。"

