    routine: true
    location: musubi
    affects: { category: karate, start: "11:00" }
    start: "10:00"
    end:   "12:00"
    title:
      es: "Karate"
      ca: "Karate"
      en: "Karate"
      ja: "空手"
    note:
      es: "De 10:00 a 12:00, una hora antes de lo habitual, por la masterclass de Arturo Fernández."
      ca: "De 10:00 a 12:00, una hora abans de l'habitual, per la masterclass de Arturo Fernández."
      en: "10:00 to 12:00, an hour earlier than usual, because of the Arturo Fernández masterclass."
      ja: "アルトゥーロ・フェルナンデスによるマスタークラスのため、通常より1時間早い10:00〜12:00に行います。"

  - date: "2026-11-21"
    type: change
    routine: true
    location: musubi
    affects: { category: karate, start: "11:00" }
    start: "10:00"
    end:   "12:00"
    title:
      es: "Karate"
      ca: "Karate"
      en: "Karate"
      ja: "空手"
    note:
      es: "De 10:00 a 12:00, una hora antes de lo habitual, por la masterclass de Francesc Castellanos."
      ca: "De 10:00 a 12:00, una hora abans de l'habitual, per la masterclass de Francesc Castellanos."
      en: "10:00 to 12:00, an hour earlier than usual, because of the Francesc Castellanos masterclass."
      ja: "フランセスク・カステヤノスによるマスタークラスのため、通常より1時間早い10:00〜12:00に行います。"

