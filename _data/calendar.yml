# ---------------------------------------------------------------------------
# Seasons
#
# A run of days during which the regular weekly timetable does not run at all.
# Everything that *does* happen in that range is an ordinary entry below.
#
# This exists because the August notice used to be prose and nothing else: the
# `change` entries said what happens on Tuesdays and Thursdays, the note said
# "the rest of the usual week is not taught", and the week grid went on
# cheerfully printing twenty regular sessions underneath it. A reader was told
# two different things on one screen.
#
# One line per closed run. Add next year's alongside the holidays.
# ---------------------------------------------------------------------------
seasons:
  - from: "2026-08-01"
    to:   "2026-08-31"
    title:
      es: "Horario de agosto"
      ca: "Horari d'agost"
      en: "August timetable"
      ja: "8月の稽古時間"

# ---------------------------------------------------------------------------
# Entries
#
# Only things that have no page of their own. Seminars, masterclasses and
# collaborations are NOT listed here — the calendar reads those straight from
# the _events/ collection, so adding one there puts it on the Seminars page
# and this calendar at once, with no second copy to keep in step.
#
# What belongs here: gradings, dojo closures, schedule changes, and regular
# classes that are not running on a given day.
# ---------------------------------------------------------------------------
entries:
