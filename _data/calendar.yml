# ---------------------------------------------------------------------------
# Seasons
#
# A run of days during which the regular weekly timetable does not run at all.
# Everything that *does* happen in that range is an ordinary entry below.
#
# This exists because the August notice used to be prose and nothing else: the
# `change` entries said what happens on Tuesdays and Thursdays, the note said
# "the rest of the usual week is not taught", and the week grid went on
# cheerfully printing twenty regular sessions underneath it. A reader was told
# two different things on one screen.
#
# One line per closed run. Add next year's alongside the holidays.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Season starts, per venue
#
# `seasons` above is the whole dojo; this is one room. A venue listed here has
# no classes at all before its date, and Ura's day strip draws none — the
# weekly grid in _data/schedule.yml is right about the ordinary week and wrong
# only about the weeks before that week begins.
#
# It exists because the alternative was writing every empty evening out as a
# `cancellation`, which put a struck-through class on /calendario/ for a class
# that was never scheduled, and took eight entries to say what these two lines
# say. Delete a line once its date is comfortably past.
# ---------------------------------------------------------------------------
starts:
  - location: sant-adria
    date: "2026-09-21"
  - location: espronceda
    date: "2026-09-21"

seasons:
  - from: "2026-08-01"
    to:   "2026-08-31"
    title:
      es: "Horario de agosto"
      ca: "Horari d'agost"
      en: "August timetable"
      ja: "8月の稽古時間"

# ---------------------------------------------------------------------------
# Entries
#
# Only things that have no page of their own. Seminars, masterclasses and
# collaborations are NOT listed here — the calendar reads those straight from
# the _events/ collection, so adding one there puts it on the Seminars page
# and this calendar at once, with no second copy to keep in step.
#
# What belongs here: gradings, dojo closures, schedule changes, and regular
# classes that are not running on a given day.
# ---------------------------------------------------------------------------
entries:
  # 2026 — the rest of the year is in the holiday block further down.
  - date: "2026-09-11"
    type: closure
    holiday: true
    title:
      es: "Diada de Catalunya"
      ca: "Diada de Catalunya"
      en: "National Day of Catalonia"
      ja: "カタルーニャの日"
    location: musubi

  # -------------------------------------------------------------------------
  # The two Barcelona-side venues start their season on Monday 21 September
  #
  # Marina-Besòs comes back after the summer; CxEM Espronceda opens for the
  # first time. From that Monday both run every Monday and Wednesday, which is
  # exactly what _data/schedule.yml already says, so schedule.yml is untouched.
  #
  # THE FORTNIGHT BEFORE IT IS NOT A CANCELLATION, and writing it as one was
  # wrong twice over. It struck the class through on /calendario/ — which says
  # "this was going to happen and is off", when nothing was ever going to
  # happen — and it took eight entries to say one thing. `starts` below says
  # it once per venue, and Ura's day strip simply does not draw a class before
  # its venue has opened.
  # -------------------------------------------------------------------------
  - date: "2026-09-21"
    type: change
    location: sant-adria
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:00"
    title:
      es: "Inicio de las clases de Aikido en Marina-Besòs"
      ca: "Inici de les classes d'Aikido a Marina-Besòs"
      en: "Aikido classes start at Marina-Besòs"
      ja: "マリナ・バゾスでの合気道稽古開始"
    note:
      es: "Primera clase de la temporada. Lunes de 20:00 a 21:00 y miércoles de 20:15 a 21:15."
      ca: "Primera classe de la temporada. Dilluns de 20:00 a 21:00 i dimecres de 20:15 a 21:15."
      en: "First class of the season. Mondays 20:00–21:00 and Wednesdays 20:15–21:15."
      ja: "今季最初の稽古。月曜20:00〜21:00、水曜20:15〜21:15。"
    # Per language: the town slug is a proper noun and does not change, but the
    # language prefix does. A plain string here would send a Catalan reader to
    # the Spanish page.
    link: { es: "/sant-adria-de-besos/",    ca: "/ca/sant-adria-de-besos/",
            en: "/en/sant-adria-de-besos/", ja: "/ja/sant-adria-de-besos/" }

  - date: "2026-09-21"
    type: change
    location: espronceda
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:00"
    title:
      es: "Inicio de las clases de Aikido en el CxEM Espronceda"
      ca: "Inici de les classes d'Aikido al CxEM Espronceda"
      en: "Aikido classes start at CxEM Espronceda"
      ja: "エスプロンセダでの合気道稽古開始"
    note:
      es: "Primera clase en el CxEM Espronceda. Lunes y miércoles de 20:00 a 21:00."
      ca: "Primera classe al CxEM Espronceda. Dilluns i dimecres de 20:00 a 21:00."
      en: "First class at CxEM Espronceda. Mondays and Wednesdays 20:00–21:00."
      ja: "エスプロンセダでの最初の稽古。月曜・水曜20:00〜21:00。"
    link: { es: "/barcelona/",    ca: "/ca/barcelona/",
            en: "/en/barcelona/", ja: "/ja/barcelona/" }

  # Dan gradings, run by the Arashi Group at the school in Sarrià where its
  # Barcelona seminars are held. Not our mat, so `place` rather than
  # `location`; the string is the one _elsewhere/ uses for the same school.
  - date: "2026-12-19"
    type: exam
    title:
      es: "Exámenes de grados dan"
      ca: "Exàmens de graus dan"
      en: "Dan gradings"
      ja: "段位審査"
    # `place_id` and not `place`: an id into _data/places.yml carries the
    # school's photograph and whatever of its address is known, so the Event
    # gets a location that resolves and an image. A free-text `place` is still
    # supported and still produces a name-only Place — see places.yml.
    place_id: jesuites-sarria

  # Regular classes displaced by a masterclass that evening. The masterclass
  # itself comes from _events/; these say which classes made way for it.
  - date: "2026-03-12"
    type: cancellation
    affects: { category: aikido, start: "19:30" }
    note:
      es: "Masterclass con Simone Corridoni de 19:30 a 21:00."
      ca: "Masterclass amb Simone Corridoni de 19:30 a 21:00."
      en: "Masterclass with Simone Corridoni, 19:30–21:00."
      ja: "シモーネ・コッリドーニによる特別稽古（19:30〜21:00）のため。"
    location: musubi

  - date: "2026-03-12"
    type: cancellation
    affects: { category: aikido, start: "20:30" }
    note:
      es: "Masterclass con Simone Corridoni de 19:30 a 21:00."
      ca: "Masterclass amb Simone Corridoni de 19:30 a 21:00."
      en: "Masterclass with Simone Corridoni, 19:30–21:00."
      ja: "シモーネ・コッリドーニによる特別稽古（19:30〜21:00）のため。"
    location: musubi

  - date: "2026-03-16"
    type: cancellation
    affects: { category: iaijutsu, start: "20:00" }
    note:
      es: "Masterclass con Koji Watanabe de 19:30 a 21:00."
      ca: "Masterclass amb Koji Watanabe de 19:30 a 21:00."
      en: "Masterclass with Koji Watanabe, 19:30–21:00."
      ja: "渡辺幸治による特別稽古（19:30〜21:00）のため。"
    location: musubi

  # Friday session of the Emilio Cardia seminar.
  - date: "2026-04-24"
    type: cancellation
    affects: { category: aikido, start: "19:00" }
    note:
      es: "Por el seminario de Emilio Cardia Shihan."
      ca: "Pel seminari d'Emilio Cardia Shihan."
      en: "Because of the Emilio Cardia Shihan seminar."
      ja: "エミリオ・カルディア師範の講習会のため。"
    location: musubi

  # -------------------------------------------------------------------------
  # One Wednesday a month is a weapons class
  #
  # The second Wednesday of September, October, November and December, taught
  # by Guanlong Zheng instead of the regular class. Four dates and not
  # a rule in _data/schedule.yml, because the weekly grid answers "what happens
  # every week" and this happens four times.
  #
  # `change` WITH `affects`, which substitutes the one class it names: judo at
  # 18:30, the UB at 19:00, CxEM Espronceda at 20:00 and Marina-Besòs at 20:15
  # all run as usual on those evenings. `location:` is part of the match, and
  # it has to be — aikido at 20:00 on a Wednesday is this class at the dojo and
  # a different one at CxEM Espronceda.
  #
  # `routine: true` keeps them out of Ura's "what is coming" for the same
  # reason as the Saturday grading class: four rows of the same sentence is a
  # rhythm, not news. The day strip still draws each one on its Wednesday.
  # -------------------------------------------------------------------------
  - date: "2026-09-16"
    type: change
    routine: true
    location: musubi
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:30"
    title:
      es: "Clase de armas con G. Zheng"
      ca: "Classe d'armes amb G. Zheng"
      en: "Weapons class with G. Zheng"
      ja: "武器稽古（グアンロン　ジェン）"
    note:
      es: "En lugar de la clase regular del miércoles."
      ca: "En lloc de la classe regular del dimecres."
      en: "In place of the regular Wednesday class."
      ja: "水曜日の通常稽古に代えて行います。"

  - date: "2026-10-14"
    type: change
    routine: true
    location: musubi
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:30"
    title:
      es: "Clase de armas con G. Zheng"
      ca: "Classe d'armes amb G. Zheng"
      en: "Weapons class with G. Zheng"
      ja: "武器稽古（グアンロン　ジェン）"
    note:
      es: "En lugar de la clase regular del miércoles."
      ca: "En lloc de la classe regular del dimecres."
      en: "In place of the regular Wednesday class."
      ja: "水曜日の通常稽古に代えて行います。"

  - date: "2026-11-11"
    type: change
    routine: true
    location: musubi
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:30"
    title:
      es: "Clase de armas con G. Zheng"
      ca: "Classe d'armes amb G. Zheng"
      en: "Weapons class with G. Zheng"
      ja: "武器稽古（グアンロン　ジェン）"
    note:
      es: "En lugar de la clase regular del miércoles."
      ca: "En lloc de la classe regular del dimecres."
      en: "In place of the regular Wednesday class."
      ja: "水曜日の通常稽古に代えて行います。"

  - date: "2026-12-09"
    type: change
    routine: true
    location: musubi
    affects: { category: aikido, start: "20:00" }
    start: "20:00"
    end:   "21:30"
    title:
      es: "Clase de armas con G. Zheng"
      ca: "Classe d'armes amb G. Zheng"
      en: "Weapons class with G. Zheng"
      ja: "武器稽古（グアンロン　ジェン）"
    note:
      es: "En lugar de la clase regular del miércoles."
      ca: "En lloc de la classe regular del dimecres."
      en: "In place of the regular Wednesday class."
      ja: "水曜日の通常稽古に代えて行います。"

  # -------------------------------------------------------------------------
  # Saturday karate, on the Saturdays the dojo is given over to something else
  #
  # Karate runs 11:00 to 13:00 every Saturday, and a masterclass or a grading
  # takes the tatami for part of that. The weekly grid keeps printing Karate on
  # Saturday because that is still the normal week; this is where the exception
  # gets said.
  #
  # IT MOVES, IT IS NOT CANCELLED — that is the change of 8 September 2026.
  # A masterclass at 12:00 pulls the whole morning an hour earlier instead of
  # deleting a two-hour class: grading preparation runs 09:00–10:00 rather than
  # 10:00–11:00, karate runs 10:00–12:00 rather than 11:00–13:00, and the
  # masterclass takes 12:00. Nobody loses a session and the morning has no gap.
  #
  # THE RULE IS NOT "EVERY MASTERCLASS SATURDAY", and 12 December is why. That
  # masterclass is at 10:00–11:00, not 12:00, and the day already runs
  # masterclass, kyū gradings at 12:00 and again at 16:00, and the winter
  # dinner. Karate genuinely does not run, so that one stays a cancellation.
  # Read the hour before applying the pattern.
  #
  # ONE PER AFFECTED SATURDAY, and they have to be written by hand. The overlap
  # is derivable in principle — a Saturday _events/ entry against a Saturday
  # class in schedule.yml — but "the mat is busy", "the class is off" and "the
  # class is an hour earlier" are three different statements and only the dojo
  # knows which one applies. A rule that guessed would cancel karate for a
  # 07:30 morning class it never touches.
  #
  # `routine: true` for the same reason the weapons Wednesday carries it: four
  # rows of "Karate" would be the first thing Ura's "what is coming" said, and
  # a karate time on the aikido dojo's own aside is a lookup rather than news.
  # The day strip still draws every one of them on its own Saturday, which is
  # where somebody checks whether there is a class.
  # -------------------------------------------------------------------------
  - date: "2026-09-12"
    type: change
    routine: true
    location: musubi
    affects: { category: karate, start: "11:00" }
    start: "10:00"
    end:   "12:00"
    title:
      es: "Karate"
      ca: "Karate"
      en: "Karate"
      ja: "空手"
    note:
      es: "De 10:00 a 12:00, una hora antes de lo habitual, por la masterclass de Pedro Fortes."
      ca: "De 10:00 a 12:00, una hora abans de l'habitual, per la masterclass de Pedro Fortes."
      en: "10:00 to 12:00, an hour earlier than usual, because of the Pedro Fortes masterclass."
      ja: "ペドロ・フォルテスによるマスタークラスのため、通常より1時間早い10:00〜12:00に行います。"

  - date: "2026-10-10"
