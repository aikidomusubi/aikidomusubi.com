  # -------------------------------------------------------------------------
  # August — reduced timetable
  #
  # Instructors take their holidays in August, so the regular week does not run
  # and a shorter one takes its place. It is here rather than in schedule.yml
  # on purpose: schedule.yml describes the year's ordinary week, and putting a
  # month-long exception in it would mean editing the regular timetable twice a
  # year and hoping the second edit is remembered.
  #
  # One entry per day it actually happens, not one entry spanning the month —
  # a spanning entry would paint every Sunday and Monday in August as though
  # something were on.
  # -------------------------------------------------------------------------
  - date: "2026-08-04"
    type: change
    title:
      es: "Horario de agosto"
      ca: "Horari d'agost"
      en: "August timetable"
      ja: "8月の稽古時間"
    start: "18:30"
    end: "20:30"
    location: musubi
    note:
      es: "18:30–19:30 con J. M. Molina y 19:30–20:30 con J. M. Pérez. El resto de la semana habitual no se imparte."
      ca: "18:30–19:30 amb J. M. Molina i 19:30–20:30 amb J. M. Pérez. La resta de la setmana habitual no es fa."
