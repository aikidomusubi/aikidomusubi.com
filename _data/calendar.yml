  # -------------------------------------------------------------------------
  # Public holidays — the dojo is closed
  #
  # These are the Generalitat's official calendar for Catalonia, which already
  # contains the Spanish national days. One entry per day, per year, because a
  # holiday is a fact about a date rather than a rule the site can derive:
  # Easter moves, and the Generalitat re-issues the calendar every year by
  # decree, occasionally swapping a day that falls on a Sunday.
  #
  # WHAT IS NOT HERE: the two local festes. Barcelona keeps La Mercè (24
  # September) and Badalona keeps Sant Anastasi (11 May), but which of them the
  # dojo actually observes is a decision rather than a lookup — and the classes
  # run in three municipalities. Add them by hand once you have decided.
  #
  # 2027 IS PROVISIONAL. The statutory dates and Easter are certain; the
  # Generalitat's decree for 2027 is what confirms them and settles any Sunday
  # substitutions. Check it before the year starts and correct anything here.
  # -------------------------------------------------------------------------

  # `holiday: true` on every one of these. It is what lets Ura's "what is
  # coming" leave them out while the calendar keeps them: a public holiday is a
  # fact you look up, not news. A closure WITHOUT the flag — a burst pipe, a
  # instructor away — is news, and still shows there.
