# The map listings, and what the site owes them.
#
# Google Business Profile, Apple Business Connect and Bing Places carry the
# same handful of facts the site carries — address, opening hours, what is
# taught, how many instructors, what a first visit costs. Nothing pushes a
# change from here to there: they are three separate dashboards, edited by
# hand, and they go stale silently.
#
# THAT IS THE WHOLE PROBLEM. A wrong opening hour on the site is one page
# nobody may read that day. A wrong opening hour on Google is somebody standing
# outside a locked door, and then a one-star review, and then "temporarily
# closed" reports that Google reads as a signal against the listing. The site
# is the version that gets corrected; the listings are the version people act
# on.
#
# So `tools/qa.py` compares `reviewed:` below against the last commit date of
# every file in `fed_by:`, and says so when the data has moved on. It is a
# WARN, never a FAIL: nobody should be blocked from building because a
# dashboard needs visiting.
#
# WHEN YOU HAVE UPDATED THE LISTINGS, set `reviewed:` to that day. That is the
# entire maintenance burden, and it is the honest record of when a human last
# looked — not of when the data changed, which git already knows.

# Everything on a listing that comes from somewhere in this repo. Adding a file
# here adds it to the check; there is no second list to keep in step.
fed_by:
  - _data/venues.yml      # address, the facts, the accessibility attributes
  - _data/schedule.yml    # opening hours, and which arts are taught
  - _data/about.yml       # the instructor count in the description
  - _data/fees.yml        # the two free trial classes
  - _data/calendar.yml    # the statutory closures, which are Special Hours

listings:
  - id: google
    name: "Google Business Profile"
    url: "https://maps.app.goo.gl/zxNCWtsXshA3CHLAA"
    admin: "https://business.google.com"
    status: live
    # 2026-09-20: description, info and recent photographs updated. Checked on
    # the public listing the same day: 4.9 from 36 reviews, 30 photographs,
    # address and phone correct, hours correct, category "Martial arts school".
    #
    # THE GAP IS NOT THE NUMBER OF REVIEWS, IT IS THEIR AGE. Thirty-six is a
    # good total for a dojo this size; the three Google shows first are six,
    # six and three years old. Google weighs recency, and a listing whose
    # newest review predates the current timetable reads as dormant. Ask a few
    # members at a time over weeks rather than all of them in one evening — a
    # sudden burst is what review filtering is built to catch — and never in
    # exchange for anything.
    #
    # TWO ATTRIBUTES TO VERIFY RATHER THAN ASSUME. The listing claims an
    # assistive hearing loop and four kinds of wheelchair access. _data/venues.yml
    # records 120 m² of mat, capacity, climate control, high ceilings and free
    # parking, and says nothing about either. If the loop is not really there
    # it has to come off: somebody hard of hearing could choose this dojo on
    # the strength of it.
    reviewed: 2026-10-06

  - id: apple
    name: "Apple Business Connect"
    url: "https://maps.apple/p/dfbfrqjpcpKB0m"
    admin: "https://businessconnect.apple.com"
    status: live
    # VERIFIED on 2026-09-20, after several weeks in Apple's queue. Checked on
    # the public listing the same day: name, category, address, phone and
    # hours correct, "From the Business" and the photographs both present,
    # one rating at 100%.
    #
    # ITS WEBSITE FIELD POINTS AT /badalona/ RATHER THAN THE ROOT, which is
    # the better answer of the two and worth keeping: somebody arriving from
    # Apple Maps is standing in Badalona looking at this dojo, and that page
    # carries its timetable, its address and its way in. Google's points at
    # the root.
    #
    # ONE CLAIM TO VERIFY: "Accepts Apple Pay" and "Accepts Contactless
    # Payments". _data/fees.yml documents SEPA direct debit and bank payment
    # and nothing about a card terminal at the door.
    reviewed: 2026-10-06

  - id: bing
    name: "Bing Places"
    url: ""
    admin: "https://www.bing.com/business"
    status: live
    # VERIFIED on 2026-09-26, and the profile is being filled in from there.
    # Bing feeds DuckDuckGo, Yahoo, Ecosia and Copilot, so this one entry
    # reaches several destinations for the effort of one.
    #
    # WHAT BING'S OWN REPORTS ASK FOR, from the 2026-09-19 export, so the
    # profile is filled in knowing which of it is real: 21 pages flagged for a
    # short meta description, 11 for a short title, 6 for thin content. Four
    # of the 21 are redirect stubs with no description by design, six are
    # Japanese pages counted by character where Japanese runs two to three
    # times denser than Latin script, and all six "thin" pages are PDFs. The
    # genuinely short ones are about eight Spanish and English descriptions,
    # listed in the 2026-09-19 notes.
    #
    # AND ONE THING THAT IS NOT BING'S FAULT: Cloudflare Crawler Hints was
    # submitting 3.9K URLs to IndexNow, of which 359 were images, 53 PDFs and
    # 32 actual pages. That is what "Content quality: 266" and "Dead links: 64"
    # in the IndexNow panel are. Turn Crawler Hints off in Cloudflare; the
    # site's own IndexNow key file stays.
    reviewed: 2026-10-06
