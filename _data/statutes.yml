intro:
  es: "Los estatutos de la asociación, aprobados por la asamblea general el 12 de diciembre de 2022 e inscritos en el Registro de Asociaciones de la Generalitat de Catalunya el 7 de marzo de 2023. Están en catalán, la lengua en la que se inscribieron. El documento con valor legal es la copia auténtica del Registro."
  ca: "Els estatuts de l'associació, aprovats per l'assemblea general el 12 de desembre de 2022 i inscrits al Registre d'associacions de la Generalitat de Catalunya el 7 de març de 2023. El document que té valor legal és la còpia autèntica del Registre."
  en: "The association's statutes, approved by the general assembly on 12 December 2022 and entered in the Generalitat de Catalunya's Register of Associations on 7 March 2023. They are in Catalan, the language they were registered in. The legally valid document is the Register's authentic copy."
