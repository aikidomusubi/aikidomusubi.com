# ---------------------------------------------------------------------------
# The statutes, in the Resources panel (?r=estatuts)
#
# The text itself is Catalan only and lives in _includes/statutes-ca.md. These
# are the words AROUND it, in the reader's language: what it is, that it is in
# Catalan, and where the legally valid copy is.
#
# THE PDF is the Register's certified copy with the two digital-signature
# stamps on its signature page redacted, because they print the signatories'
# DNI numbers. That edit means it is no longer the authentic copy itself; the
# Generalitat's verification code is how anyone fetches that.
# ---------------------------------------------------------------------------
