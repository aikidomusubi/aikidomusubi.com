    # and cannot rot the way a generated short link does.
    maps_url: "https://www.google.com/maps/search/?api=1&query=Facultat+de+Dret+Universitat+de+Barcelona"
    apple_url: "https://maps.apple/p/WpkTJqkJdjE~RE"
    logo: "/graphics/Logotip_UB.svg"
