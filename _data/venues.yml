# Where the classes happen.
#
# ONE SOURCE. The access page was 237 lines of hand-written Bootstrap cards per
# language — 948 across the four — repeating the same shape three times: a venue
# card, a facility card, then a row of entrance cards. Adding a venue meant four
# page edits and getting the markup right four times.
#
# TO ADD A VENUE: append a block below. The picker, the panels, the entrance
# steps and the structured data all read from here.

ui:
  where:     { es: "Dónde",            ca: "On",                en: "Where",           ja: "場所" }
  how_in:    { es: "Cómo entrar",      ca: "Com entrar",        en: "Getting in",      ja: "入口" }
  schedule:  { es: "Ver los horarios",  ca: "Veure els horaris",
               en: "See the timetable",  ja: "稽古時間を見る" }
  directions: { es: "Cómo llegar",      ca: "Com arribar",       en: "Directions",      ja: "行き方" }
  dir_apple:  { es: "Cómo llegar · Apple Maps", ca: "Com arribar · Apple Maps",
                en: "Directions · Apple Maps", ja: "行き方・Appleマップ" }
  dir_google: { es: "Cómo llegar · Google Maps", ca: "Com arribar · Google Maps",
                en: "Directions · Google Maps", ja: "行き方・Googleマップ" }
  entrance:  { es: "Acceso",           ca: "Accés",             en: "Entrance",        ja: "入口" }
  enlarge:   { es: "Ampliar la foto",  ca: "Ampliar la foto",   en: "Enlarge photo",   ja: "写真を拡大" }
  close:     { es: "Cerrar",           ca: "Tancar",            en: "Close",           ja: "閉じる" }

# ---------------------------------------------------------------------------
# Maps
#
# `maps_url` is Google; `apple_url` is the same place on Apple Maps, which
# opens the Maps app natively on an iPhone or a Mac rather than a browser tab.
# Both are rendered — see _includes/directions.html — and a small script hides
# whichever one is not the reader's platform. With no script, both show.
#
# `lat`/`lng` feed the Place JSON-LD. They were read out of the Google links
# rather than typed, so they are the coordinates the listing itself carries.
#
# NOTE: the University of Barcelona still has no coordinates, so it carries no
# Place JSON-LD. Its Google short link was dead and is now a Maps URL-scheme
# search; its Apple link is real.
# ---------------------------------------------------------------------------

venues:
  - id: aikido-musubi
    slug: aikido-musubi
    # The same address as `address:` below, in parts.
    #
    # `address:` is one string with a <br> in it, written for a human reading
    # the Access page. schema.org wants a PostalAddress with named fields, and
    # Search Console reported 44 Event items with no usable location at all
    # while the only machine-readable address on the site was the one hardcoded
    # in _includes/header.html for the club itself. Written out rather than
    # split from the string above, because a <br> is a line break and not a
    # field separator, and "Les Corts" is a district rather than a town.
    postal:
      street:   "Av. d'Alfons XIII, 351"
      postcode: "08918"
      town:     "Badalona"
      region:   "Barcelona"
      country:  "ES"
    map_section: aikido_musubi
    maps_url: "https://g.page/aikidomusubi"
    apple_url: "https://maps.apple/p/dfbfrqjpcpKB0m"
    lat: 41.4370303
    lng: 2.223998
    logo: "/graphics/logo-00-wordmark.svg"
    name:
      es: "Aikido Musubi"
      ca: "Aikido Musubi"
      en: "Aikido Musubi"
      ja: "合気道産靈"
    town:
      es: "Badalona"
      ca: "Badalona"
      en: "Badalona"
      ja: "バダロナ"
    address:
      es: "Av. d'Alfons XIII, 351<br>08918 Badalona, Barcelona"
      ca: "Av. d'Alfons XIII, 351<br>08918 Badalona, Barcelona"
      en: "Av. d'Alfons XIII, 351<br>08918 Badalona, Barcelona"
      ja: "Av. d'Alfons XIII, 351<br>08918 Badalona, Barcelona"
    # THE DOJO'S OWN ROOM, WHICH NOTHING ON THE SITE USED TO DESCRIBE. An
    # outside reader could not tell a permanent dojo from a club renting two
    # hours in a municipal hall, and that is the difference these four lines
    # carry: 120 m² of mat that is ours alone, laid permanently, in a space
    # given over to martial arts and run by the association by itself.
    #
    # THE CAPACITY IS HERE AND NOT IN ANY FIGURES BAND. On its own and set
    # large, "40" reads as a limit and cuts both ways; beside the area it can
    # only be read one way. Same reasoning as _data/firstclass.yml.
    #
    # 120 m² is the dojo's figure. The 9 x 13 it came from multiplies out to
    # 117, so only the area is published: a page that invites somebody to
    # measure the room must not print two numbers that disagree.
    #
    # "CLIMATIZADO" AND NOT "AIRE ACONDICIONADO", because the same units heat
    # in winter, and the Spanish word covers both where the English phrase does
    # not. Japanese has the exact term: 冷暖房.
    #
    # AND THE CEILINGS ARE PAIRED WITH THE WINDOWS ON PURPOSE. On its own
    # "techos altos" is a feature and a reader who has never trained anywhere
    # else does not know what it buys. Beside the windows it reads as what it
    # is: the air moves. That is the real claim, and it is worth making because
    # a great many martial arts are taught in small low rooms and basements
    # with no window at all.
    facts:
      es: ["120 m² de tatami, solo nuestro", "Aforo de 40 en el tatami",
           "Climatizado, frío y calor", "Techos altos y ventanas",
           "Parking gratuito", "Abierto de lunes a sábado"]
      ca: ["120 m² de tatami, només nostre", "Aforament de 40 al tatami",
           "Climatitzat, fred i calor", "Sostres alts i finestres",
           "Parking gratuït", "Obert de dilluns a dissabte"]
      en: ["120 m² of mat, ours alone", "Forty people fit on the mat",
           "Heated and air conditioned", "High ceilings and windows",
           "Free parking", "Open Monday to Saturday"]
      ja: ["120平米の畳、私たち専用", "畳の上の定員は40名",
           "冷暖房完備", "高い天井と窓", "駐車場無料", "月〜土営業"]
    facility:
      es: "Instalaciones Deportivas Badalona Sur"
      ca: "Instal·lacions Esportives Badalona Sud"
      en: "Badalona Sud Sports Facilities"
      ja: "南バダロナ サッカー球技場"
    note:
      es: "El dojo está dentro del recinto deportivo y puede costar encontrarlo. Mira bien el plano y ven con tiempo la primera vez."
      ca: "El dojo és dins del recinte esportiu i pot costar de trobar. Mira bé el plànol i vine amb temps el primer dia."
      en: "The dojo is inside the sports complex and can be hard to find. Study the plan and allow extra time on your first visit."
      ja: "道場は運動施設の敷地内にあり、見つけにくい場所です。地図をご確認のうえ、初回は余裕をもってお越しください。"
    plan: "access-information-NdxqmVbV-00"
    # `photo` IS WHAT THIS PLACE LOOKS LIKE; `plan` is how you get in.
    #
    # They are different questions and they were being answered by the same
    # image. The aerial plan carries the entrance letters and the floor overlay
    # and belongs on /acceso/, which asks "where is the door". Everywhere else —
    # the location pages, the home page's venue cards, the dojo page — the
    # question is "what is this place", and at an 11rem crop a satellite view is
    # a grey rectangle with a road through it.
    #
    # `facade` is the second answer, for the two rooms that are hard to find
    # from the street. Absent where there is no photograph, and the templates
    # render nothing rather than a placeholder.
    photo: "access-information-NdxqmVbV-aikido-musubi-room"
    # Overlay shapes, as SVG polygon points in % of the image. Traced from the
    # outlines Juanma drew over the orthophotos, so they follow the actual
    # footprint rather than a bounding box — the Badalona parking is a triangle.
    # `label_at` is where the name sits; labels live here rather than baked into
    # the JPEG, which is what let the four per-language plans become one.
    # Where facility[L] prints, unhighlighted, over the complex itself.
    site_label_at: [43.1, 47.5]
    areas:
      # THESE PERCENTAGES ARE OF THE OSM PLAN, NOT OF THE ORTHOPHOTO.
      #
      # They were re-derived from renders marked up by hand — the outline of the
      # room, the parking and each door — after `plan_style` moved /acceso/ off
      # the aerial photographs. The two framings are not the same, so switching
      # `plan_style` back to `photo` would put every door a few per cent out;
      # the orthophoto's own numbers are in the history if they are ever wanted
      # (git log -- _data/venues.yml).
      #
      # TWO LABELS, BECAUSE THERE ARE TWO QUESTIONS.
      #
      # The highlight answers "which room", so a `dojo` area's `label` is the
      # room's own name — Sala de tatami, Sala «La Capella». `site_label_at`
      # below answers "which building", printing `facility[L]` unhighlighted
      # over the complex the room is inside. Somebody standing at the gate
      # needs the second to find the first.
      #
      # This is why the room name is not simply left to drift: it used to be
      # written per venue with no counterpart, and three of the four named the
      # room where the reader needed the building — Espronceda said "Sala de
      # tatami" and nothing said Espronceda. Naming both fixes that; naming
      # only one just moves which half is missing.
      #
      # A `dojo` area with no `label` still prints `name[L]`, which is right in
      # Badalona: the room IS Aikido Musubi and the complex around it is the
      # Instalaciones Deportivas Badalona Sur.
      #
      # `parking` keeps its own label: "free parking" is not a name.
      - points: "62.2,37.8 70.0,46.6 67.4,49.4 60.0,40.6"
        label_at: [76.3, 41.0]
        kind: dojo
      - points: "59.1,66.4 62.9,71.9 59.4,89.1 47.8,77.3"
        label_at: [54.8, 77.8]
        kind: parking
        label: { es: "Parking gratuito", ca: "Pàrquing gratuït",
                 en: "Free parking",     ja: "無料駐車場" }
    entrances:
      - letter: "A"
        at: [68.4, 53.3]
        image: "access-information-NdxqmVbV-00-a"
        street:
          es: "Calle Jumilla"
          ca: "Carrer Jumilla"
          en: "Jumilla St."
          ja: "フミージャ通り"
        desc:
          es: "Acceso a través de la calle Jumilla."
          ca: "Accés a través del carrer Jumilla."
          en: "Access via Jumilla St."
          ja: "フミージャ通り（Jumilla St.）からアクセス。"
      - letter: "B"
        at: [63.6, 69.9]
        image: "access-information-NdxqmVbV-00-b"
        street:
          es: "Calle Jumilla · entrada del parking"
          ca: "Carrer Jumilla · entrada del pàrquing"
          en: "Jumilla St. · parking entrance"
          ja: "フミージャ通り（駐車場入口）"
        desc:
          es: "Acceso a través de la entrada del parking en la calle Jumilla."
          ca: "Accés a través de l'entrada del parking al carrer Jumilla."
          en: "Access via the parking area on Jumilla St."
          ja: "フミージャ通りの駐車場入口からアクセス。"
      - letter: "C"
        at: [54.7, 34.1]
        image: "access-information-NdxqmVbV-00-c"
        street:
          es: "Passatge de la Ciutat de San Fernando"
          ca: "Passatge de la Ciutat de San Fernando"
          en: "Passatge de la Ciutat de San Fernando"
          ja: "サン・フェルナンド通りの小道"
        desc:
          es: "Acceso a través de la puerta pequeña del pasaje."
          ca: "Accés a través de la porta petita del passatge."
          en: "Access through the small door in the passage."
          ja: "小道にある小さな扉からアクセス。"

