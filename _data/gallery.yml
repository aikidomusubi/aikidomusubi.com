# Gallery — albums, posts and reels, in one stream.
#
# EVERYTHING LIVES HERE. The site used to host 27 albums of its own — 1,193
# photographs, 200 MB — duplicating what was already on Facebook. That is gone.
# Facebook and Instagram hold the media now; this file is the index, and the
# only thing the site keeps is a thumbnail per entry.
#
# Filled by tools/fetch-social.py, curated with tools/triage.py.
#
# ---------------------------------------------------------------------------
# Adding something by hand
# ---------------------------------------------------------------------------
#
#   - type: reel                  reel | post
#     date_iso: "2026-04-11"      the day it was posted
#     name: "Japan Weekend Barcelona 2026"
#     url: "https://www.instagram.com/reel/XXXXXXXX/"
#     thumb: "gallery-2026-04-11-japan-weekend"    /images/<thumb>.jpg + .webp
#     tags: [demo]
#     show: true
#
# `name` is deliberately one string rather than four. Most of these are proper
# nouns — a seminar, a fair, a city — and translating every caption four ways is
# the cost that would stop this being maintained. For the few that need it, add
# name_ca / name_en / name_es / name_ja and they win over `name`.
#
# ---------------------------------------------------------------------------
# Added by the robot
# ---------------------------------------------------------------------------
#
# tools/fetch-social.py appends new Instagram items with `show: false` and
# commits their thumbnail. Nothing reaches the site until that flag is true —
# which is the whole point: the page stays a showcase rather than a feed.
# Flip the ones worth keeping, delete the rest.
# ---------------------------------------------------------------------------

types:
  album:
    name: { es: "Álbum",         ca: "Àlbum",         en: "Album",  ja: "アルバム" }
  post:
    name: { es: "Publicación",   ca: "Publicació",    en: "Post",   ja: "投稿" }
  reel:
    name: { es: "Reel",          ca: "Reel",          en: "Reel",   ja: "リール" }

# The five that describe what we actually do. They replace the WIP filter's
# single `events` value, which every album carried and so filtered nothing.
tags:
  - id: seminar
    color: "#064F6E"
    name: { es: "Seminarios",    ca: "Seminaris",     en: "Seminars",       ja: "講習会" }
  - id: training
    color: "#1A7444"
    name: { es: "Entrenamiento", ca: "Entrenament",   en: "Training",       ja: "稽古" }
  - id: demo
    color: "#AE5224"
    name: { es: "Exhibiciones",  ca: "Exhibicions",   en: "Demonstrations", ja: "演武" }
  - id: travel
    color: "#6450A1"
    name: { es: "Viajes",        ca: "Viatges",       en: "Travel",         ja: "遠征" }
  - id: exams
    color: "#BC892B"
    name: { es: "Exámenes",      ca: "Exàmens",       en: "Examinations",   ja: "審査" }

ui:
  what:      { es: "Qué",         ca: "Què",          en: "What",    ja: "内容" }
  when:      { es: "Cuándo",      ca: "Quan",         en: "When",    ja: "時期" }
  kind:      { es: "Tipo",        ca: "Tipus",        en: "Type",    ja: "種類" }
  all:       { es: "Todo",        ca: "Tot",          en: "All",     ja: "すべて" }
  photos:    { es: "fotos",       ca: "fotos",        en: "photos",  ja: "枚" }
  nothing:   { es: "Nada coincide con este filtro.", ca: "Res coincideix amb aquest filtre.", en: "Nothing matches this filter.", ja: "この条件に合うものはありません。" }

  # The status line under the filters. It replaced a bare "9 / 462", which is a
  # fraction with no subject: it never said nine of what, nor why the number had
  # dropped, nor how to get back. {n} and {total} are filled in by gallery.js.
  items:     { es: "publicaciones", ca: "publicacions", en: "posts", ja: "件" }
  showing:   { es: "Mostrando {n} de {total} {items}",
               ca: "Mostrant {n} de {total} {items}",
               en: "Showing {n} of {total} {items}",
               ja: "{total}{items}中 {n}{items} を表示" }
  all_of:    { es: "{total} {items}", ca: "{total} {items}",
               en: "{total} {items}", ja: "{total}{items}" }
  clear:     { es: "Quitar filtros", ca: "Treure filtres",
               en: "Clear filters",  ja: "フィルターを解除" }
  on_fb:     { es: "Ver en Facebook",  ca: "Veure a Facebook",  en: "View on Facebook",  ja: "Facebookで見る" }
  on_ig:     { es: "Ver en Instagram", ca: "Veure a Instagram", en: "View on Instagram", ja: "Instagramで見る" }
  view:      { es: "Ver el álbum",     ca: "Veure l'àlbum",     en: "View the album",    ja: "アルバムを見る" }

