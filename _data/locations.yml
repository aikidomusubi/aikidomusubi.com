      es: "Lunes y miércoles por la tarde, de 6 a 12 años, y adolescentes hasta los 16. Aprender a caer, a moverse y a respetar al otro, sin competición."
      ca: "Dilluns i dimecres a la tarda, de 6 a 12 anys, i adolescents fins als 16. Aprendre a caure, a moure's i a respectar l'altre, sense competició."
      en: "Monday and Wednesday afternoons, ages 6 to 12, and teenagers up to 16. Learning to fall, to move and to respect each other, with no competition."
      ja: "月曜と水曜の夕方、6歳から12歳、そして16歳までの青少年。受け身、体の動かし方、相手を思いやることを、試合なしで学びます。"
    who_line:
      es: "Niños y niñas de 6 a 12 años; los adolescentes de 12 a 16 también son bienvenidos. Si tienes más de 16, tu sitio es el <a href='/badalona/'>dojo de Badalona</a>, a diez minutos."
      ca: "Nens i nenes de 6 a 12 anys; els adolescents de 12 a 16 també hi són benvinguts. Si tens més de 16 anys, el teu lloc és el <a href='/ca/badalona/'>dojo de Badalona</a>, a deu minuts."
      en: "Children aged 6 to 12; teenagers from 12 to 16 are welcome too. If you are over 16, your place is the <a href='/en/badalona/'>Badalona dojo</a>, ten minutes away."
      ja: "6歳から12歳のこども。12歳から16歳の青少年も歓迎します。16歳を超える方は、10分ほどの<a href='/ja/badalona/'>バダロナの道場</a>へどうぞ。"
    price_line:
      es: "29 € al mes, o 9 € para los abonados del polideportivo Marina-Besòs. El seguro deportivo anual va aparte. Inscripción gratuita y dos clases de prueba."
      ca: "29 € al mes, o 9 € per als abonats del poliesportiu Marina-Besòs. L'assegurança esportiva anual va a part. Inscripció gratuïta i dues classes de prova."
      en: "29 € a month, or 9 € for members of the Marina-Besòs sports centre. The annual sports insurance is paid separately. Free registration and two trial classes."
      ja: "月額29ユーロ、マリナ・バゾスのスポーツセンター会員は9ユーロ。年間のスポーツ保険は別途です。入会金は無料、体験稽古は2回まで。"
    fees:
      members_head:
        es: "Abonados del polideportivo Marina-Besòs"
        ca: "Abonats del poliesportiu Marina-Besòs"
        en: "Marina-Besòs sports centre members"
        ja: "マリナ・バゾス施設会員"
      members_short:
