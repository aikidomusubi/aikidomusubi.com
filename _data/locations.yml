    faq_local:
      q:
        es: "¿En qué se diferencia de las clases de Badalona?"
        ca: "En què es diferencia de les classes de Badalona?"
        en: "How is it different from the classes in Badalona?"
        ja: "バダロナの稽古とどう違いますか。"
      a:
        es: "Es la misma asociación, el mismo programa y los mismos exámenes; cambian el espacio y el horario. Marina-Besòs está a diez minutos del dojo de Badalona, así que mucha gente entrena en los dos y aprovecha los dos horarios."
        ca: "És la mateixa associació, el mateix programa i els mateixos exàmens; canvien l'espai i l'horari. Marina-Besòs és a deu minuts del dojo de Badalona, així que molta gent entrena als dos llocs i aprofita els dos horaris."
        en: "Same association, same programme, same gradings; the space and the hours are what change. Marina-Besòs is ten minutes from the Badalona dojo, so plenty of people train at both and use both timetables."
        ja: "協会も稽古内容も審査も同じで、違うのは場所と時間だけです。マリナ・バゾスはバダロナの道場から10分ほどなので、両方に通って両方の時間帯を活用している人も多くいます。"
    teachers_line:
      es: "Las clases de Marina-Besòs las lleva el equipo de instructores del dojo, con el mismo programa y los mismos criterios de examen que en Badalona. Todos se formaron en Aikido Musubi y siguen la línea del Aikikai Hombu Dojo de Tokio."
      ca: "Les classes de Marina-Besòs les porta l'equip d'instructors del dojo, amb el mateix programa i els mateixos criteris d'examen que a Badalona. Tots s'han format a Aikido Musubi i segueixen la línia de l'Aikikai Hombu Dojo de Tòquio."
      en: "The Marina-Besòs classes are led by the dojo's instructors, with the same programme and the same grading criteria as in Badalona. All of them trained at Aikido Musubi and follow the line of the Aikikai Hombu Dojo in Tokyo."
      ja: "マリナ・バゾスの稽古は道場の指導者陣が担当し、稽古内容も審査の基準もバダロナと同じです。いずれも合気道産靈で稽古を重ね、東京の合気会本部道場の流れを汲んでいます。"
# ---------------------------------------------------------------------------
# The questions
#
# Five are the same everywhere because they are the same questions: they are
# written once here and rendered on all three pages. The sixth is per town and
# is the one that keeps these pages honest — "how is this different from the
# others" is the question a real reader has and the one a doorway page cannot
# answer.
# ---------------------------------------------------------------------------
faq_common:
  - q:
      es: "¿Necesito experiencia previa?"
      ca: "Necessito experiència prèvia?"
      en: "Do I need previous experience?"
      ja: "経験がなくても大丈夫ですか。"
    a:
      es: "No. Quien empieza entrena junto a quien lleva años, y en aikido no hay competición, así que nadie está midiéndose contigo."
      ca: "No. Qui comença entrena al costat de qui fa anys que practica, i en aikido no hi ha competició, així que ningú no s'està mesurant amb tu."
      en: "No. Someone starting out trains alongside someone with years behind them, and there is no competition in aikido, so nobody is measuring themselves against you."
      ja: "はい、大丈夫です。はじめての方も長年稽古している人と一緒に稽古します。合気道に試合はありませんので、誰かと競い合うことはありません。"
  - q:
      es: "¿Tengo que comprar un keikogi para empezar?"
      ca: "He de comprar un keikogi per començar?"
      en: "Do I have to buy a keikogi to start?"
      ja: "はじめに稽古着を買う必要はありますか。"
    a:
      es: "No. Para las primeras clases basta con ropa cómoda de manga larga y pantalón largo. Si después te matriculas por trimestre, semestre o año, el keikogi lo pone el dojo."
      ca: "No. Per a les primeres classes n'hi ha prou amb roba còmoda de màniga llarga i pantalons llargs. Si després t'hi matricules per trimestre, semestre o any, el keikogi el posa el dojo."
      en: "No. Comfortable long-sleeved clothes and long trousers are enough for the first classes. If you then enrol by the quarter, half-year or year, the dojo provides the keikogi."
      ja: "必要ありません。最初の数回は長袖・長ズボンの動きやすい服装で十分です。その後、3か月・6か月・1年単位でお申し込みの場合は、稽古着を道場からお渡しします。"
  - q:
      es: "¿Puedo probar antes de apuntarme?"
      ca: "Puc provar-ho abans d'apuntar-m'hi?"
      en: "Can I try before signing up?"
      ja: "入会前に体験できますか。"
    a:
      es: "Sí: dos clases de prueba, y la inscripción no cuesta nada. Escríbenos y te decimos qué día venir."
      ca: "Sí: dues classes de prova, i la inscripció no costa res. Escriu-nos i et diem quin dia venir."
      en: "Yes: two trial classes, and registration costs nothing. Write to us and we will tell you which day to come."
      ja: "はい。体験稽古を2回まで受けられ、入会金もかかりません。ご連絡いただければ、お越しいただく日をお伝えします。"
  - q:
      es: "¿Cuánto cuesta?"
      ca: "Quant costa?"
      en: "How much does it cost?"
      ja: "費用はどのくらいですか。"
    a:
      es: "35 € al mes para adultos y 25 € para menores de 12 años, con descuentos por trimestre, semestre y año y una cuota familiar. El detalle completo está en la página de cuotas."
      ca: "35 € al mes per a adults i 25 € per a menors de 12 anys, amb descomptes per trimestre, semestre i any i una quota familiar. El detall complet és a la pàgina de quotes."
      en: "35 € a month for adults and 25 € for under-12s, with discounts by the quarter, half-year and year and a family rate. The full detail is on the fees page."
      ja: "大人は月額35ユーロ、12歳未満は25ユーロです。3か月・6か月・1年単位の割引と家族割もあります。詳しくは月謝のページをご覧ください。"
  - q:
      es: "¿En qué idioma se dan las clases?"
      ca: "En quin idioma es fan les classes?"
      en: "What language are the classes in?"
      ja: "稽古は何語で行われますか。"
    a:
      es: "En español y en catalán, y en inglés siempre que hace falta. La terminología es japonesa, como en cualquier dojo, y se aprende sobre la marcha."
      ca: "En català i en castellà, i en anglès sempre que cal. La terminologia és japonesa, com a qualsevol dojo, i s'aprèn sobre la marxa."
      en: "In Spanish and Catalan, and in English whenever it is needed. The terminology is Japanese, as in any dojo, and you pick it up as you go."
      ja: "スペイン語とカタルーニャ語、必要に応じて英語でも行います。用語はどの道場とも同じく日本語で、稽古しながら自然に覚えられます。"
