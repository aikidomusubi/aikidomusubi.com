    title:
      es: "Aikido en Sant Adrià de Besòs"
      ca: "Aikido a Sant Adrià de Besòs"
      en: "Aikido in Sant Adrià de Besòs"
      ja: "サント・アドリア・ダ・バゾスの合気道"
    eyebrow:
