    lede:
      es: "Entrenamos aikido en el polideportivo municipal Marina-Besòs, en Sant Adrià de Besòs, los lunes y los miércoles por la tarde, en una clase para niños y niñas de 6 a 12 años. Los adolescentes de 12 a 16 años también son bienvenidos. Es la misma asociación que abre cada día el dojo de Badalona."
      ca: "Entrenem aikido al poliesportiu municipal Marina-Besòs, a Sant Adrià de Besòs, els dilluns i els dimecres a la tarda, en una classe per a nens i nenes de 6 a 12 anys. Els adolescents de 12 a 16 anys també hi són benvinguts. És la mateixa associació que obre cada dia el dojo de Badalona."
      en: "We train aikido at the Marina-Besòs municipal sports centre in Sant Adrià de Besòs on Monday and Wednesday afternoons, in a class for children aged 6 to 12. Teenagers from 12 to 16 are welcome too. It is the same association that opens the Badalona dojo every day."
      ja: "サント・アドリア・ダ・バゾスのマリナ・バゾス市立スポーツセンターで、月曜と水曜の夕方に、6歳から12歳のこどもを対象とした合気道の稽古を行っています。12歳から16歳の青少年も歓迎します。バダロナの道場を毎日開いているのと同じ協会です。"
    hero_line:
      es: "Lunes y miércoles por la tarde, de 6 a 12 años, y adolescentes hasta los 16. Sin competición y sin comprar nada para empezar."
      ca: "Dilluns i dimecres a la tarda, de 6 a 12 anys, i adolescents fins als 16. Sense competició i sense comprar res per començar."
      en: "Monday and Wednesday afternoons, ages 6 to 12, and teenagers up to 16. No competition, and nothing to buy to start."
      ja: "月曜と水曜の夕方、6歳から12歳、そして16歳までの青少年が対象です。試合も、はじめに買うものもありません。"

    # The class here is for children and teenagers at its own fee, so the
