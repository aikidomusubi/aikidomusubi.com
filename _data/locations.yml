          ja: "<b>6歳から12歳のお子さま</b>は<a href='/ja/sant-adria-de-besos/marina-besos/'>マリナ・バゾス</a>の稽古へどうぞ。"
    teachers_line:
      es: "<b>Daniil Mikhaylov</b>, 3.er dan Aikikai, lleva la clase del CxEM Espronceda. Se formó en Aikido Musubi y sigue la línea del Aikikai Hombu Dojo de Tokio, con el mismo programa y los mismos exámenes que el dojo de Badalona."
      ca: "<b>Daniil Mikhaylov</b>, 3r dan Aikikai, porta la classe del CxEM Espronceda. S'ha format a Aikido Musubi i segueix la línia de l'Aikikai Hombu Dojo de Tòquio, amb el mateix programa i els mateixos exàmens que el dojo de Badalona."
      en: "<b>Daniil Mikhaylov</b>, 3rd dan Aikikai, leads the class at CxEM Espronceda. He trained at Aikido Musubi and follows the line of the Aikikai Hombu Dojo in Tokyo, with the same programme and the same gradings as the Badalona dojo."
      ja: "エスプロンセダの稽古は合気会三段の<b>ダニール・ミハイロフ</b>が担当します。合気道産靈で稽古を重ね、東京の合気会本部道場の流れを汲み、バダロナの道場と同じ稽古内容・同じ審査で指導しています。"
    faq_list:
      - q: { es: "¿Tengo que ser abonado del CxEM Espronceda?", ca: "He de ser abonat del CxEM Espronceda?", en: "Do I have to be a member of CxEM Espronceda?", ja: "エスプロンセダの会員である必要はありますか。" }
        a:
          es: "No. Cualquiera puede apuntarse con la cuota general. Si ya tienes el abono del complejo, pagas la cuota de abonados."
          ca: "No. Qualsevol s'hi pot apuntar amb la quota general. Si ja tens l'abonament del complex, pagues la quota d'abonats."
          en: "No. Anyone can sign up at the standard fee. If you already hold a membership of the complex, you pay the members' fee."
          ja: "いいえ。どなたでも一般の月謝でお申し込みいただけます。施設の会員の方は会員料金になります。"
      - q: { es: "¿Cómo encuentro la sala?", ca: "Com trobo la sala?", en: "How do I find the room?", ja: "畳の間はどこですか。" }
        a:
          es: "Las clases se hacen en la sala de tatami del complejo deportivo. Entra por la calle de Espronceda; en la página de acceso tienes el plano con la entrada marcada. La primera vez, ven con tiempo."
          ca: "Les classes es fan a la sala de tatami del complex esportiu. Entra pel carrer d'Espronceda; a la pàgina d'accés tens el plànol amb l'entrada marcada. El primer dia, vine amb temps."
          en: "Classes are held in the sports complex's tatami room. Go in from Calle de Espronceda; the access page has the plan with the entrance marked. Allow extra time on your first visit."
          ja: "稽古はスポーツ複合施設の畳の間で行います。エスプロンセダ通りから入ってください。入口を示した地図はアクセスのページにあります。初回は余裕をもってお越しください。"
      - q: { es: "¿En qué se diferencia de la clase de la Universidad de Barcelona?", ca: "En què es diferencia de la classe de la Universitat de Barcelona?", en: "How is it different from the class at the University of Barcelona?", ja: "バルセロナ大学の稽古とどう違いますか。" }
        a:
          es: "La de la UB es la clase de principiantes, a las 19:00. La del CxEM Espronceda es para todos los niveles, a las 20:00. Es el mismo programa, con los mismos exámenes, y la cuota sirve para las dos."
          ca: "La de la UB és la classe de principiants, a les 19:00. La del CxEM Espronceda és per a tots els nivells, a les 20:00. És el mateix programa, amb els mateixos exàmens, i la quota serveix per a totes dues."
          en: "The UB class is for beginners, at 19:00. The CxEM Espronceda class is for all levels, at 20:00. Same programme, same gradings, and the fee covers both."
          ja: "バルセロナ大学は19時からの初心者稽古、エスプロンセダは20時からの一般稽古です。稽古内容も審査も同じで、月謝はどちらにも有効です。"
      - q: { es: "¿Puedo entrenar también en Badalona?", ca: "Puc entrenar també a Badalona?", en: "Can I also train in Badalona?", ja: "バダロナでも稽古できますか。" }
        a:
          es: "Sí. La cuota da acceso a todos nuestros espacios, y el dojo de Badalona tiene aikido de martes a sábado, de mañana y de tarde."
          ca: "Sí. La quota dona accés a tots els nostres espais, i el dojo de Badalona té aikido de dimarts a dissabte, al matí i a la tarda."
          en: "Yes. The fee covers all our spaces, and the Badalona dojo has aikido Tuesday to Saturday, mornings and evenings."
          ja: "はい。月謝ですべての稽古場所に通えます。バダロナの道場では火曜から土曜まで、朝と夕方に合気道の稽古があります。"
      - q: { es: "¿Hay clase para niños?", ca: "Hi ha classe per a infants?", en: "Is there a class for children?", ja: "こどもの稽古はありますか。" }
        a:
          es: "Aquí no: la clase es a partir de 12 años. Para niños y niñas de 6 a 12 años, la clase es en el polideportivo Marina-Besòs, en Sant Adrià de Besòs, los lunes y los miércoles por la tarde."
          ca: "Aquí no: la classe és a partir de 12 anys. Per a nens i nenes de 6 a 12 anys, la classe és al poliesportiu Marina-Besòs, a Sant Adrià de Besòs, els dilluns i els dimecres a la tarda."
          en: "Not here: this class is from the age of 12. For children aged 6 to 12, the class is at the Marina-Besòs sports centre in Sant Adrià de Besòs, on Monday and Wednesday afternoons."
          ja: "ここでは12歳以上が対象です。6歳から12歳のお子さまは、サント・アドリア・ダ・バゾスのマリナ・バゾス市立スポーツセンターで、月曜と水曜の夕方に稽古しています。"

