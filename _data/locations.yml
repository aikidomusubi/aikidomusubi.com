# ---------------------------------------------------------------------------
# The three location pages: /badalona/, /barcelona/, /sant-adria-de-besos/
#
# One page per town where the association actually teaches, in four languages,
# rendered by _layouts/location.html. Three and no more: a town with a real
# room, a real timetable and a real teacher has a page; a town we would merely
# like to rank in does not. A page that only rearranges the same words under a
# different place name is a doorway page, and Google acts on those.
#
# WHAT IS WRITTEN HERE AND WHAT IS NOT. Everything factual comes from the data
# the rest of the site already reads:
#
#   the rooms, addresses, plans, entrances, maps   _data/venues.yml
#   the classes, hours, levels, instructors        _data/schedule.yml
#   the fee and what the fee includes              _data/fees.yml
#   how many instructors, seminars, rooms          counted at build time
#
# So a class that moves an hour moves on these pages too, and nobody has to
# remember. What is written below is the part that cannot be derived: the lede,
# the questions people actually ask about that town, and the labels.
#
# THE FOURTH FIGURE SAYS "AIKIKAI". The association belongs to Aikido Arashi
# Group and it is Arashi Group that holds the Aikikai recognition. Four words in
# a figure cell cannot carry that qualification, so the strip names the lineage
# and the sentence under "Quién lo organiza" states the chain in full. Do not
# let the strip grow into a claim the sentence does not support.
# ---------------------------------------------------------------------------

# THE HERO IS A MAP OF THE TOWN, and `hero_style` is the switch.
#
# Set it to `slate` or `sumi`. Both sets are rendered and committed, so flipping
# this one line changes all twelve pages and you can look at the real thing
# rather than a mockup. Once one is chosen, delete the other set from /images/
# and this key can go with it — see docs/mockups/maps.html for what they are and
# docs/mockups/src/build_maps_gl.py for how they are made.
#
# ATTRIBUTION IS NOT OPTIONAL. The data is OpenStreetMap's under ODbL and the
# hero prints "© OpenStreetMap contributors" bottom-right. If the hero ever
# stops being a map, remove the credit with it; while it is a map, the credit
# stays.
hero_style: slate-lit

# THE SAME MAPS, A DIFFERENT PALETTE, on the "we also train in" cards at the
# foot of each page. A separate key because they are a different job: the hero
# is a full-bleed band under an 86% scrim, and these are 300px squares in the
# open with a caption under them, so what reads well in one does not
# necessarily read well in the other. Set it to the same value as `hero_style`
# if you want them to match.
others_style: slate-lit

# THE VENUE PLANS ON /acceso/, which is not a location page — the key lives here
# because this file is already where the map themes are set and one place to
# look beats three.
#
#   photo    the orthophotos, as shipped
#   papel · suiboku · glauco    the OpenStreetMap plans
#
# THE OVERLAY IS NOW CALIBRATED TO THE MAPS, not to the orthophotos. The
# polygons and doors in _data/venues.yml were re-derived from marked-up renders,
# so `papel`, `suiboku` and `glauco` all place them correctly — the three share
# one framing. `photo` still works as an image but its overlay is a few per cent
# out; the orthophoto's own numbers are in the history if they are wanted.
plan_style: papel

# The highlight colours each plan palette carries. Yellow Ocher over Apricot
# Yellow was chosen against a dark aerial photograph and disappears on any of
# these near-white grounds, so every palette brings its own.
#
# COPIED FROM `PLAN_STYLES` IN docs/mockups/src/build_maps.py, which is where
# they are designed and measured — that file is not read at build time. KEEP THE
# TWO IN STEP; the preview at /mockups/plans-palettes.html draws from the
# generator, so a drift shows up as the preview and the page disagreeing.
plan_highlights:
  papel:   { dojo: "#ae5224", park: "#7A8C5A", door: "#82241f" }
  suiboku: { dojo: "#82241f", park: "#7B8587", door: "#82241f" }
  glauco:  { dojo: "#82241f", park: "#16633A", door: "#ae5224" }

# THE OLD HERO PHOTOGRAPH, kept for reference.
#
# It is the home page's own hero art, which is why it is named once here rather
# than three times below: until each town has a picture of its own room, three
# pages carrying three different photographs of somewhere else would be three
# different promises. `image:` on each town stays what it was — the access
# photograph, used small on the other towns' cards at the foot of the page.
#
# The file exists ONLY at the four hero widths (1200/1920/2560/2880) and has no
# base variant, so `_data/imgw.yml` has no entry for it and the layout writes
# its own srcset. That is the naming convention for a hero; see CLAUDE.md.
hero_image: index-8oGCaMDs-00

# THE FEE THE LOCATION PAGES PRINT, and only they.
#
# From October 2026 the monthly fee is 39 € and it gives access to every
# space; the annual sports insurance is paid apart. /cuotas/ is being revised
# separately and still reads _data/fees.yml, so until that revision lands the
# two disagree ON PURPOSE, and this key is the one line to change when they
# are brought back together (ideally by deleting it and reading fees.yml).
fee: 39

