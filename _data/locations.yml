        ca: "Abonats del poliesportiu"
        en: "Sports centre members"
        ja: "施設会員"
      rows:
        - who: { es: "Hasta 16 años", ca: "Fins a 16 anys", en: "Up to 16", ja: "16歳まで" }
          general: 29
