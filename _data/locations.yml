    who_line:
      es: "Niños y niñas de 6 a 12 años; los adolescentes de 12 a 16 también son bienvenidos. Si tienes más de 16, tu sitio es el <a href='/badalona/'>dojo de Badalona</a>, a diez minutos."
      ca: "Nens i nenes de 6 a 12 anys; els adolescents de 12 a 16 també hi són benvinguts. Si tens més de 16 anys, el teu lloc és el <a href='/ca/badalona/'>dojo de Badalona</a>, a deu minuts."
      en: "Children aged 6 to 12; teenagers from 12 to 16 are welcome too. If you are over 16, your place is the <a href='/en/badalona/'>Badalona dojo</a>, ten minutes away."
      ja: "6歳から12歳のこども。12歳から16歳の青少年も歓迎します。16歳を超える方は、10分ほどの<a href='/ja/badalona/'>バダロナの道場</a>へどうぞ。"
    price_line:
      es: "29 € al mes, o 9 € para los abonados del polideportivo Marina-Besòs. El seguro deportivo anual va aparte. Inscripción gratuita y dos clases de prueba."
      ca: "29 € al mes, o 9 € per als abonats del poliesportiu Marina-Besòs. L'assegurança esportiva anual va a part. Inscripció gratuïta i dues classes de prova."
      en: "29 € a month, or 9 € for members of the Marina-Besòs sports centre. The annual sports insurance is paid separately. Free registration and two trial classes."
      ja: "月額29ユーロ、マリナ・バゾスのスポーツセンター会員は9ユーロ。年間のスポーツ保険は別途です。入会金は無料、体験稽古は2回まで。"
    faq:
      price:
        es: "29 € al mes, o 9 € al mes para los abonados del polideportivo Marina-Besòs, para niños, niñas y adolescentes hasta 16 años. La inscripción es gratuita y hay dos clases de prueba. El seguro deportivo anual va aparte."
        ca: "29 € al mes, o 9 € al mes per als abonats del poliesportiu Marina-Besòs, per a nens, nenes i adolescents fins a 16 anys. La inscripció és gratuïta i hi ha dues classes de prova. L'assegurança esportiva anual va a part."
        en: "29 € a month, or 9 € a month for members of the Marina-Besòs sports centre, for children and teenagers up to 16. Registration is free and there are two trial classes. The annual sports insurance is paid separately."
        ja: "16歳までのこども・青少年は月額29ユーロ、マリナ・バゾスのスポーツセンター会員は月額9ユーロです。入会金は無料で、体験稽古は2回まで受けられます。年間のスポーツ保険は別途です。"

    faq_local:
      q:
        es: "¿En qué se diferencia de las clases de Badalona?"
        ca: "En què es diferencia de les classes de Badalona?"
        en: "How is it different from the classes in Badalona?"
        ja: "バダロナの稽古とどう違いますか。"
      a:
        es: "Marina-Besòs es nuestra clase para niños y niñas, de 6 a 12 años, y los adolescentes de hasta 16 también son bienvenidos. Los mayores de 16 entrenan en el dojo de Badalona, a diez minutos, que tiene aikido de martes a sábado."
        ca: "Marina-Besòs és la nostra classe per a nens i nenes, de 6 a 12 anys, i els adolescents de fins a 16 també hi són benvinguts. Els més grans de 16 entrenen al dojo de Badalona, a deu minuts, que té aikido de dimarts a dissabte."
        en: "Marina-Besòs is our class for children aged 6 to 12, and teenagers up to 16 are welcome too. Anyone over 16 trains at the Badalona dojo, ten minutes away, which has aikido Tuesday to Saturday."
        ja: "マリナ・バゾスは6歳から12歳のこどものための稽古で、16歳までの青少年も歓迎します。16歳を超える方は、10分ほどのバダロナの道場で稽古します。道場では火曜から土曜まで合気道の稽古があります。"
    teachers_line:
      es: "La clase de Marina-Besòs la lleva el equipo de instructores del dojo, con un programa de grados propio para niños y la misma línea que en Badalona. Como exige la ley a quien trabaja con menores, el instructor tiene el certificado negativo del Registro Central de Delincuentes Sexuales. Todos se formaron en Aikido Musubi y siguen la línea del Aikikai Hombu Dojo de Tokio."
      ca: "La classe de Marina-Besòs la porta l'equip d'instructors del dojo, amb un programa de graus propi per a infants i la mateixa línia que a Badalona. Com exigeix la llei a qui treballa amb menors, l'instructor té el certificat negatiu del Registre Central de Delinqüents Sexuals. Tots s'han format a Aikido Musubi i segueixen la línia de l'Aikikai Hombu Dojo de Tòquio."
      en: "The Marina-Besòs class is led by the dojo's instructors, with a grading programme of its own for children and the same line as in Badalona. As the law requires of anyone who works with minors, the instructor holds a clear certificate from Spain's Central Register of Sex Offenders. All of them trained at Aikido Musubi and follow the line of the Aikikai Hombu Dojo in Tokyo."
      ja: "マリナ・バゾスの稽古は道場の指導者陣が担当し、こども向けの独自の級位制度のもと、バダロナと同じ流れで指導します。未成年を指導する者に法律で求められているとおり、指導者は性犯罪者中央登録の無犯罪証明書を取得しています。いずれも合気道産靈で稽古を重ね、東京の合気会本部道場の流れを汲んでいます。"
