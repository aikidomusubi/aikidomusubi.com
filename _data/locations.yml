# The three steps. The same three the home page tells, in the same order, so a
# reader who has seen one has seen the other.
steps:
  - heading: { es: "Escríbenos", ca: "Escriu-nos", en: "Write to us", ja: "連絡する" }
    text:
      es: "Un correo o un WhatsApp. Te decimos qué día viene mejor y quién te va a recibir."
      ca: "Un correu o un WhatsApp. Et diem quin dia va millor i qui et rebrà."
      en: "An email or a WhatsApp. We will tell you which day suits and who will meet you."
      ja: "メールかWhatsAppでご連絡ください。おすすめの日と、当日お迎えする者をお伝えします。"
  - heading: { es: "Ven quince minutos antes", ca: "Vine quinze minuts abans",
               en: "Arrive fifteen minutes early", ja: "15分前にお越しください" }
    text:
      es: "Te enseñamos el vestuario y el tatami, y te presentamos a quien va a entrenar contigo."
      ca: "T'ensenyem el vestidor i el tatami, i et presentem qui entrenarà amb tu."
      en: "We will show you the changing room and the mat, and introduce whoever will train with you."
      ja: "更衣室と道場をご案内し、一緒に稽古する者を紹介します。"
  - heading: { es: "Ropa cómoda y nada más", ca: "Roba còmoda i res més",
               en: "Comfortable clothes, nothing else", ja: "動きやすい服装だけで" }
    text:
      es: "Manga larga, pantalón largo y pies descalzos. Una hora, y nadie te va a poner a prueba el primer día."
      ca: "Màniga llarga, pantalons llargs i peus descalços. Una hora, i ningú no et posarà a prova el primer dia."
      en: "Long sleeves, long trousers, bare feet. One hour, and nobody is going to test you on day one."
      ja: "長袖・長ズボン・裸足で。稽古は1時間、初日に試されるようなことはありません。"

# ---------------------------------------------------------------------------
# The three towns
#
# `venues` holds ids from _data/schedule.yml's `locations`, because that is what
# the classes are keyed on. The layout maps each to its `slug`, which is the id
# in _data/venues.yml, to reach the address and the plan.
# ---------------------------------------------------------------------------
locations:
  - id: badalona
    # The town on its own, for headings that name it mid-sentence.
    town_name:
      es: "Badalona"
      ca: "Badalona"
      en: "Badalona"
      ja: "バダロナ"
    ref: badalona-Vh4kR7wQ
    venues: [musubi]
    # THE ONE TOWN WHOSE "QUIÉN ENSEÑA" ROW IS NOT DERIVED FROM THE WEEK.
    #
    # Everywhere else the row is built from the classes that town actually has,
    # which is right: Barcelona's names the two people who take those two
    # classes. Badalona is the dojo, and its week has judo, iaijutsu and karate
    # in it, so the derived row mixed four arts into a line the reader takes as
    # "who will teach my aikido class". It also left out the aikido instructors
    # who teach at the other spaces, who are the same team.
    #
    # With this flag the row is the association's aikido roster in full, read
    # from `_data/about.yml` in the order that file keeps them — by grade — so
    # it is still not typed here and still cannot disagree with the About page.
    aikido_roster: true
    # AIKIDO ONLY on this page. Iaijutsu, judo and karate are taught at the
    # dojo too, and stay on /horarios/ and /clases/, but the location pages
    # promote aikido; `categories` filters the timetable and the "Cuándo" row.
    categories: [aikido]
    image: access-information-NdxqmVbV-00
    title:
      es: "Aikido en Badalona"
      ca: "Aikido a Badalona"
      en: "Aikido in Badalona"
      ja: "バダロナの合気道"
    eyebrow:
      es: "Badalona · Aikido Musubi"
      ca: "Badalona · Aikido Musubi"
      en: "Badalona · Aikido Musubi"
      ja: "バダロナ · 合気道産靈"
    lede:
      es: "Aikido Musubi es nuestro dojo, en Badalona, abierto de lunes a sábado desde 2008. Es la casa del aikido de la asociación: aquí se entrena de martes a sábado, de mañana y de tarde, y aquí se celebran los exámenes, los cursos y las masterclass."
      ca: "Aikido Musubi és el nostre dojo, a Badalona, obert de dilluns a dissabte des del 2008. És la casa de l'aikido de l'associació: aquí s'entrena de dimarts a dissabte, al matí i a la tarda, i aquí se celebren els exàmens, els cursos i les masterclass."
      en: "Aikido Musubi is our dojo, in Badalona, open Monday to Saturday since 2008. It is the association's home for aikido: training runs Tuesday to Saturday, mornings and evenings, and it is where the gradings, the seminars and the masterclasses take place."
      ja: "合気道産靈はバダロナにある私たちの道場で、2008年から月曜日から土曜日まで開いています。協会の合気道の本拠地で、火曜から土曜まで朝と夕方に稽古があり、審査や講習会、マスタークラスもここで行います。"
    hero_line:
      es: "De martes a sábado, de mañana y de tarde. Sin experiencia previa, sin competición y sin comprar nada para empezar."
      ca: "De dimarts a dissabte, al matí i a la tarda. Sense experiència prèvia, sense competició i sense comprar res per començar."
      en: "Tuesday to Saturday, mornings and evenings. No previous experience, no competition, and nothing to buy to start."
      ja: "火曜から土曜まで、朝と夕方に。経験も、試合も、はじめに買うものも必要ありません。"

    faq_local:
      q:
        es: "¿En qué se diferencia del resto de espacios?"
        ca: "En què es diferencia de la resta d'espais?"
        en: "How is it different from the other spaces?"
        ja: "ほかの稽古場所とどう違いますか。"
      a:
        es: "Badalona es el dojo: un espacio dedicado por completo a las artes marciales, con aikido de martes a sábado, de mañana y de tarde. Los exámenes, los cursos y las masterclass se celebran aquí. En Barcelona hay aikido dos días por semana, y en Sant Adrià de Besòs está la clase de niños y jóvenes."
        ca: "Badalona és el dojo: un espai dedicat completament a les arts marcials, amb aikido de dimarts a dissabte, al matí i a la tarda. Els exàmens, els cursos i les masterclass s'hi celebren. A Barcelona hi ha aikido dos dies per setmana, i a Sant Adrià de Besòs hi ha la classe d'infants i joves."
        en: "Badalona is the dojo: a space given over entirely to martial arts, with aikido Tuesday to Saturday, mornings and evenings. The gradings, the seminars and the masterclasses happen here. Barcelona has aikido two days a week, and Sant Adrià de Besòs has the class for children and young people."
        ja: "バダロナは道場そのものです。武道のためだけの場所で、火曜から土曜まで朝と夕方に合気道の稽古があります。審査・講習会・マスタークラスもここで行います。バルセロナでは週2日、サント・アドリア・ダ・バゾスではこども・青少年の稽古を行っています。"
    teachers_line:
      es: "El dojo lo dirige <b>Pablo Martín</b>, 4.º dan Aikikai y shidōin, que fundó la asociación en 2008. El equipo de aikido son nueve instructores con grado dan del Aikikai, y son los mismos que dan clase en Barcelona y en Sant Adrià de Besòs. Todos siguen la línea del Aikikai Hombu Dojo de Tokio."
      ca: "El dojo el dirigeix <b>Pablo Martín</b>, 4t dan Aikikai i shidōin, que va fundar l'associació el 2008. L'equip d'aikido són nou instructors amb grau dan de l'Aikikai, i són els mateixos que fan classe a Barcelona i a Sant Adrià de Besòs. Tots segueixen la línia de l'Aikikai Hombu Dojo de Tòquio."
      en: "The dojo is led by <b>Pablo Martín</b>, 4th dan Aikikai and shidōin, who founded the association in 2008. The aikido team is nine instructors holding Aikikai dan grades, and they are the same people who teach in Barcelona and in Sant Adrià de Besòs. All of them follow the line of the Aikikai Hombu Dojo in Tokyo."
      ja: "道場は合気会四段・指導員の<b>パブロ・マルティン</b>が率いています。2008年に協会を設立した人物です。合気道の指導陣は合気会の段位を持つ9名で、バルセロナやサント・アドリア・ダ・バゾスで指導しているのも同じ顔ぶれです。いずれも東京の合気会本部道場の流れを汲んでいます。"
  - id: barcelona
    # The town on its own, for headings that name it mid-sentence.
    town_name:
      es: "Barcelona"
      ca: "Barcelona"
      en: "Barcelona"
      ja: "バルセロナ"
    ref: barcelona-Nq8pL3xB
    venues: [espronceda, ub]
    image: access-information-NdxqmVbV-03
    title:
      es: "Aikido en Barcelona"
      ca: "Aikido a Barcelona"
      en: "Aikido in Barcelona"
      ja: "バルセロナの合気道"
    eyebrow:
      es: "Barcelona · CxEM Espronceda y UB"
      ca: "Barcelona · CxEM Espronceda i UB"
      en: "Barcelona · CxEM Espronceda and UB"
      ja: "バルセロナ · エスプロンセダとUB"
    lede:
      es: "Entrenamos aikido en dos espacios de Barcelona, los lunes y los miércoles: el Complejo Deportivo Municipal Espronceda y la Facultad de Derecho de la Universidad de Barcelona. Es la misma asociación que abre cada día el dojo de Badalona."
      ca: "Entrenem aikido en dos espais de Barcelona, els dilluns i els dimecres: el Complex Esportiu Municipal Espronceda i la Facultat de Dret de la Universitat de Barcelona. És la mateixa associació que obre cada dia el dojo de Badalona."
      en: "We train aikido in two spaces in Barcelona, on Mondays and Wednesdays: the Espronceda Municipal Sports Complex and the Faculty of Law at the University of Barcelona. It is the same association that opens the Badalona dojo every day."
      ja: "バルセロナでは月曜と水曜に、2か所で合気道を稽古しています。エスプロンセダ市立スポーツ複合施設と、バルセロナ大学法学部です。バダロナの道場を毎日開いているのと同じ協会です。"
    hero_line:
      es: "Lunes y miércoles, en dos espacios. Sin experiencia previa, sin competición y sin comprar nada para empezar."
      ca: "Dilluns i dimecres, en dos espais. Sense experiència prèvia, sense competició i sense comprar res per començar."
      en: "Mondays and Wednesdays, in two spaces. No previous experience, no competition, and nothing to buy to start."
      ja: "月曜と水曜、2か所で。経験も、試合も、はじめに買うものもありません。"

    # The CxEM Espronceda members' rate is a fact about this town's rooms.
    price_line:
      es: "39 € al mes, con acceso a todos nuestros espacios; 19 € si eres abonado del CxEM Espronceda. El seguro deportivo anual va aparte. Inscripción gratuita y dos clases de prueba."
      ca: "39 € al mes, amb accés a tots els nostres espais; 19 € si ets abonat del CxEM Espronceda. L'assegurança esportiva anual va a part. Inscripció gratuïta i dues classes de prova."
      en: "39 € a month, with access to all our spaces; 19 € if you are a member of CxEM Espronceda. The annual sports insurance is paid separately. Free registration and two trial classes."
      ja: "月額39ユーロで、すべての稽古場所に通えます。エスプロンセダの会員は19ユーロ。年間のスポーツ保険は別途です。入会金は無料、体験稽古は2回まで。"
    faq:
      price:
        es: "39 € al mes, con acceso a todos nuestros espacios: Badalona, Barcelona y Sant Adrià de Besòs. Si eres abonado del CxEM Espronceda, 19 €. La inscripción es gratuita y hay dos clases de prueba. El seguro deportivo anual va aparte."
        ca: "39 € al mes, amb accés a tots els nostres espais: Badalona, Barcelona i Sant Adrià de Besòs. Si ets abonat del CxEM Espronceda, 19 €. La inscripció és gratuïta i hi ha dues classes de prova. L'assegurança esportiva anual va a part."
        en: "39 € a month, with access to all our spaces: Badalona, Barcelona and Sant Adrià de Besòs. If you are a member of CxEM Espronceda, 19 €. Registration is free and there are two trial classes. The annual sports insurance is paid separately."
        ja: "月額39ユーロで、バダロナ・バルセロナ・サント・アドリア・ダ・バゾスのすべての稽古場所に通えます。エスプロンセダの会員は19ユーロです。入会金は無料で、体験稽古は2回まで受けられます。年間のスポーツ保険は別途です。"

    faq_local:
      q:
        es: "¿En qué se diferencia de las clases de Badalona?"
        ca: "En què es diferencia de les classes de Badalona?"
        en: "How is it different from the classes in Badalona?"
        ja: "バダロナの稽古とどう違いますか。"
      a:
        es: "Es la misma asociación, el mismo programa y los mismos exámenes; cambian el espacio y el horario. Badalona es el dojo principal, con aikido de martes a sábado, de mañana y de tarde. En Barcelona hay aikido los lunes y los miércoles. La cuota da acceso a todos los espacios, y mucha gente entrena en los dos."
        ca: "És la mateixa associació, el mateix programa i els mateixos exàmens; canvien l'espai i l'horari. Badalona és el dojo principal, amb aikido de dimarts a dissabte, al matí i a la tarda. A Barcelona hi ha aikido els dilluns i els dimecres. La quota dona accés a tots els espais, i molta gent entrena als dos llocs."
        en: "Same association, same programme, same gradings; the space and the hours are what change. Badalona is the main dojo, with aikido Tuesday to Saturday, mornings and evenings. Barcelona has aikido on Mondays and Wednesdays. The fee covers every space, and plenty of people train at both."
        ja: "協会も稽古内容も審査も同じで、違うのは場所と時間だけです。バダロナは本部の道場で、火曜から土曜まで朝と夕方に合気道の稽古があります。バルセロナでは月曜と水曜に合気道を稽古します。月謝ですべての稽古場所に通えるので、両方に通っている人も多くいます。"
    teachers_line:
      es: "<b>Daniil Mikhaylov</b>, 3.er dan Aikikai, lleva la clase del Complejo Deportivo Municipal Espronceda. <b>Pablo Martín</b>, 4.º dan Aikikai y responsable del dojo, lleva la de la Facultad de Derecho de la Universidad de Barcelona. Ambos se formaron en Aikido Musubi y siguen la línea del Aikikai Hombu Dojo de Tokio."
      ca: "<b>Daniil Mikhaylov</b>, 3r dan Aikikai, porta la classe del Complex Esportiu Municipal Espronceda. <b>Pablo Martín</b>, 4t dan Aikikai i responsable del dojo, porta la de la Facultat de Dret de la Universitat de Barcelona. Tots dos s'han format a Aikido Musubi i segueixen la línia de l'Aikikai Hombu Dojo de Tòquio."
      en: "<b>Daniil Mikhaylov</b>, 3rd dan Aikikai, leads the class at the Espronceda Municipal Sports Complex. <b>Pablo Martín</b>, 4th dan Aikikai and head of the dojo, leads the one at the Faculty of Law, University of Barcelona. Both trained at Aikido Musubi and follow the line of the Aikikai Hombu Dojo in Tokyo."
      ja: "エスプロンセダ市立スポーツ複合施設の稽古は、合気会三段の<b>ダニール・ミハイロフ</b>が担当します。バルセロナ大学法学部の稽古は、合気会四段で道場責任者の<b>パブロ・マルティン</b>が担当します。二人とも合気道産靈で稽古を重ね、東京の合気会本部道場の流れを汲んでいます。"
