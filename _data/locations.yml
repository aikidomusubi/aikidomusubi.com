      notes:
        - es: "<b>Abonados:</b> la cuota reducida es para las familias que ya tienen el abono del polideportivo Marina-Besòs, y hay que acreditarlo al apuntarse."
          ca: "<b>Abonats:</b> la quota reduïda és per a les famílies que ja tenen l'abonament del poliesportiu Marina-Besòs, i cal acreditar-ho en apuntar-s'hi."
          en: "<b>Members:</b> the reduced fee is for families who already hold a membership of the Marina-Besòs sports centre, shown when signing up."
          ja: "<b>施設会員：</b>マリナ・バゾスのスポーツセンターの会員のご家庭が対象です。入会時に会員証をご提示ください。"
        - es: "<b>Sin coste:</b> la inscripción y las dos clases de prueba. Si os apuntáis por tres meses o más, el keikogi lo pone el dojo."
          ca: "<b>Sense cost:</b> la inscripció i les dues classes de prova. Si us apunteu per tres mesos o més, el keikogi el posa el dojo."
          en: "<b>Free:</b> registration and the two trial classes. Sign up for three months or more and the dojo provides the keikogi."
          ja: "<b>無料：</b>入会金と2回の体験稽古。3か月以上でお申し込みの場合は、稽古着を道場からお渡しします。"
        - es: "<b>Aparte:</b> el seguro deportivo anual."
          ca: "<b>A part:</b> l'assegurança esportiva anual."
          en: "<b>Separately:</b> the annual sports insurance."
          ja: "<b>別途：</b>年間のスポーツ保険。"
        - es: "<b>Más de 16 años:</b> la clase es en el <a href='/badalona/'>dojo de Badalona</a>, a diez minutos."
          ca: "<b>Més de 16 anys:</b> la classe és al <a href='/ca/badalona/'>dojo de Badalona</a>, a deu minuts."
          en: "<b>Over 16:</b> the class is at the <a href='/en/badalona/'>Badalona dojo</a>, ten minutes away."
          ja: "<b>16歳を超える方：</b>10分ほどの<a href='/ja/badalona/'>バダロナの道場</a>で稽古します。"
    teachers_line:
      es: "<b>Alberto Sancho</b>, 4.º dan Aikikai, lleva la clase de Marina-Besòs. Tiene experiencia con grupos de niños y, como exige la ley a quien trabaja con menores, el certificado negativo del Registro Central de Delincuentes Sexuales. Se formó en Aikido Musubi y sigue la línea del Aikikai Hombu Dojo de Tokio."
      ca: "<b>Alberto Sancho</b>, 4t dan Aikikai, porta la classe de Marina-Besòs. Té experiència amb grups d'infants i, com exigeix la llei a qui treballa amb menors, el certificat negatiu del Registre Central de Delinqüents Sexuals. S'ha format a Aikido Musubi i segueix la línia de l'Aikikai Hombu Dojo de Tòquio."
      en: "<b>Alberto Sancho</b>, 4th dan Aikikai, leads the class at Marina-Besòs. He has experience with children's groups and, as the law requires of anyone working with minors, holds a clear certificate from Spain's Central Register of Sex Offenders. He trained at Aikido Musubi and follows the line of the Aikikai Hombu Dojo in Tokyo."
      ja: "マリナ・バゾスの稽古は合気会四段の<b>アルベルト・サンチョ</b>が担当します。こどもの指導経験があり、未成年を指導する者に法律で求められているとおり、性犯罪者中央登録の無犯罪証明書を取得しています。合気道産靈で稽古を重ね、東京の合気会本部道場の流れを汲んでいます。"
    faq_list:
      - q: { es: "¿Desde qué edad pueden venir?", ca: "Des de quina edat poden venir?", en: "From what age can they come?", ja: "何歳から参加できますか。" }
        a:
          es: "Desde los 6 años. El grupo es de 6 a 12, y los adolescentes de hasta 16 también son bienvenidos. A partir de los 16 se entrena en el dojo de Badalona."
          ca: "Des dels 6 anys. El grup és de 6 a 12, i els adolescents de fins a 16 també hi són benvinguts. A partir dels 16 s'entrena al dojo de Badalona."
          en: "From 6. The group is 6 to 12, and teenagers up to 16 are welcome too. From 16, training is at the Badalona dojo."
          ja: "6歳からです。6歳から12歳のグループで、16歳までの青少年も歓迎します。16歳を超えるとバダロナの道場での稽古になります。"
      - q: { es: "¿Es seguro para los niños?", ca: "És segur per als infants?", en: "Is it safe for children?", ja: "こどもにとって安全ですか。" }
        a:
          es: "Sí. En aikido no hay golpes ni competición, y lo primero que se aprende es a caer sin hacerse daño, siempre sobre tatami y al ritmo de cada uno."
          ca: "Sí. A l'aikido no hi ha cops ni competició, i el primer que s'aprèn és a caure sense fer-se mal, sempre sobre tatami i al ritme de cadascú."
          en: "Yes. There is no striking and no competition in aikido, and the first thing learnt is how to fall without getting hurt, always on the mat and at each child's own pace."
          ja: "はい。合気道には打撃も試合もなく、最初に学ぶのはけがをしない受け身です。いつも畳の上で、一人ひとりのペースに合わせて稽古します。"
      - q: { es: "¿Tenemos que ser abonados del polideportivo?", ca: "Hem de ser abonats del poliesportiu?", en: "Do we have to be members of the sports centre?", ja: "スポーツセンターの会員である必要はありますか。" }
        a:
          es: "No. Cualquiera puede apuntarse con la cuota general. Si ya sois abonados del polideportivo Marina-Besòs, pagáis la cuota de abonados."
          ca: "No. Qualsevol s'hi pot apuntar amb la quota general. Si ja sou abonats del poliesportiu Marina-Besòs, pagueu la quota d'abonats."
          en: "No. Anyone can sign up at the standard fee. If you are already members of the Marina-Besòs sports centre, you pay the members' fee."
          ja: "いいえ。どなたでも一般の月謝でお申し込みいただけます。マリナ・バゾスの会員の方は会員料金になります。"
      - q: { es: "¿Qué necesitan para la primera clase?", ca: "Què necessiten per a la primera classe?", en: "What do they need for the first class?", ja: "最初の稽古には何が必要ですか。" }
        a:
          es: "Ropa cómoda de manga y pantalón largos. Al apuntarse hace falta un keikogi; si os apuntáis por tres meses o más, lo pone el dojo."
          ca: "Roba còmoda de màniga i pantalons llargs. En apuntar-s'hi cal un keikogi; si us apunteu per tres mesos o més, el posa el dojo."
          en: "Comfortable clothes with long sleeves and long trousers. A keikogi is needed on signing up; sign up for three months or more and the dojo provides it."
          ja: "長袖・長ズボンの動きやすい服装で大丈夫です。入会時には稽古着が必要ですが、3か月以上でお申し込みの場合は道場からお渡しします。"
      - q: { es: "¿Cómo encontramos la sala?", ca: "Com trobem la sala?", en: "How do we find the room?", ja: "畳の間はどこですか。" }
        a:
          es: "La sala de tatami está dentro del polideportivo y puede costar encontrarla. En la página de acceso tenéis el plano con la entrada marcada; la primera vez, venid con tiempo."
          ca: "La sala de tatami és dins del poliesportiu i pot costar de trobar. A la pàgina d'accés teniu el plànol amb l'entrada marcada; el primer dia, veniu amb temps."
          en: "The tatami room is inside the sports centre and can be hard to find. The access page has the plan with the entrance marked; allow extra time on your first visit."
          ja: "畳の間はスポーツセンターの施設内にあり、見つけにくい場所です。入口を示した地図はアクセスのページにあります。初回は余裕をもってお越しください。"

# ---------------------------------------------------------------------------
# The questions
#
# Five are the same everywhere because they are the same questions: they are
# written once here and rendered on all three pages. The sixth is per town and
# is the one that keeps these pages honest — "how is this different from the
# others" is the question a real reader has and the one a doorway page cannot
# answer.
# ---------------------------------------------------------------------------
faq_common:
  - q:
      es: "¿Necesito experiencia previa?"
      ca: "Necessito experiència prèvia?"
      en: "Do I need previous experience?"
      ja: "経験がなくても大丈夫ですか。"
    a:
      es: "No. Quien empieza entrena junto a quien lleva años, y en aikido no hay competición, así que nadie está midiéndose contigo."
      ca: "No. Qui comença entrena al costat de qui fa anys que practica, i en aikido no hi ha competició, així que ningú no s'està mesurant amb tu."
      en: "No. Someone starting out trains alongside someone with years behind them, and there is no competition in aikido, so nobody is measuring themselves against you."
      ja: "はい、大丈夫です。はじめての方も長年稽古している人と一緒に稽古します。合気道に試合はありませんので、誰かと競い合うことはありません。"
  - id: keikogi
    q:
      es: "¿Tengo que comprar un keikogi para empezar?"
      ca: "He de comprar un keikogi per començar?"
      en: "Do I have to buy a keikogi to start?"
      ja: "はじめに稽古着を買う必要はありますか。"
    a:
      es: "No. Para las primeras clases basta con ropa cómoda de manga larga y pantalón largo. Si después te apuntas por tres meses o más, el keikogi lo pone el dojo, en cualquiera de los espacios."
      ca: "No. Per a les primeres classes n'hi ha prou amb roba còmoda de màniga llarga i pantalons llargs. Si després t'hi apuntes per tres mesos o més, el keikogi el posa el dojo, a qualsevol dels espais."
      en: "No. Comfortable long-sleeved clothes and long trousers are enough for the first classes. If you then sign up for three months or more, the dojo provides the keikogi, at any of the spaces."
      ja: "必要ありません。最初の数回は長袖・長ズボンの動きやすい服装で十分です。その後、3か月以上でお申し込みの場合は、どの稽古場所でも稽古着を道場からお渡しします。"
  - q:
      es: "¿Puedo probar antes de apuntarme?"
      ca: "Puc provar-ho abans d'apuntar-m'hi?"
      en: "Can I try before signing up?"
      ja: "入会前に体験できますか。"
    a:
      es: "Sí: dos clases de prueba, y la inscripción no cuesta nada. Escríbenos y te decimos qué día venir."
      ca: "Sí: dues classes de prova, i la inscripció no costa res. Escriu-nos i et diem quin dia venir."
      en: "Yes: two trial classes, and registration costs nothing. Write to us and we will tell you which day to come."
      ja: "はい。体験稽古を2回まで受けられ、入会金もかかりません。ご連絡いただければ、お越しいただく日をお伝えします。"
  # An `id` lets a town answer this one itself, under `faq:` on the town.
  - id: price
    q:
      es: "¿Cuánto cuesta?"
      ca: "Quant costa?"
      en: "How much does it cost?"
      ja: "費用はどのくらいですか。"
    a:
      es: "39 € al mes, con acceso a todos nuestros espacios: Badalona, Barcelona y Sant Adrià de Besòs. La inscripción es gratuita y hay dos clases de prueba. El seguro deportivo anual va aparte."
      ca: "39 € al mes, amb accés a tots els nostres espais: Badalona, Barcelona i Sant Adrià de Besòs. La inscripció és gratuïta i hi ha dues classes de prova. L'assegurança esportiva anual va a part."
      en: "39 € a month, with access to all our spaces: Badalona, Barcelona and Sant Adrià de Besòs. Registration is free and there are two trial classes. The annual sports insurance is paid separately."
      ja: "月額39ユーロで、バダロナ・バルセロナ・サント・アドリア・ダ・バゾスのすべての稽古場所に通えます。入会金は無料で、体験稽古は2回まで受けられます。年間のスポーツ保険は別途です。"
  - q:
      es: "¿En qué idioma se dan las clases?"
      ca: "En quin idioma es fan les classes?"
      en: "What language are the classes in?"
      ja: "稽古は何語で行われますか。"
    a:
      es: "En español y en catalán, y en inglés siempre que hace falta. La terminología es japonesa, como en cualquier dojo, y se aprende sobre la marcha."
      ca: "En català i en castellà, i en anglès sempre que cal. La terminologia és japonesa, com a qualsevol dojo, i s'aprèn sobre la marxa."
      en: "In Spanish and Catalan, and in English whenever it is needed. The terminology is Japanese, as in any dojo, and you pick it up as you go."
      ja: "スペイン語とカタルーニャ語、必要に応じて英語でも行います。用語はどの道場とも同じく日本語で、稽古しながら自然に覚えられます。"
