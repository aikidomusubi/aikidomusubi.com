# Six on the first screen, six behind a button, and then the glossary.
  # Appended rather than inserted. _includes/ura.html reaches these by index —
  # sections[0] is the week, sections[7] the digest — so putting Recursos in
  # the middle of the list would silently retitle five other sections. It is
  # rendered between "Palabras del tatami" and "Enlaces"; only its position in
  # THIS list is arbitrary.
  - id: resources
    title: { es: "Recursos", ca: "Recursos", en: "Resources", ja: "資料" }
    sub:   { es: "Lo que hay que firmar y lo que hay que saber",
             ca: "El que cal signar i el que cal saber",
             en: "What has to be signed and what has to be known",
             ja: "署名するもの、知っておくこと" }

words:
