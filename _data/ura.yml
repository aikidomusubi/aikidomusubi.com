# Ura 裏 — the aside.
#
# In aikido every technique has an omote and an ura: the version that enters in
# front and the one that turns behind. They are not two techniques, they are two
# sides of one. This is the same site entering from behind.
#
# NOT A SECOND HOME PAGE. Everything here either changes on its own — the week,
# the calendar, the archive — or is a shorter, odder way of saying something a
# full page says at length. Nothing here is needed in order to come and train.
#
# WHAT IS GENERATED AND WHAT IS WRITTEN. The week comes from _data/schedule.yml,
# what is coming from _data/calendar.yml, the archive from _data/gallery.yml and
# the seminar log from _events/. Only the labels below are written by hand.

# ---------------------------------------------------------------------------
# Which class cancellations "what is coming" announces
#
# Ura is the aikido dojo's own aside, and this section is read by the people on
# the aikido mat. Judo, iaijutsu and karate are taught here too, and when one of
# them is off — most Saturdays that the dojo is given over to a masterclass or
# to gradings, karate is — that is a real fact, it belongs on the calendar and
# it is on the calendar. It is not news here.
#
# A LIST AND NOT A FLAG, so that adding a fifth art does not silently start
# announcing it. Aikido is the only entry, and anything not named here is
# carried by /calendario/ and by the day strip above and nowhere else.
#
# This does not touch the day strip: a cancelled class disappears from its day
# there whatever its category, because that grid answers "is there a class on
# Saturday" and the honest answer is no.
# ---------------------------------------------------------------------------
announce_cancellations: [aikido]

