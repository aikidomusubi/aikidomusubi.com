  - { kanji: "稽古", roman: "keiko", gloss: { es: "La práctica. Literalmente «pensar en lo antiguo»: se repite algo que otros repitieron antes.", ca: "La pràctica. Literalment «pensar en allò antic»: es repeteix allò que altres van repetir abans.", en: "Practice. Literally \"to think on the old\": you repeat what others repeated before you.", ja: "稽古。文字どおり「古（いにしえ）を考える」。先人が繰り返したことを繰り返します。" } }
  - { kanji: "礼", roman: "rei", gloss: { es: "El saludo. Abre y cierra la clase, y también cada práctica con cada compañero.", ca: "La salutació. Obre i tanca la classe, i també cada pràctica amb cada company.", en: "The bow. It opens and closes the class, and every practice with every partner.", ja: "礼。稽古の初めと終わり、そして相手ごとの稽古の初めと終わりに行います。" } }
  - { kanji: "受身", roman: "ukemi", gloss: { es: "La caída. La mitad del aikido consiste en aprender a recibir sin romperse.", ca: "La caiguda. La meitat de l'aikido consisteix a aprendre a rebre sense trencar-se.", en: "The fall. Half of aikido is learning to receive without breaking.", ja: "受身。合気道の半分は、壊れずに受けることを覚えることです。" } }
  - { kanji: "稽古着", roman: "keikogi", gloss: { es: "La ropa de práctica. Para las primeras clases basta con manga larga.", ca: "La roba de pràctica. Per a les primeres classes n'hi ha prou amb màniga llarga.", en: "The practice uniform. Long sleeves are enough for the first few classes.", ja: "稽古着。最初のうちは長袖の服装で十分です。" } }
  - { kanji: "産靈", roman: "musubi", gloss: { es: "El nudo: lo que une dos cosas y las deja unidas. De ahí el nombre del dojo.", ca: "El nus: allò que uneix dues coses i les deixa unides. D'aquí el nom del dojo.", en: "The knot: what binds two things and leaves them bound. Hence the name of the dojo.", ja: "結び。二つのものを結び、結ばれたままにするもの。道場の名はここから来ています。" } }

words_more:
  - { kanji: "取り・受け", roman: "tori / uke", gloss: { es: "Quien hace la técnica y quien la recibe. Se alternan sin parar.", ca: "Qui fa la tècnica i qui la rep. S'alternen sense parar.", en: "The one who performs the technique and the one who receives it. They swap constantly.", ja: "技をかける側と受ける側。絶えず入れ替わります。" } }
  - { kanji: "正座", roman: "seiza", gloss: { es: "Sentarse sobre los talones. Así empieza y termina cada clase.", ca: "Seure sobre els talons. Així comença i acaba cada classe.", en: "Sitting on your heels. Every class begins and ends this way.", ja: "正座。稽古はこの姿勢で始まり、この姿勢で終わります。" } }
  - { kanji: "お願いします", roman: "onegaishimasu", gloss: { es: "«Te lo pido, por favor.» Se le dice al compañero antes de practicar con él.", ca: "«T'ho demano, si us plau.» Es diu al company abans de practicar-hi.", en: "\"I ask this of you, please.\" Said to your partner before practising together.", ja: "お願いします。稽古を始める前に相手に伝える言葉です。" } }
  - { kanji: "ありがとうございました", roman: "arigatō gozaimashita", gloss: { es: "«Muchas gracias.» Se le dice al terminar.", ca: "«Moltes gràcies.» Es diu en acabar.", en: "\"Thank you very much.\" Said when you finish.", ja: "ありがとうございました。稽古を終えたときに伝える言葉です。" } }
  - { kanji: "段・級", roman: "dan / kyū", gloss: { es: "Los grados. Los kyu los examina el dojo; los dan quedan registrados en Tokio.", ca: "Els graus. Els kyu els examina el dojo; els dan queden registrats a Tòquio.", en: "The grades. Kyu grades are examined by the dojo; dan grades are registered in Tokyo.", ja: "段級。級の審査は道場で行い、段は東京に登録されます。" } }
  - { kanji: "師範", roman: "shihan", gloss: { es: "«Modelo a seguir.» El título de los maestros de grado alto que vienen a dar seminarios.", ca: "«Model a seguir.» El títol dels mestres de grau alt que vénen a fer seminaris.", en: "\"Model to follow.\" The title of the senior teachers who come to give seminars.", ja: "師範。講習会に招く高段者の称号です。" } }

# Four links, no gaps. Miyamoto Sensei is the connection to the Hombu Dojo.
chain:
  # `name` is the roman form every language uses; `name_ja` is what the
  # Japanese page shows instead. The Japanese here is the site's own — every
  # one of these already appears in _data/about.yml or _data/gallery.yml — so
  # the chain does not introduce a second spelling of anybody's name.
  - year: "1883–1969"
    name: "Morihei Ueshiba"
    name_ja: "植芝盛平"
    sub: { es: "Ō-Sensei, fundador del aikido", ca: "Ō-Sensei, fundador de l'aikido", en: "Ō-Sensei, founder of aikido", ja: "開祖・大先生" }
  - year: "1931"
    ongoing: true
    name: "Aikido Hombu Dojo"
    name_ja: "合気会本部道場"
    sub: { es: "Tokio, la sede mundial del Aikido", ca: "Tòquio, la seu mundial de l'Aikido", en: "Tokyo, the world headquarters of Aikido", ja: "東京・合気道の総本部" }
    detail: { es: "Aikido Doshu Ueshiba Moriteru / Aikido Hombu Dojo-cho Ueshiba Mitsuteru", ca: "Aikido Doshu Ueshiba Moriteru / Aikido Hombu Dojo-cho Ueshiba Mitsuteru", en: "Aikido Doshu Ueshiba Moriteru / Aikido Hombu Dojo-cho Ueshiba Mitsuteru", ja: "道主・植芝守央 / 本部道場長・植芝充央" }
  - year: "2020"
    ongoing: true
    name: "Arashi Group"
    name_ja: "嵐グループ"
    sub: { es: "Organización reconocida por el Aikido Hombu Dojo a la que pertenecemos", ca: "Organització reconeguda per l'Aikido Hombu Dojo a la qual pertanyem", en: "An organisation recognised by the Aikido Hombu Dojo, and the one we belong to", ja: "合気会本部道場に認められた団体で、私たちが所属しています" }
    detail: { es: "Vínculo a través de Tsuruzo Miyamoto Sensei, 8.º dan", ca: "Vincle a través de Tsuruzo Miyamoto Sensei, 8è dan", en: "Linked through Tsuruzo Miyamoto Sensei, 8th dan", ja: "宮本鶴蔵先生（八段）を通じてつながっています" }
  - year: "2008"
    ongoing: true
    name: "Aikido Musubi"
    name_ja: "合気道産靈"
    sub: { es: "Badalona, Barcelona", ca: "Badalona, Barcelona", en: "Badalona, Barcelona", ja: "バダロナ・バルセロナ" }


# The digest. Three cells, and the third is a paragraph rather than a list
# because "how to start" is a sentence, not a table.
essentials:
  where:  { es: "Dónde", ca: "On", en: "Where", ja: "場所" }
  cost:   { es: "Cuánto", ca: "Quant", en: "How much", ja: "費用" }
  start:  { es: "Cómo empezar", ca: "Com començar", en: "How to start", ja: "始めるには" }
  cost_rows:
    - { label: { es: "Inscripción", ca: "Inscripció", en: "Enrolment", ja: "入会金" },
        value: { es: "Gratuita, todo el año", ca: "Gratuïta, tot l'any", en: "Free, all year round", ja: "無料・通年" } }
    - { label: { es: "Prueba", ca: "Prova", en: "Trial", ja: "体験" },
        value: { es: "Dos clases, sin coste", ca: "Dues classes, sense cost", en: "Two classes, no charge", ja: "二回まで無料" } }
    - { label: { es: "Cuota", ca: "Quota", en: "Fee", ja: "月謝" },
        value: { es: "Mensual, según la actividad", ca: "Mensual, segons l'activitat", en: "Monthly, depending on the activity", ja: "活動により月額" } }
  start_text: { es: "Escríbenos con un día de antelación, dinos qué clase te interesa y te decimos cuándo venir. Ropa cómoda de manga larga; el keikogi ya llegará.", ca: "Escriu-nos amb un dia d'antelació, digues-nos quina classe t'interessa i et diem quan venir. Roba còmoda de màniga llarga; el keikogi ja arribarà.", en: "Write to us a day ahead, tell us which class interests you and we will tell you when to come. Comfortable long-sleeved clothes; the keikogi can wait.", ja: "前日までにご連絡ください。ご希望のクラスを伺い、お越しいただく日をお伝えします。長袖の動きやすい服装で。稽古着はあとからで大丈夫です。" }

# Month abbreviations. Liquid's `date: "%b"` returns English whatever the
# page language is, so the four languages are written out rather than
# formatted. Indexed 1-12 by the `%-m` of the date.
# Day and month, ordered the way each language orders them. Japanese puts the
# month first and closes with 日; the others put the day first.
date_fmt: { es: "DD MM", ca: "DD MM", en: "DD MM", ja: "MMDD日" }

# The same date with the year on it. The seminar log does not need one: its
# rows sit inside a year accordion. "What is coming" does — it is one flat run
# that reaches the last seminar on the books, fifteen months out.
date_fmt_y: { es: "DD MM YYYY", ca: "DD MM YYYY", en: "DD MM YYYY", ja: "YYYY年MMDD日" }

