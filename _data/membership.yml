# Online signup and fee collection: the site's half and the server's half.
#
# ONE FILE FOR BOTH. The signup page renders from this, and the Worker in
# services/membership bundles it through scripts/gen-catalog.mjs, so the page
# and the server show the SAME error message, link to the SAME terms version and
# send people to the SAME URLs. Prices are not here: they are in fees.yml, which
# both sides also read.
#
# Placeholders in braces — {n}, {name}, {amount}, {date} — are filled in by
# whoever renders the string, page script or server. Never translate them.
#
# Spec: "Aikido Musubi — Online Membership Signup & Stripe Billing Spec",
# 14 October 2026, with the decisions of the same day: layout B (people first),
# the rate chosen per person, the payer picked from the people listed.

# The membership terms in force. Every signup records it; a new version of the
# terms page is a new value here AND a new page, with the old one kept.
terms_version: "2027-01"

max_people: 6

# Where the page posts. A local dev session overrides it with
# `membership_endpoint` in _config.dev.yml.
endpoint: "https://api.aikidomusubi.com"

# Stripe's no-code customer portal login link, per Stripe mode. Stripe shows it
# under Settings > Billing > Customer portal once the portal is switched on.
# The site's own build uses `live`; the Worker uses whichever matches its mode.
portal_url:
  test: ""
  live: ""

# Stripe Checkout has no Catalan. Catalan pages pay in Spanish, and the page
# says so in one line (ui.ca_note).
stripe_locale: { es: es, ca: es, en: en, ja: ja }

# What we write on Stripe's own pages. Catalan readers see Stripe in Spanish,
# so these follow `stripe_locale` rather than the page language.
stripe:
  # custom_text.submit.message: the last thing read before "Subscribe" (spec 11.1).
  submit:
    es: "Al confirmar te comprometes a pagar una cuota periódica: hoy, la parte proporcional hasta el {first}; desde el {first}, {amount} {unit}, hasta que te des de baja. Puedes desistir hasta el {withdraw}."
    en: "By confirming you agree to pay a recurring fee: today, the share up to {first}; from {first}, {amount} {unit}, until you cancel. You can withdraw until {withdraw}."
    ja: "確定すると、定期的な会費のお支払いに同意したことになります。本日は{first}までの日割り分、{first}以降は退会まで{amount}{unit}をお支払いいただきます。{withdraw}までクーリングオフが可能です。"
  submit_none:
    es: "Al confirmar te comprometes a pagar una cuota periódica: hoy no se cobra nada; desde el {first}, {amount} {unit}, hasta que te des de baja. Puedes desistir hasta el {withdraw}."
    en: "By confirming you agree to pay a recurring fee: nothing today; from {first}, {amount} {unit}, until you cancel. You can withdraw until {withdraw}."
    ja: "確定すると、定期的な会費のお支払いに同意したことになります。本日のお支払いはなく、{first}以降は退会まで{amount}{unit}をお支払いいただきます。{withdraw}までクーリングオフが可能です。"
  # custom_text.terms_of_service_acceptance.message; Stripe renders the link.
  terms:
    es: "Acepto las [condiciones de la cuota]({url})."
    en: "I accept the [membership terms]({url})."
    ja: "[会費規約]({url})に同意します。"
  # The subscription's description, which the member sees in the portal.
  description:
    es: "Cuota {period} · {people}"
    en: "{period} membership · {people}"
    ja: "会費（{period}）・{people}"

urls:
  signup:        { es: /inscripcion/,              ca: /ca/inscripcio/,              en: /en/sign-up/,             ja: /ja/sign-up/ }
  thanks:        { es: /inscripcion/gracias/,      ca: /ca/inscripcio/gracies/,      en: /en/sign-up/thank-you/,   ja: /ja/sign-up/thank-you/ }
  members:       { es: /miembros/,                 ca: /ca/membres/,                 en: /en/members/,             ja: /ja/members/ }
  terms:         { es: /condiciones-de-la-cuota/,  ca: /ca/condicions-de-la-quota/,  en: /en/membership-terms/,    ja: /ja/membership-terms/ }
  withdrawal:    { es: /desistimiento/,            ca: /ca/desistiment/,             en: /en/withdrawal/,          ja: /ja/withdrawal/ }
  withdrawal_ok: { es: /desistimiento/recibido/,   ca: /ca/desistiment/rebut/,       en: /en/withdrawal/received/, ja: /ja/withdrawal/received/ }
  fees:          { es: /cuotas/,                   ca: /ca/quotes/,                  en: /en/fees/,                ja: /ja/fees/ }
  resources:     { es: /recursos/,                 ca: /ca/recursos/,                en: /en/resources/,           ja: /ja/resources/ }
  contact:       { es: /contacto/,                 ca: /ca/contacte/,                en: /en/contact/,             ja: /ja/contact/ }
  privacy:       { es: /politica-privacidad/,      ca: /ca/politica-privadesa/,      en: /en/privacy-policy/,      ja: /ja/privacy-policy/ }

# ---------------------------------------------------------------------------
# The signup page
#
# Addressed to the person filling it in, in the singular ("tú"), because that is
# one person at a keyboard however many people they sign up.
# ---------------------------------------------------------------------------
ui:
  # The line under the cards on /cuotas/.
  fees_line:
    es: "La cuota se cobra el día 5, con tarjeta o domiciliación, a través de Stripe. ¿Ya tienes cuota? <a href=\"{url}\">Área de miembros</a>."
    ca: "La quota es cobra el dia 5, amb targeta o domiciliació, a través de Stripe. Ja tens quota? <a href=\"{url}\">Àrea de membres</a>."
    en: "The fee is charged on the 5th, by card or direct debit, through Stripe. Already a member? <a href=\"{url}\">Members area</a>."
    ja: "会費は毎月5日に、カードまたは口座振替でStripeを通じてお支払いいただきます。会員の方は<a href=\"{url}\">会員ページ</a>へ。"
  eyebrow:   { es: "Cuotas · Inscripción", ca: "Quotes · Inscripció", en: "Fees · Sign up", ja: "月謝・入会申し込み" }
  lede:
    es: "Normalmente te inscribes después de las dos clases de prueba. No hay matrícula, y la cuota se cobra sola el día 5, con tarjeta o domiciliación bancaria, en una página segura de Stripe. Son cuatro pasos y unos tres minutos."
    ca: "Normalment t'inscrius després de les dues classes de prova. No hi ha matrícula, i la quota es cobra sola el dia 5, amb targeta o domiciliació bancària, en una pàgina segura de Stripe. Són quatre passos i uns tres minuts."
    en: "People usually sign up after their two trial classes. There is no registration fee, and the fee is charged automatically on the 5th, by card or SEPA direct debit, on a secure Stripe page. Four steps, about three minutes."
    ja: "通常は2回の体験稽古のあとにお申し込みいただきます。入会金はなく、月謝は毎月5日に、カードまたはSEPA口座振替で、Stripeの安全なページから自動的にお支払いいただきます。4つのステップで、3分ほどです。"
  member:
    es: "¿Ya tienes cuota? <a href=\"{url}\">Ve a tu área de miembros</a> para cambiar la tarjeta, descargar recibos o darte de baja."
    ca: "Ja tens quota? <a href=\"{url}\">Ves a la teva àrea de membres</a> per canviar la targeta, descarregar rebuts o donar-te de baixa."
    en: "Already a member? <a href=\"{url}\">Go to your members area</a> to change your card, download receipts or cancel."
    ja: "すでに会員の方は、<a href=\"{url}\">会員ページ</a>からカードの変更、領収書のダウンロード、退会ができます。"
  steps_label: { es: "Pasos de la inscripción", ca: "Passos de la inscripció", en: "Signup steps", ja: "申し込みの手順" }
  step_of:     { es: "Paso {n} de 4", ca: "Pas {n} de 4", en: "Step {n} of 4", ja: "ステップ {n}／4" }
  step_done:   { es: "hecho", ca: "fet", en: "done", ja: "完了" }
  steps:
    - { es: "Quién entrena", ca: "Qui entrena", en: "Who trains", ja: "稽古する人" }
    - { es: "Cómo pagas", ca: "Com pagues", en: "How you pay", ja: "支払い方法" }
    - { es: "Quién paga", ca: "Qui paga", en: "Who pays", ja: "お支払いをする人" }
    - { es: "Revisar y pagar", ca: "Revisar i pagar", en: "Review and pay", ja: "確認とお支払い" }
  required: { es: "(obligatorio)", ca: "(obligatori)", en: "(required)", ja: "（必須）" }
  optional: { es: "(opcional)", ca: "(opcional)", en: "(optional)", ja: "（任意）" }
  continue: { es: "Continuar", ca: "Continuar", en: "Continue", ja: "次へ" }
  back:     { es: "Volver", ca: "Tornar", en: "Back", ja: "戻る" }
  change:   { es: "Cambiar", ca: "Canviar", en: "Change", ja: "変更" }
  honeypot: { es: "Deja este campo vacío", ca: "Deixa aquest camp buit", en: "Leave this field empty", ja: "この欄は空のままにしてください" }

  # Step 1
  s1_sub:
    es: "Las personas del mismo núcleo familiar que van a entrenar, hasta seis. Quien paga no tiene por qué entrenar: lo dirás en el paso 3."
    ca: "Les persones del mateix nucli familiar que entrenaran, fins a sis. Qui paga no ha d'entrenar per força: ho diràs al pas 3."
    en: "The people in one household who will train, up to six. The person who pays need not train: you say who pays in step 3."
    ja: "同じ世帯で稽古する方を、6人まで入力してください。お支払いをする方は稽古しなくてもかまいません（ステップ3で指定します）。"
  person:      { es: "Persona {n}", ca: "Persona {n}", en: "Person {n}", ja: "{n}人目" }
  people_1:    { es: "1 persona", ca: "1 persona", en: "1 person", ja: "1名" }
  people_n:    { es: "{n} personas", ca: "{n} persones", en: "{n} people", ja: "{n}名" }
  add_person:  { es: "Añadir otra persona", ca: "Afegir una altra persona", en: "Add another person", ja: "人を追加" }
  add_person_n: { es: "Añadir a la persona {n}", ca: "Afegir la persona {n}", en: "Add person {n}", ja: "{n}人目を追加" }
  remove:      { es: "Quitar a la persona {n}", ca: "Treure la persona {n}", en: "Remove person {n}", ja: "{n}人目を削除" }
  given:       { es: "Nombre", ca: "Nom", en: "Given name", ja: "名" }
  family:      { es: "Apellidos", ca: "Cognoms", en: "Family name", ja: "姓" }
  age:         { es: "Edad", ca: "Edat", en: "Age", ja: "年齢" }
  adult:       { es: "17 años o más", ca: "17 anys o més", en: "17 and over", ja: "17歳以上" }
  youth:       { es: "Hasta 16 años", ca: "Fins a 16 anys", en: "Up to 16", ja: "16歳まで" }
  adult_short: { es: "17 o más", ca: "17 o més", en: "17+", ja: "17歳以上" }
  youth_short: { es: "hasta 16", ca: "fins a 16", en: "up to 16", ja: "16歳まで" }
  bmonth:      { es: "Mes de nacimiento", ca: "Mes de naixement", en: "Month of birth", ja: "生まれた月" }
  byear:       { es: "Año de nacimiento", ca: "Any de naixement", en: "Year of birth", ja: "生まれた年" }
  choose:      { es: "Elige", ca: "Tria", en: "Choose", ja: "選択" }
  bhint:
    es: "Solo el mes y el año: sirven para aplicar la cuota hasta 16 y pasar a la de 17 o más a su tiempo."
    ca: "Només el mes i l'any: serveixen per aplicar la quota fins a 16 i passar a la de 17 o més quan toqui."
    en: "Only the month and year: they decide the up-to-16 fee and when it becomes the 17-and-over one."
    ja: "生まれた年と月のみ。16歳までの料金の適用と、17歳以上の料金への切り替えに使います。"
  months:
    es: ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"]
    ca: ["gener", "febrer", "març", "abril", "maig", "juny", "juliol", "agost", "setembre", "octubre", "novembre", "desembre"]
    en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
    ja: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]
  rate:         { es: "Cuota", ca: "Quota", en: "Fee", ja: "料金" }
  rate_general: { es: "General · todos los espacios", ca: "General · tots els espais", en: "General · every space", ja: "一般・すべての稽古場所" }
  rate_sc:      { es: "Con abono municipal", ca: "Amb abonament municipal", en: "Sports-centre member", ja: "市立施設の会員" }
  venue:        { es: "¿De qué polideportivo?", ca: "De quin poliesportiu?", en: "Which sports centre?", ja: "どの施設の会員ですか" }
  sc_cond:
    es: "{amount} al mes, solo las clases de {venue}, y solo mes a mes. Trae el abono a la primera clase. No cuenta para el descuento familiar."
    ca: "{amount} al mes, només les classes de {venue}, i només mes a mes. Porta l'abonament a la primera classe. No compta per al descompte familiar."
    en: "{amount} a month, classes at {venue} only, monthly only. Bring your membership card to the first class. It does not count towards the family discount."
    ja: "月{amount}。{venue}での稽古のみ、月払いのみです。初回の稽古に会員証をお持ちください。家族割の対象にはなりません。"
  side_h: { es: "Antes de empezar", ca: "Abans de començar", en: "Before you start", ja: "はじめる前に" }
  side:
    - { es: "Primero, las dos clases de prueba. Son gratis.", ca: "Primer, les dues classes de prova. Són gratis.", en: "First, the two trial classes. They are free.", ja: "まずは2回の体験稽古から。無料です。" }
    - { es: "Sin matrícula.", ca: "Sense matrícula.", en: "No registration fee.", ja: "入会金はありません。" }
    - { es: "En una familia, la primera persona paga la cuota completa y cada una de las siguientes, 15 € menos al mes.", ca: "En una família, la primera persona paga la quota completa i cadascuna de les següents, 15 € menys al mes.", en: "In a household, the first person pays the full fee and each one after that 15 € less a month.", ja: "家族の場合、1人目は通常料金、2人目以降はひとりにつき月15ユーロ引きです。" }
    - { es: "Pagas en Stripe con tarjeta o domiciliación SEPA. Aquí no se escribe ningún dato bancario.", ca: "Pagues a Stripe amb targeta o domiciliació SEPA. Aquí no s'escriu cap dada bancària.", en: "You pay on Stripe by card or SEPA direct debit. No bank details are typed on this page.", ja: "お支払いはStripeでカードまたはSEPA口座振替。このページで銀行情報を入力することはありません。" }
    - { es: "Te das de baja cuando quieras, desde tu área de miembros.", ca: "Et dones de baixa quan vulguis, des de la teva àrea de membres.", en: "Cancel whenever you like, from your members area.", ja: "退会はいつでも会員ページからできます。" }
  side_contact:
    es: "¿Dudas? <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a> · WhatsApp <a href=\"https://wa.me/34717171177\">717 171 177</a>"
    ca: "Dubtes? <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a> · WhatsApp <a href=\"https://wa.me/34717171177\">717 171 177</a>"
    en: "Questions? <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a> · WhatsApp <a href=\"https://wa.me/34717171177\">+34 717 171 177</a>"
    ja: "ご質問は <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a>・WhatsApp <a href=\"https://wa.me/34717171177\">+34 717 171 177</a> まで"

  # Step 2
  s2_sub:
    es: "Precios para las personas que has indicado. Se paga toda junta, en el mismo periodo."
    ca: "Preus per a les persones que has indicat. Es paga tota junta, en el mateix període."
    en: "Prices for the people you have listed. The household pays together, on one billing period."
    ja: "入力した方々の料金です。世帯でまとめて、同じ期間でお支払いいただきます。"
  period:    { es: "Periodo", ca: "Període", en: "Billing period", ja: "支払い期間" }
  per_month: { es: "{amount} al mes", ca: "{amount} al mes", en: "{amount} a month", ja: "月あたり{amount}" }
  saving:    { es: "{amount} menos que mes a mes", ca: "{amount} menys que mes a mes", en: "{amount} less than monthly", ja: "月払いより{amount}お得" }
  gift:      { es: "+ {n} keikogi de regalo", ca: "+ {n} keikogi de regal", en: "+ {n} free keikogi", ja: "＋稽古着{n}着を進呈" }
  best:      { es: "El que más ahorra", ca: "El que més estalvia", en: "Best value", ja: "いちばんお得" }
  unavailable_sc: { es: "No disponible con abono municipal", ca: "No disponible amb abonament municipal", en: "Not available with a sports-centre rate", ja: "市立施設の会員料金では選べません" }
  why_sc:
    es: "<b>Por qué solo mensual:</b> alguien tiene la cuota con abono municipal, que es mes a mes, y una familia paga toda junta en el mismo periodo. Para pagar por trimestre o por año, elige la cuota general para todas las personas."
    ca: "<b>Per què només mensual:</b> algú té la quota amb abonament municipal, que és mes a mes, i una família paga tota junta en el mateix període. Per pagar per trimestre o per any, tria la quota general per a totes les persones."
    en: "<b>Why monthly only:</b> someone is on a sports-centre rate, which is monthly, and a household pays together on one period. To pay by the quarter or the year, choose the general fee for everyone."
    ja: "<b>月払いのみの理由：</b>市立施設の会員料金（月払いのみ）の方が含まれており、世帯は同じ期間でまとめて支払うためです。3か月払い・年払いにするには、全員を一般料金にしてください。"
  keikogi_cond:
    es: "Con trimestral o anual, cada persona recibe un keikogi en su primera inscripción. Lo damos en el dojo cuando se ha cobrado el primer trimestre o año completo y han pasado los 14 días para desistir."
    ca: "Amb trimestral o anual, cada persona rep un keikogi en la seva primera inscripció. El donem al dojo quan s'ha cobrat el primer trimestre o any complet i han passat els 14 dies per desistir."
    en: "On a quarterly or annual plan, each person receives a keikogi on their first enrolment. We hand it over at the dojo once the first full quarter or year has been paid and the 14 days to withdraw are over."
    ja: "3か月払い・年払いでは、初回入会時にお一人ずつ稽古着を差し上げます。最初の3か月分・1年分のお支払いが済み、14日間のクーリングオフ期間が過ぎたあと、道場でお渡しします。"
  how_price: { es: "Cómo sale este precio", ca: "Com surt aquest preu", en: "How this price is worked out", ja: "料金の内訳" }
  kind_full:   { es: "cuota completa", ca: "quota completa", en: "full fee", ja: "通常料金" }
  kind_family: { es: "familia (−{amount})", ca: "família (−{amount})", en: "family (−{amount})", ja: "家族割（−{amount}）" }
  kind_sc:     { es: "abono {venue}", ca: "abonament {venue}", en: "{venue} member", ja: "{venue}会員" }
  total:       { es: "Total", ca: "Total", en: "Total", ja: "合計" }
  base_line:
    es: "Pagando mes a mes serían {amount}."
    ca: "Pagant mes a mes serien {amount}."
    en: "Paying monthly, it would be {amount}."
    ja: "月払いの場合は{amount}です。"
  when_h: { es: "Cuándo se cobra", ca: "Quan es cobra", en: "When it is charged", ja: "お支払いのタイミング" }
  when_b:
    es: "Al inscribirte pagas la parte proporcional hasta el día 5, y después la cuota completa cada día 5. Con tarjeta se cobra en el momento; la domiciliación tarda unos días, y Stripe te avisa antes de cada cargo."
    ca: "En inscriure't pagues la part proporcional fins al dia 5, i després la quota completa cada dia 5. Amb targeta es cobra al moment; la domiciliació triga uns dies, i Stripe t'avisa abans de cada càrrec."
    en: "When you sign up you pay the share up to the 5th, then the full fee on every 5th. A card is charged at once; a direct debit takes a few days, and Stripe tells you before each one."
    ja: "申し込み時に次の5日までの日割り分をお支払いいただき、その後は毎回5日に全額をお支払いいただきます。カードはすぐに決済され、口座振替は数日かかります。引き落としの前にStripeからお知らせが届きます。"

  # Step 3
  s3_sub:
    es: "La persona titular recibe los recibos y los avisos, y es quien entra en el área de miembros."
    ca: "La persona titular rep els rebuts i els avisos, i és qui entra a l'àrea de membres."
    en: "The account holder receives the receipts and notices, and is the one who signs in to the members area."
    ja: "名義人には領収書やお知らせが届き、会員ページにログインできます。"
  holder:        { es: "¿Quién es titular de la cuota?", ca: "Qui és titular de la quota?", en: "Who is the account holder?", ja: "名義人はどなたですか" }
  holder_trains: { es: "Entrena", ca: "Entrena", en: "Trains", ja: "稽古する人" }
  holder_other:  { es: "Otra persona", ca: "Una altra persona", en: "Someone else", ja: "それ以外の方" }
  holder_other_sub: { es: "Paga, pero no entrena", ca: "Paga, però no entrena", en: "Pays but does not train", ja: "支払いのみ・稽古はしない" }
  holder_hint:
    es: "Solo aparecen las personas de 17 años o más: quien paga tiene que ser mayor de edad."
    ca: "Només hi apareixen les persones de 17 anys o més: qui paga ha de ser major d'edat."
    en: "Only people aged 17 or over are offered: the account holder must be an adult."
    ja: "17歳以上の方のみ表示しています。名義人は成人である必要があります。"
  email:       { es: "Correo electrónico", ca: "Correu electrònic", en: "Email", ja: "メールアドレス" }
  email_hint:
    es: "Con este correo entrarás en tu área de miembros. Sin contraseña."
    ca: "Amb aquest correu entraràs a la teva àrea de membres. Sense contrasenya."
    en: "This is how you will sign in to your members area. No password."
    ja: "会員ページへのログインに使います。パスワードはありません。"
  phone:       { es: "Teléfono", ca: "Telèfon", en: "Phone", ja: "電話番号" }
  phone_hint:  { es: "Solo por si hay que avisarte de algo.", ca: "Només per si cal avisar-te d'alguna cosa.", en: "Only in case we need to reach you.", ja: "ご連絡が必要な場合のみ使います。" }
  declare:     { es: "Lo declara quien rellena este formulario:", ca: "Ho declara qui omple aquest formulari:", en: "Declared by the person filling in this form:", ja: "このフォームに記入している方の申告：" }
