  guardian_hint:
    es: "Aparece porque hay alguna persona hasta 16 años. Si alguien de 17 está en la lista, también te corresponde a ti."
    ca: "Apareix perquè hi ha alguna persona fins a 16 anys. Si algú de 17 és a la llista, també et correspon a tu."
    en: "Shown because someone up to 16 is listed. If a 17-year-old is listed, this applies to them too."
    ja: "16歳までの方が含まれているため表示しています。17歳の方が含まれる場合も同様です。"
  stripe_name:
    es: "El nombre de la tarjeta o de la cuenta lo pedirá Stripe en el último paso. Puede ser otro: una cuenta a nombre de otra persona de la familia también vale."
    ca: "El nom de la targeta o del compte el demanarà Stripe a l'últim pas. Pot ser un altre: un compte a nom d'una altra persona de la família també serveix."
    en: "Stripe asks for the name on the card or bank account at the last step. It may be a different name: an account held by someone else in the family is fine."
    ja: "カードや口座の名義は、最後のステップでStripeが確認します。ご家族名義の口座でもかまいません。"
  ca_note:
    ca: "Stripe no té català: la pàgina de pagament i els seus rebuts seran en castellà. Els nostres correus, en català."

  # Step 4
