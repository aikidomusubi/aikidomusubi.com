# ---------------------------------------------------------------------------
# The other pages
# ---------------------------------------------------------------------------
thanks:
  title: { es: "Inscripción hecha", ca: "Inscripció feta", en: "You are signed up", ja: "お申し込みが完了しました" }
  lede:
    es: "Gracias. Ya tienes cuota y puedes entrenar desde hoy en todos los espacios que incluye. Esto es lo que queda:"
    ca: "Gràcies. Ja tens quota i pots entrenar des d'avui a tots els espais que inclou. Això és el que queda:"
    en: "Thank you. Your membership is active and you can train from today at every space it covers. This is what is left:"
    ja: "ありがとうございます。会費のお手続きが完了し、本日から対象のすべての稽古場所で稽古できます。残りの手順は次のとおりです："
  steps:
    - es: "<b>Mira tu correo.</b> Te llegan dos mensajes: el recibo de Stripe y nuestra confirmación, con las condiciones y las fechas de cobro. Si no los ves en unos minutos, revisa el correo no deseado."
      ca: "<b>Mira el teu correu.</b> Et-n'arriben dos: el rebut de Stripe i la nostra confirmació, amb les condicions i les dates de cobrament. Si no els veus d'aquí a uns minuts, revisa el correu brossa."
      en: "<b>Check your email.</b> Two messages are on their way: Stripe's receipt and our confirmation, with the terms and the charge dates. If they have not arrived in a few minutes, look in your spam folder."
      ja: "<b>メールをご確認ください。</b>Stripeの領収書と、規約とお支払い日を記載した当会からの確認メールの2通が届きます。数分たっても届かない場合は、迷惑メールフォルダをご確認ください。"
    - es: "<b>Trae al dojo la hoja de inscripción firmada</b>, una por persona, y la autorización de uso de imagen. Para menores de 14, también la autorización para menores. Están en <a href=\"{resources}\">Recursos</a>."
      ca: "<b>Porta al dojo el full d'inscripció signat</b>, un per persona, i l'autorització d'ús d'imatge. Per a menors de 14, també l'autorització per a menors. Són a <a href=\"{resources}\">Recursos</a>."
      en: "<b>Bring the signed enrolment form to the dojo</b>, one per person, and the image release. For anyone under 14, the consent for minors too. They are on the <a href=\"{resources}\">Resources</a> page."
      ja: "<b>署名した入会申込書を道場にお持ちください。</b>お一人につき1枚、肖像使用の同意書も一緒に。14歳未満の方は保護者同意書も必要です。書類は<a href=\"{resources}\">資料</a>ページにあります。"
    - es: "<b>Si has pagado con domiciliación</b>, el cargo tarda unos días en confirmarse. No tienes que hacer nada: si el banco lo rechaza, te escribimos."
      ca: "<b>Si has pagat amb domiciliació</b>, el càrrec triga uns dies a confirmar-se. No has de fer res: si el banc el rebutja, t'escrivim."
      en: "<b>If you paid by direct debit</b>, the charge takes a few days to confirm. You need do nothing: if the bank turns it down, we will write to you."
      ja: "<b>口座振替でお支払いの場合</b>、引き落としの確定には数日かかります。手続きは不要です。銀行で引き落としができなかった場合はご連絡します。"
    - es: "<b>Si has elegido trimestre o año</b>, el keikogi te espera en el dojo cuando se cobre el primer periodo completo. Te avisamos por correo."
      ca: "<b>Si has triat trimestre o any</b>, el keikogi t'espera al dojo quan es cobri el primer període complet. T'avisem per correu."
      en: "<b>If you chose a quarter or a year</b>, your keikogi will be waiting at the dojo once the first full period has been paid. We will email you."
      ja: "<b>3か月払い・年払いをお選びの場合</b>、最初の期間のお支払いが済んだら、稽古着を道場でお渡しします。メールでお知らせします。"
  members_h: { es: "Tu área de miembros", ca: "La teva àrea de membres", en: "Your members area", ja: "会員ページ" }
  members_b:
    es: "Para cambiar la tarjeta o la cuenta, descargar recibos o darte de baja. Entras con tu correo y un código."
    ca: "Per canviar la targeta o el compte, descarregar rebuts o donar-te de baixa. Hi entres amb el teu correu i un codi."
    en: "To change your card or bank account, download receipts or cancel. You sign in with your email and a code."
    ja: "カードや口座の変更、領収書のダウンロード、退会ができます。メールアドレスと確認コードでログインします。"
  members_go: { es: "Ir al área de miembros", ca: "Anar a l'àrea de membres", en: "Go to the members area", ja: "会員ページへ" }
  withdraw_h: { es: "¿Has cambiado de idea?", ca: "Has canviat d'idea?", en: "Changed your mind?", ja: "お申し込みを取り消したい場合" }
  withdraw_b:
    es: "Tienes 14 días para desistir, sin dar explicaciones. Pagas solo los días transcurridos."
    ca: "Tens 14 dies per desistir, sense donar explicacions. Pagues només els dies transcorreguts."
    en: "You have 14 days to withdraw, with no reason needed. You pay only for the days that have passed."
    ja: "14日以内であれば、理由を問わず解約できます。お支払いは経過した日数分のみです。"
  withdraw_go: { es: "Desistir del contrato", ca: "Desistir del contracte", en: "Withdraw from the contract", ja: "契約を解約する" }

members:
  lede:
    es: "Tu cuota se gestiona en una página segura de Stripe. Entras con el correo con el que te inscribiste y un código que te llega en ese momento. No hay contraseña que recordar."
    ca: "La teva quota es gestiona en una pàgina segura de Stripe. Hi entres amb el correu amb què et vas inscriure i un codi que et arriba en aquell moment. No hi ha cap contrasenya per recordar."
    en: "Your membership is managed on a secure Stripe page. You sign in with the email you signed up with and a code sent to it there and then. There is no password to remember."
    ja: "会費の管理はStripeの安全なページで行います。お申し込み時のメールアドレスと、その場で届く確認コードでログインします。パスワードはありません。"
  go:         { es: "Ir a mi cuota", ca: "Anar a la meva quota", en: "Go to my membership", ja: "会費の管理へ" }
  soon:
    es: "El área de miembros se abre con el pago en línea, en enero de 2027."
    ca: "L'àrea de membres s'obre amb el pagament en línia, el gener de 2027."
    en: "The members area opens with online payment, in January 2027."
    ja: "会員ページは、オンライン決済の開始とともに2027年1月に公開します。"
  self_h:     { es: "Lo haces tú, al momento", ca: "Ho fas tu, al moment", en: "Do it yourself, straight away", ja: "ご自身ですぐにできること" }
  self:
    - { es: "Cambiar la tarjeta o la cuenta bancaria", ca: "Canviar la targeta o el compte bancari", en: "Change your card or bank account", ja: "カード・口座の変更" }
    - { es: "Actualizar el nombre, la dirección o el teléfono", ca: "Actualitzar el nom, l'adreça o el telèfon", en: "Update your name, address or phone", ja: "氏名・住所・電話番号の更新" }
    - { es: "Descargar los recibos", ca: "Descarregar els rebuts", en: "Download your receipts", ja: "領収書のダウンロード" }
    - { es: "Darte de baja, al final del periodo pagado", ca: "Donar-te de baixa, al final del període pagat", en: "Cancel, at the end of the paid period", ja: "退会（お支払い済み期間の終わりに適用）" }
  ask_h:      { es: "Escríbenos y lo hacemos", ca: "Escriu-nos i ho fem", en: "Write to us and we will do it", ja: "ご連絡いただければ対応すること" }
  ask:
    - { es: "Añadir o quitar personas", ca: "Afegir o treure persones", en: "Add or remove people", ja: "人の追加・削除" }
    - { es: "Pasar de mensual a trimestral o anual", ca: "Passar de mensual a trimestral o anual", en: "Switch between monthly, quarterly and annual", ja: "支払い期間の変更" }
    - { es: "Cambiar el correo de la cuota", ca: "Canviar el correu de la quota", en: "Change the email on the membership", ja: "登録メールアドレスの変更" }
    - { es: "La cuota con abono municipal", ca: "La quota amb abonament municipal", en: "The sports-centre rate", ja: "市立施設の会員料金" }
  how_h:      { es: "Cómo se entra", ca: "Com s'hi entra", en: "How to sign in", ja: "ログインの方法" }
  how:
    - { es: "Pulsa <b>Ir a mi cuota</b> y escribe tu correo.", ca: "Prem <b>Anar a la meva quota</b> i escriu el teu correu.", en: "Press <b>Go to my membership</b> and type your email.", ja: "<b>会費の管理へ</b>を押し、メールアドレスを入力します。" }
    - { es: "Stripe te envía un código de seis cifras. Cópialo o pégalo.", ca: "Stripe t'envia un codi de sis xifres. Copia'l o enganxa'l.", en: "Stripe sends you a six-digit code. Type or paste it.", ja: "Stripeから6桁のコードが届きます。入力するか貼り付けてください。" }
    - { es: "Ya estás dentro. ¿No te llega? Mira el correo no deseado, o escríbenos: puede que te inscribieras con otro correo.", ca: "Ja hi ets. No t'arriba? Mira el correu brossa, o escriu-nos: potser et vas inscriure amb un altre correu.", en: "You are in. No code? Look in your spam folder, or write to us: you may have signed up with another address.", ja: "ログイン完了です。コードが届かない場合は迷惑メールフォルダをご確認いただくか、ご連絡ください。別のアドレスで登録された可能性があります。" }

withdrawal:
  lede:
    es: "Durante los 14 días siguientes a tu inscripción puedes desistir sin dar explicaciones. Te devolvemos lo pagado en 14 días como máximo, por el mismo medio, menos los días transcurridos hasta hoy si pediste empezar a entrenar enseguida."
    ca: "Durant els 14 dies següents a la teva inscripció pots desistir sense donar explicacions. Et retornem el que has pagat en 14 dies com a màxim, pel mateix mitjà, menys els dies transcorreguts fins avui si vas demanar començar a entrenar de seguida."
    en: "For 14 days after you sign up you can withdraw without giving a reason. We refund what you paid within 14 days, by the same means, less the days up to today if you asked to start training straight away."
    ja: "お申し込みから14日以内であれば、理由を問わず解約できます。お支払い済みの金額は、同じ方法で14日以内に返金します。すぐに稽古を始めることを希望された場合は、本日までの日数分を差し引きます。"
  after:
    es: "¿Pasados los 14 días? Entonces es una baja: <a href=\"{url}\">hazla en tu área de miembros</a>."
    ca: "Passats els 14 dies? Aleshores és una baixa: <a href=\"{url}\">fes-la a la teva àrea de membres</a>."
    en: "More than 14 days? Then it is a cancellation: <a href=\"{url}\">do it in your members area</a>."
    ja: "14日を過ぎている場合は退会のお手続きとなります。<a href=\"{url}\">会員ページ</a>からお手続きください。"
  name:      { es: "Nombre y apellidos", ca: "Nom i cognoms", en: "Full name", ja: "氏名" }
  email:     { es: "Correo con el que te inscribiste", ca: "Correu amb què et vas inscriure", en: "The email you signed up with", ja: "お申し込み時のメールアドレス" }
  statement: { es: "Tu declaración", ca: "La teva declaració", en: "Your statement", ja: "申告内容" }
  statement_default:
    es: "Por la presente comunico que desisto de mi contrato de cuota de entrenamiento con la {org}."
    ca: "Per la present comunico que desisteixo del meu contracte de quota d'entrenament amb {org}."
    en: "I hereby give notice that I withdraw from my contract for a training membership with the {org}."
    ja: "{org}との会費契約を解約することを通知します。"
  statement_hint: { es: "Ya viene escrita; puedes cambiarla o añadir lo que quieras.", ca: "Ja ve escrita; pots canviar-la o afegir-hi el que vulguis.", en: "It is already written; change it or add anything you like.", ja: "あらかじめ記入してあります。必要に応じて変更・追記してください。" }
  confirm:   { es: "Confirmar desistimiento", ca: "Confirmar el desistiment", en: "Confirm withdrawal", ja: "解約を確定する" }
  confirm_note: { es: "Al confirmar, te enviamos un acuse con el contenido, la fecha y la hora.", ca: "En confirmar, t'enviem un justificant amb el contingut, la data i l'hora.", en: "When you confirm, we send you an acknowledgement with the content, date and time.", ja: "確定すると、内容と日時を記載した受領通知をお送りします。" }
  ok_title:  { es: "Desistimiento recibido", ca: "Desistiment rebut", en: "Withdrawal received", ja: "解約を受け付けました" }
  ok_lede:
    es: "Lo hemos recibido. Te hemos enviado un acuse por correo con esta misma información, la fecha y la hora."
    ca: "L'hem rebut. T'hem enviat un justificant per correu amb aquesta mateixa informació, la data i l'hora."
    en: "We have received it. We have emailed you an acknowledgement with this information, the date and the time."
    ja: "受け付けました。内容と日時を記載した受領通知をメールでお送りしました。"
  ok_at:     { es: "Recibido el {date} a las {time} (hora peninsular)", ca: "Rebut el {date} a les {time} (hora peninsular)", en: "Received on {date} at {time} (Madrid time)", ja: "受付日時：{date} {time}（スペイン本土時間）" }
  ok_steps:
    - { es: "Cancelamos tu cuota: no habrá más cobros.", ca: "Cancel·lem la teva quota: no hi haurà més cobraments.", en: "We cancel your membership: there will be no further charges.", ja: "会費を解約します。以後の請求はありません。" }
    - { es: "Te devolvemos lo pagado, menos los días transcurridos, en 14 días como máximo y por el mismo medio de pago. Te escribimos con el importe.", ca: "Et retornem el que has pagat, menys els dies transcorreguts, en 14 dies com a màxim i pel mateix mitjà de pagament. T'escrivim amb l'import.", en: "We refund what you paid, less the days that have passed, within 14 days and by the same means. We will write to you with the amount.", ja: "お支払い済みの金額から経過日数分を差し引き、14日以内に同じ方法で返金します。金額はメールでお知らせします。" }
    - { es: "¿Ha sido un error? Escríbenos hoy a <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a>.", ca: "Ha estat un error? Escriu-nos avui a <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a>.", en: "A mistake? Write to <a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a> today.", ja: "誤りの場合は、本日中に<a href=\"mailto:info@aikidomusubi.com\">info@aikidomusubi.com</a>までご連絡ください。" }
