  tl_withdraw:   { es: "último día para desistir", ca: "últim dia per desistir", en: "last day to withdraw", ja: "クーリングオフ期限" }
  tl_first:      { es: "primera cuota completa", ca: "primera quota completa", en: "first full fee", ja: "最初の全額のお支払い" }
  tl_keikogi:    { es: "Después, los keikogi", ca: "Després, els keikogi", en: "Then the keikogi", ja: "その後、稽古着をお渡し" }
  tl_then:       { es: "Después, {amount} cada día 5", ca: "Després, {amount} cada dia 5", en: "Then {amount} on every 5th", ja: "以降、毎回5日に{amount}" }
  tl_then_q:     { es: "Después, {amount} cada 5 de {months}", ca: "Després, {amount} cada 5 de {months}", en: "Then {amount} every 5 {months}", ja: "以降、{months}の5日に{amount}" }
  not_included:
    es: "<b>No incluido:</b> licencia federativa y seguro, 45 € al año por persona, que se pagan aparte en marzo."
    ca: "<b>No inclòs:</b> llicència federativa i assegurança, 45 € l'any per persona, que es paguen a part al març."
    en: "<b>Not included:</b> federation licence and insurance, 45 € a year per person, paid separately in March."
    ja: "<b>含まれないもの：</b>連盟登録料と保険（お一人につき年45ユーロ、3月に別途お支払い）。"
  promises:
    es: "Te avisaremos 15 días antes de cada renovación. Te das de baja cuando quieras y se aplica al final del periodo pagado."
    ca: "T'avisarem 15 dies abans de cada renovació. Et dones de baixa quan vulguis i s'aplica al final del període pagat."
    en: "We will remind you 15 days before every renewal. Cancel whenever you like; it takes effect at the end of the paid period."
    ja: "更新の15日前にお知らせします。退会はいつでも可能で、お支払い済みの期間の終わりに適用されます。"
  terms_cb:
    es: "He leído y acepto las <a href=\"{url}\">condiciones de la cuota</a>."
    ca: "He llegit i accepto les <a href=\"{url}\">condicions de la quota</a>."
    en: "I have read and accept the <a href=\"{url}\">membership terms</a>."
    ja: "<a href=\"{url}\">会費規約</a>を読み、同意します。"
  early_cb:
    es: "Quiero empezar a entrenar ya, antes de que acaben los 14 días para desistir."
    ca: "Vull començar a entrenar ja, abans que acabin els 14 dies per desistir."
    en: "I want to start training now, before the 14 days to withdraw are over."
    ja: "14日間のクーリングオフ期間の終了を待たずに、すぐに稽古を始めることを希望します。"
  early_sub:
    es: "Si desisto en ese plazo, pagaré solo los días transcurridos hasta que lo comunique."
    ca: "Si desisteixo en aquest termini, pagaré només els dies transcorreguts fins que ho comuniqui."
    en: "If I withdraw within that period, I pay only for the days up to when I tell you."
    ja: "期間内に解約する場合は、お申し出の日までの日数分のみをお支払いします。"
  privacy:
    es: "<b>Protección de datos.</b> Responsable: {org}. Finalidad: tu inscripción y el cobro de la cuota. Base: el contrato. Destinatarios: Stripe, que procesa el pago, con transferencia a EE. UU. bajo el Data Privacy Framework y cláusulas contractuales tipo. Derechos: info@aikidomusubi.com. <a href=\"{url}\">Más información</a>."
    ca: "<b>Protecció de dades.</b> Responsable: {org}. Finalitat: la teva inscripció i el cobrament de la quota. Base: el contracte. Destinataris: Stripe, que processa el pagament, amb transferència als EUA sota el Data Privacy Framework i clàusules contractuals tipus. Drets: info@aikidomusubi.com. <a href=\"{url}\">Més informació</a>."
    en: "<b>Data protection.</b> Controller: {org}. Purpose: your enrolment and collecting the fee. Legal basis: the contract. Recipients: Stripe, which processes the payment, with a transfer to the US under the Data Privacy Framework and standard contractual clauses. Your rights: info@aikidomusubi.com. <a href=\"{url}\">More information</a>."
    ja: "<b>個人情報の取り扱い</b>　管理者：{org}。目的：入会手続きと月謝の徴収。根拠：契約。提供先：決済を処理するStripe（EU・米国データプライバシーフレームワークおよび標準契約条項に基づく米国への移転を含む）。権利の行使：info@aikidomusubi.com。<a href=\"{url}\">詳細</a>"
  pay:      { es: "Ir al pago seguro", ca: "Anar al pagament segur", en: "Go to secure payment", ja: "安全なお支払いページへ" }
  pay_note:
    es: "En Stripe eliges tarjeta o domiciliación y confirmas. Hasta entonces no se cobra nada."
    ca: "A Stripe tries targeta o domiciliació i confirmes. Fins aleshores no es cobra res."
    en: "On Stripe you choose card or direct debit and confirm. Nothing is charged until then."
    ja: "Stripeのページでカードか口座振替を選び、確定します。それまでお支払いは発生しません。"
  sending:  { es: "Un momento…", ca: "Un moment…", en: "One moment…", ja: "処理中…" }
  cancel_h: { es: "No se ha cobrado nada.", ca: "No s'ha cobrat res.", en: "Nothing has been charged.", ja: "お支払いは発生していません。" }
  cancel_b:
    es: "Has vuelto de la página de pago sin terminar. Todo sigue como lo dejaste: revísalo y vuelve a intentarlo cuando quieras."
    ca: "Has tornat de la pàgina de pagament sense acabar. Tot segueix com ho vas deixar: revisa-ho i torna-ho a provar quan vulguis."
    en: "You came back from the payment page before finishing. Everything is as you left it: check it and try again whenever you like."
    ja: "お支払いページから途中で戻りました。入力内容はそのままです。確認して、もう一度お試しください。"
  invite_h: { es: "Vienes con una invitación.", ca: "Véns amb una invitació.", en: "You have an invitation.", ja: "招待リンクからのお申し込みです。" }
  invite_b:
    es: "Hoy no se cobra nada: el primer cobro será el día 5 que te indicamos en la invitación."
    ca: "Avui no es cobra res: el primer cobrament serà el dia 5 que t'indiquem a la invitació."
    en: "Nothing is charged today: the first charge is on the 5th given in your invitation."
    ja: "本日のお支払いはありません。初回のお支払いは、招待メールに記載の5日です。"
  errors_h: { es: "Revisa esto antes de seguir:", ca: "Revisa això abans de continuar:", en: "Please check the following:", ja: "次の項目をご確認ください：" }
  no_js:
    es: "Sin JavaScript, los cuatro pasos están en esta misma página y el total lo verás en la página de pago."
    ca: "Sense JavaScript, els quatre passos són en aquesta mateixa pàgina i el total el veuràs a la pàgina de pagament."
    en: "Without JavaScript, the four steps are all on this page and you will see the total on the payment page."
    ja: "JavaScriptが無効な場合、4つのステップはすべてこのページに表示され、合計金額はお支払いページで確認できます。"

