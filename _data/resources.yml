  # HOW THE EXAMS ACTUALLY WORK, which the five programmes never said. An
  # outside reader had the syllabus in front of it and still could not answer
  # "when are they, who sits on the panel, what do they cost" — the questions
  # anybody weighing up a dojo asks. `note` renders under the section heading.
  - id: examen
    name: { es: "Programa de examen", ca: "Programa d'examen",
            en: "Grading programme", ja: "審査要項" }
    sub:
      es: "De 5.º a 1.er kyū"
      ca: "De 5è a 1r kyū"
      en: "From 5th to 1st kyū"
      ja: "五級から一級まで"
    note:
      es: "Los exámenes de kyū se hacen en el propio dojo dos veces al año, en julio y en diciembre, ante la dirección técnica de Aikido Musubi, y no tienen coste. Los de dan se presentan a través de Arashi Group, ante su dirección técnica y con su propio programa; el precio lo fija la Aikikai. Para examinarse hace falta la licencia federativa, que está detallada en Cuotas."
      ca: "Els exàmens de kyū es fan al mateix dojo dues vegades l'any, al juliol i al desembre, davant la direcció tècnica d'Aikido Musubi, i no tenen cost. Els de dan es presenten a través d'Arashi Group, davant la seva direcció tècnica i amb el seu propi programa; el preu el fixa l'Aikikai. Per examinar-se cal la llicència federativa, que està detallada a Quotes."
      en: "Kyū gradings are held at the dojo twice a year, in July and in December, before Aikido Musubi's own technical direction, and they are free. Dan gradings go through Arashi Group, before its technical direction and to its own syllabus; the price is set by the Aikikai. Sitting any grading requires the federation licence, which is set out on the Fees page."
      ja: "級位審査は年二回、7月と12月に当道場で行い、合気道産靈の技術指導部が審査します。費用はかかりません。段位審査は嵐グループを通じて受審し、同グループの技術指導部が審査を担当します。要項も同グループのものです。料金は合気会が定めます。審査を受けるには連盟登録が必要です。詳細は月謝のページに記載しています。"
    items:
      - kind: page
        title: { es: "Programa de 5.º kyū", ca: "Programa de 5è kyū",
                 en: "5th kyū programme", ja: "五級審査要項" }
        desc:
          es: "El primero. Ikkyo a yonkyo en suwari waza, seis ataques de pie y los cuatro primeros suburis."
          ca: "El primer. Ikkyo a yonkyo en suwari waza, sis atacs dempeus i els quatre primers suburis."
          en: "The first one. Ikkyo to yonkyo in suwari waza, six standing attacks and the first four suburi."
          ja: "最初の審査。座り技の一教から四教、立ち技六種の攻撃、素振り四本。"
        panel: kyu5
        meta: { es: "18 técnicas · 8 ataques", ca: "18 tècniques · 8 atacs",
                en: "18 techniques · 8 attacks", ja: "技18本・攻撃8種" }
      - kind: page
        title: { es: "Programa de 4.º kyū", ca: "Programa de 4t kyū",
                 en: "4th kyū programme", ja: "四級審査要項" }
        desc:
          es: "Llega el ushiro ryote-dori, irimi-nage en suwari waza y el bokken sube a seis suburis."
          ca: "Arriba l'ushiro ryote-dori, irimi-nage en suwari waza i el bokken puja a sis suburis."
          en: "Ushiro ryote-dori arrives, irimi-nage in suwari waza, and the bokken goes up to six suburi."
          ja: "後ろ両手取り、座り技の入身投げ、素振りは六本に。"
        panel: kyu4
        meta: { es: "26 técnicas · 9 ataques", ca: "26 tècniques · 9 atacs",
                en: "26 techniques · 9 attacks", ja: "技26本・攻撃9種" }
      - kind: page
        title: { es: "Programa de 3.er kyū", ca: "Programa de 3r kyū",
                 en: "3rd kyū programme", ja: "三級審査要項" }
        desc:
          es: "Entran los kokyu-nage, el jō empieza a pedir uchiotoshi y el randori arranca en futari-dori."
          ca: "Entren els kokyu-nage, el jō comença a demanar uchiotoshi i el randori arrenca en futari-dori."
          en: "The kokyu-nage arrive, the jō starts asking for uchiotoshi, and randori begins from futari-dori."
          ja: "呼吸投げが入り、杖に打ち落としが加わり、乱取りは二人取りから。"
        panel: kyu3
        meta: { es: "36 técnicas · 9 ataques", ca: "36 tècniques · 9 atacs",
                en: "36 techniques · 9 attacks", ja: "技36本・攻撃9種" }
      - kind: page
        title: { es: "Programa de 2.º kyū", ca: "Programa de 2n kyū",
                 en: "2nd kyū programme", ja: "二級審査要項" }
        desc:
          es: "Aparecen gokyo, koshi-nage y juji-nage, y el randori pasa a tres personas."
          ca: "Apareixen gokyo, koshi-nage i juji-nage, i el randori passa a tres persones."
          en: "Gokyo, koshi-nage and juji-nage appear, and randori goes up to three people."
          ja: "五教・腰投げ・十字投げが加わり、乱取りは三人に。"
        panel: kyu2
        meta: { es: "47 técnicas · 11 ataques", ca: "47 tècniques · 11 atacs",
                en: "47 techniques · 11 attacks", ja: "技47本・攻撃11種" }
      - kind: page
        title: { es: "Programa de 1.er kyū", ca: "Programa de 1r kyū",
                 en: "1st kyū programme", ja: "一級審査要項" }
        desc:
          es: "El programa se recorta y se ensancha: hiji-kime-osae y gokyo en todos los ataques, ju-waza y el sansho de jō."
          ca: "El programa es retalla i s'eixampla: hiji-kime-osae i gokyo a tots els atacs, ju-waza i el sansho de jō."
          en: "The programme is recut and widened: hiji-kime-osae and gokyo across every attack, ju-waza and the jō sansho."
          ja: "要項が組み直され広がります。全攻撃に肘極め押えと五教、柔技、杖の三章。"
        panel: kyu1
        meta: { es: "74 técnicas · 15 ataques", ca: "74 tècniques · 15 atacs",
                en: "74 techniques · 15 attacks", ja: "技74本・攻撃15種" }
      - kind: page
        title: { es: "Todo el programa, de 5.º a 1.er kyū", ca: "Tot el programa, de 5è a 1r kyū",
                 en: "The whole programme, 5th to 1st kyū", ja: "全要項（五級〜一級）" }
        desc:
          es: "Las cinco listas en una. Cada técnica aparece una vez, en el color del grado en que se pide por primera vez."
          ca: "Les cinc llistes en una. Cada tècnica apareix un cop, amb el color del grau on es demana per primera vegada."
          en: "The five lists as one. Each technique appears once, in the colour of the grade where it is first asked for."
          ja: "五つの要項を一枚に。各技は一度だけ、最初に求められる級の色で。"
        panel: all
        meta: { es: "112 técnicas · 5 grados", ca: "112 tècniques · 5 graus",
                en: "112 techniques · 5 grades", ja: "技112本・5級位" }

  # ---------------------------------------------------------------------------
  # Vídeos de práctica
  #
  # Not "media" in the sense the Lecturas group uses it. Those are things to
  # read or browse; these are things to DO — a warm-up you can follow, an ukemi
  # broken down, a class you can train along with. That is why they are their
  # own group rather than more rows under Lecturas.
  #
  # The weapons videos are NOT here. They sit in Armas, with the guides they
  # demonstrate: this list is grouped by what the material is for, and somebody
  # looking up a suburi is looking under weapons.
  # ---------------------------------------------------------------------------
  - id: videos
    name: { es: "Vídeos de práctica", ca: "Vídeos de pràctica",
            en: "Practice videos", ja: "稽古の動画" }
    sub:
      es: "Ejercicios, ukemi y clases grabadas"
      ca: "Exercicis, ukemi i classes gravades"
      en: "Exercises, ukemi and recorded classes"
      ja: "稽古法・受身・録画された稽古"
    items:
      # ---- Kumazawa Sensei's own series for her dojo -----------------------
      # Filmed for the students of Aikido Sanshinkai to practise on their own.
      # Japanese, and unnarrated enough to follow without it.
