# ---------------------------------------------------------------------------
# Recursos
#
# One page, filtered in the browser — the same shape as the glossary, for the
# same reason: everything fits in one scroll and one bookmark, and search is
# what finds a thing you already know the name of.
#
# `kind` is NOT a file format. It is what the reader does with the thing:
#
#   form   a PDF that exists to be printed and signed. Primary action is
#          "download" — there is nothing to read on screen.
#   page   a resource that lives on the site. Primary action is "read", and
#          the page itself carries share and print. No PDF is kept for these:
#          the browser's own print-to-PDF cannot go stale, and a second file
#          on a shelf can.
#   doc    a PDF that is a document rather than a form — someone else's
#          syllabus, a reference sheet. Download, but it is worth reading.
#   book   printed matter. The action is finding it, not getting it from us.
#   media  an archive to browse, elsewhere.
#   video  something to watch. Separate from `media` because the button says
#          "Ver" and not "Consultar", and a video you sit through is not an
#          archive you look things up in.
#
# PLACEHOLDERS. A `file:` is a name, not a promise: the page checks
# site.static_files and only links a PDF that is actually in /files/. Anything
# missing renders as "coming soon" and starts working the moment the file is
# added — there is no flag to remember to clear.
#
# `draft: true` still exists and hides a row entirely — for a resource that is
# not announced at all. It is not the way to mark one whose document is
# pending: those should be visible, saying "coming soon", because a syllabus
# the dojo is known to have should appear in the list before its page exists.
# ---------------------------------------------------------------------------

ui:
  search:     { es: "Buscar en los recursos…", ca: "Cerca als recursos…",
                en: "Search the resources…", ja: "資料を検索…" }
  search_lab: { es: "Buscar en los recursos", ca: "Cerca als recursos",
                en: "Search the resources", ja: "資料を検索" }
  clear:      { es: "Limpiar", ca: "Esborrar", en: "Clear", ja: "クリア" }
  all:        { es: "Todos", ca: "Tots", en: "All", ja: "すべて" }
  entries:    { es: "recursos", ca: "recursos", en: "resources", ja: "件" }
  empty:      { es: "Ningún recurso coincide con la búsqueda.", ca: "Cap recurs coincideix amb la cerca.",
                en: "No resource matches that search.", ja: "該当する資料がありません。" }
  filters:    { es: "Filtrar por tipo", ca: "Filtra per tipus", en: "Filter by type", ja: "種類で絞り込む" }
  # the verb on the button, by kind
  get_form:   { es: "Descargar", ca: "Descarregar", en: "Download", ja: "ダウンロード" }
  get_doc:    { es: "Descargar", ca: "Descarregar", en: "Download", ja: "ダウンロード" }
  get_page:   { es: "Leer", ca: "Llegir", en: "Read", ja: "読む" }
  # Every button goes to the thing itself. "Find it" sent people looking, and
  # "Watch" was wrong for a written archive — both were labels for a link that
  # did not quite deliver, which is the wrong way round.
  get_book:   { es: "Comprar", ca: "Comprar", en: "Buy", ja: "購入する" }
  get_free:   { es: "Leer gratis", ca: "Llegir gratis", en: "Read free", ja: "無料で読む" }
  get_media:  { es: "Consultar", ca: "Consultar", en: "Browse", ja: "閲覧する" }
  # `video` is its own kind because the verb is its own verb. "Consultar" is
  # right for an archive you look things up in and wrong for a class you sit
  # and watch, and the two used to share one label.
  get_video:  { es: "Ver", ca: "Veure", en: "Watch", ja: "見る" }
  buy_at:     { es: "Comprar en", ca: "Comprar a", en: "Buy from", ja: "購入先" }
  # the badge that says what a thing is
  k_form:     { es: "Impreso", ca: "Imprès", en: "Form", ja: "書式" }
  k_doc:      { es: "PDF", ca: "PDF", en: "PDF", ja: "PDF" }
  k_page:     { es: "En la web", ca: "A la web", en: "On the site", ja: "サイト内" }
  k_book:     { es: "Libro", ca: "Llibre", en: "Book", ja: "書籍" }
  k_media:    { es: "Media", ca: "Media", en: "Media", ja: "メディア" }
  k_video:    { es: "Vídeo", ca: "Vídeo", en: "Video", ja: "動画" }
  soon:       { es: "Próximamente", ca: "Aviat", en: "Coming soon", ja: "準備中" }

