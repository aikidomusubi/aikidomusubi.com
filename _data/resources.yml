        desc:
          es: "El calentamiento entero, en el orden en que se hace en clase."
          ca: "L'escalfament sencer, en l'ordre en què es fa a classe."
          en: "The whole warm-up, in the order it is done in class."
          ja: "稽古で行う順のまま、準備体操を通して。"
