        title: { es: "Vídeo de aikido 1 · Preparación",
                 ca: "Vídeo d'aikido 1 · Preparació",
                 en: "Aikido on video 1 · Warm-up",
                 ja: "ビデオで合気道 第1回 準備体操" }
