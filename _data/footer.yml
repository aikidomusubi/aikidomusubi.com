# The footer.
#
# ONE SOURCE, and where possible not even that: the first two columns are the
# nav's own groups, pulled in by id, so a section renamed in _data/nav.yml is
# renamed in the footer too and the two can never disagree. Only the heading
# above each column is written here, because "Practicar" reads better over a
# list than the nav's "Clases y Horarios" does.
#
# Everything factual below — the legal name, the CIF, the registry number —
# comes from aviso-legal.md, which is the page that is legally obliged to be
# right. Do not retype it here from memory; copy it from there.

# ---------------------------------------------------------------------------
# The invitation band
#
# The one thing the footer is asking a first-time visitor to do: come and try
# a class. It deliberately does NOT lead with "watching is allowed" or "it is
# free for visitors" — both are true, both live on the Visitors page, and
# neither is the thing we want someone to act on from the bottom of a page.
# The two trial classes are the offer that matches the ask, and they are what
# visitors.md already promises.
# ---------------------------------------------------------------------------
band:
  title:
    es: "Prueba una clase"
    ca: "Prova una classe"
    en: "Try a class"
    ja: "稽古を体験する"
  text:
    es: "Te invitamos a dos clases de prueba, sin compromiso. No hace falta experiencia previa: se empieza en una clase para principiantes."
    ca: "T'oferim dues classes de prova, sense compromís. No cal experiència prèvia: es comença en una classe per a principiants."
    en: "Come for two trial classes, with no commitment. No previous experience is needed; you start in a beginners' class."
    ja: "入会前に体験稽古へ二回ご参加いただけます。経験は必要ありません。初心者クラスから始めます。"
  cta:
    es: "Escríbenos"
    ca: "Escriu-nos"
    en: "Write to us"
    ja: "お問い合わせ"
  url:
    es: "/contacto/"
    ca: "/ca/contacte/"
    en: "/en/contact/"
    ja: "/ja/contact/"

# ---------------------------------------------------------------------------
# Columns
#
# `from_nav` names a group id in _data/nav.yml and takes its items verbatim.
# `items` spells them out, for links the menu does not carry.
# ---------------------------------------------------------------------------
columns:
  - from_nav: classes
    label: { es: "Practicar", ca: "Practicar", en: "Training", ja: "稽古" }

  # THE MEMBERSHIP'S OWN COLUMN (option A of docs/mockups/footer-cuotas-*.html,
  # chosen 15 October 2026). The members area, the terms, and the withdrawal
  # function, which the EU wants reachable from every page of the site
  # (Directive 2023/2673, from 19 June 2026): the footer is on every page.
  # Signing up is not repeated here: "Practicar" carries it from the nav.
  # Not the pinned strip below: it has no room left on a phone (CLAUDE.md).
  - id: cuota
    label: { es: "Tu cuota", ca: "La teva quota", en: "Your membership", ja: "会費" }
    items:
      - label: { es: "Área de miembros", ca: "Àrea de membres", en: "Members area", ja: "会員ページ" }
        url:   { es: "/miembros/", ca: "/ca/membres/", en: "/en/members/", ja: "/ja/members/" }
      - label: { es: "Condiciones de la cuota", ca: "Condicions de la quota", en: "Membership terms", ja: "会費規約" }
        url:   { es: "/condiciones-de-la-cuota/", ca: "/ca/condicions-de-la-quota/", en: "/en/membership-terms/", ja: "/ja/membership-terms/" }
      - label: { es: "Desistir del contrato", ca: "Desistir del contracte", en: "Withdraw from the contract", ja: "契約の解約" }
        url:   { es: "/desistimiento/", ca: "/ca/desistiment/", en: "/en/withdrawal/", ja: "/ja/withdrawal/" }

  - from_nav: about
    label: { es: "Sobre nosotros", ca: "Sobre nosaltres", en: "About us", ja: "私たちについて" }

  # THE TOWNS, NOT THE ROOMS, and each one to its own page.
  #
  # This column used to list four venues and point every one of them at an
  # anchor on /acceso/. Two things were wrong with that. /acceso/ answers
  # "which door", and a column headed "where we train" is asking a different
  # question — what happens in this town, who teaches there, when. That is the
  # location page. And the fourth row was a ROOM: the Faculty of Law is inside
  # Barcelona, so the column named three towns and one lecture hall as if they
  # were the same kind of thing.
  #
  # The rule everywhere else on this site is to name the towns where there is a
  # presence rather than every room, and this column now follows it. Barcelona
  # leads, because it is the location word the site is moving towards. The
  # university keeps its place on /acceso/ and on /barcelona/, which carries
  # its timetable and its address.
  #
  # WHAT THIS IS FOR. /badalona/, /barcelona/ and /sant-adria-de-besos/ had
  # NINE inbound internal links each, against 37 to 38 for everything else, and
  # /badalona/ sat at position 5.64 with 88 impressions and no clicks at all.
  # The footer is on all 136 pages. Approved as proposal B in
  # docs/mockups/footer-venues.html.
  #
  # A footer link is worth less to Google than one written inside a sentence,
  # so this is not the end of it; it is the floor.
  #
  # The last row keeps its four strings from _data/about.yml, where the same
  # sentence is already written and already translated. A fifth phrasing of one
  # idea is how the kana for Sant Adrià came to be spelled two ways.
  - id: where
    label: { es: "Dónde entrenamos", ca: "On entrenem", en: "Where we train", ja: "稽古場所" }
    items:
      - label: { es: "Barcelona", ca: "Barcelona", en: "Barcelona", ja: "バルセロナ" }
        url:   { es: "/barcelona/", ca: "/ca/barcelona/",
                 en: "/en/barcelona/", ja: "/ja/barcelona/" }
      - label: { es: "Badalona", ca: "Badalona", en: "Badalona", ja: "バダロナ" }
        url:   { es: "/badalona/", ca: "/ca/badalona/",
                 en: "/en/badalona/", ja: "/ja/badalona/" }
      # サント, with the ト. Seventeen places in this repo spell it that way and
      # this line was the only one that did not — the exact drift CLAUDE.md
      # records for this place name, found by grepping the kana before touching
      # the row rather than after.
      - label: { es: "Sant Adrià de Besòs", ca: "Sant Adrià de Besòs",
                 en: "Sant Adrià de Besòs", ja: "サント・アドリア・ダ・バゾス" }
        url:   { es: "/sant-adria-de-besos/", ca: "/ca/sant-adria-de-besos/",
                 en: "/en/sant-adria-de-besos/", ja: "/ja/sant-adria-de-besos/" }
      - label: { es: "Cómo llegar a cada uno", ca: "Com arribar a cadascun",
                 en: "How to get to each one", ja: "それぞれへの行き方" }
        url:   { es: "/acceso/", ca: "/ca/acces/",
                 en: "/en/access-information/", ja: "/ja/access-information/" }

# ---------------------------------------------------------------------------
# The fixed legal strip
#
# Art. 10 LSSI-CE wants these reachable from anywhere, which is why a 30px
# band stays pinned to the viewport while the rest of the footer sits at the
# end of the page like a normal footer.
# ---------------------------------------------------------------------------
legal:
  - label: { es: "Aviso legal", ca: "Avís legal", en: "Legal notice", ja: "法的通知" }
    url:   { es: "/aviso-legal/", ca: "/ca/avis-legal/",
             en: "/en/legal-notice/", ja: "/ja/legal-notice/" }
  - label: { es: "Privacidad", ca: "Privadesa", en: "Privacy", ja: "プライバシー" }
    url:   { es: "/politica-privacidad/", ca: "/ca/politica-privadesa/",
             en: "/en/privacy-policy/", ja: "/ja/privacy-policy/" }
  - label: { es: "Cookies", ca: "Galetes", en: "Cookies", ja: "クッキー" }
    url:   { es: "/politica-cookies/", ca: "/ca/politica-galetes/",
             en: "/en/cookie-policy/", ja: "/ja/cookie-policy/" }
  - label: { es: "Accesibilidad", ca: "Accessibilitat",
             en: "Accessibility", ja: "アクセシビリティ" }
    url:   { es: "/accesibilidad/", ca: "/ca/accessibilitat/",
             en: "/en/accessibility/", ja: "/ja/accessibility/" }
  - label: { es: "Mapa del sitio", ca: "Mapa del lloc",
             en: "Site map", ja: "サイトマップ" }
    url:   { es: "/mapa-del-sitio/", ca: "/ca/mapa-del-lloc/",
             en: "/en/site-map/", ja: "/ja/site-map/" }

ui:
  # THE LEGAL NAME, as registered: "Associació Aikido Musubi" since the
  # statutes of 12 December 2022, entered in the Registre d'associacions on
  # 7 March 2023 (núm. 36696, secció 1a, Barcelona). It was "Associació
  # Cultural Musubi Aikido" before, and the site went on printing that until
  # 15 October 2026. Every page that names the association reads it from here
  # (as {org} in data files); it is one of the three places the Aikikai
  # Barcelona rename touches. org_ja is what a Japanese reader sees on /ja/.
  org:     "Associació Aikido Musubi"
  org_ja:  "合気道産靈協会"
  registry: "36696"
  cif:     "G-64799554"
  address: "Av. d'Alfons XIII, 351<br>08918 Badalona, Barcelona"

  email:    { es: "Correo",     ca: "Correu",    en: "Email",    ja: "メール" }
  whatsapp: { es: "WhatsApp",   ca: "WhatsApp",  en: "WhatsApp", ja: "WhatsApp" }
  phone:    { es: "Teléfono",   ca: "Telèfon",   en: "Phone",    ja: "電話" }
  social:   { es: "Redes sociales", ca: "Xarxes socials",
              en: "Social media",   ja: "ソーシャルメディア" }
  footer:   { es: "Pie de página", ca: "Peu de pàgina",
              en: "Site footer",    ja: "フッター" }
  legal_nav: { es: "Información legal", ca: "Informació legal",
               en: "Legal information", ja: "法的情報" }
