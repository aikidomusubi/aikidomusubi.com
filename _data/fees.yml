# Fees.
#
# ONE SOURCE. The four fees pages used to carry sixteen hand-written Bootstrap
# cards each — sixty-four across the languages — and a pair of PDFs holding the
# same numbers again. They had already drifted: the page said the monthly family
# rate was "22% de descuento" where the PDF's own arithmetic said 21.4%, and the
# mixed-family rate existed in the PDF but on no page at all.
#
# So only two numbers are stored per row: what you pay, and what the same period
# would cost billed monthly. Every saving and percentage on the page is worked
# out from those at build time, which is why they can no longer disagree.
#
# TO CHANGE A PRICE: edit `fee` (and `base` if the monthly rate moved). Nothing
# else needs touching — the cards, the comparison table and the structured data
# all read from here.

year: 2026
currency: EUR
symbol: "€"

# ---------------------------------------------------------------------------
# THE OCTOBER 2026 REVISION, approved by the association on 6 October 2026.
#
#   one fee, every space    the general fee gives access to all the venues
#   two age groups          up to 16, and 17 and over: one cut-off everywhere,
#                           so a 14-year-old pays the same at any venue
#   three periods           month, quarter, year; the six-month plan is gone
#   one family rule         replaces three family categories and fifteen prices
#   members' rate           for holders of a municipal sports-centre membership,
#                           at that centre only (see `members` below)
#
# The age groups are named by age and not by "adults"/"children" ("niños",
# "adultos"): it is the clearer fact and it is gender neutral in Spanish and
# Catalan. The ids stay `adults` and `children`, which tools/qa.py reads.
# ---------------------------------------------------------------------------
periods:
  - id: monthly
    months: 1
    name:  { es: "Mensual",     ca: "Mensual",     en: "Monthly",     ja: "月額" }
    unit:  { es: "al mes",      ca: "al mes",      en: "per month",   ja: "／月" }
  - id: quarterly
    months: 3
    name:  { es: "Trimestral",  ca: "Trimestral",  en: "Quarterly",   ja: "3か月" }
    unit:  { es: "al trimestre",ca: "al trimestre",en: "per quarter", ja: "／3か月" }
  - id: annual
    months: 12
    name:  { es: "Anual",       ca: "Anual",       en: "Annual",      ja: "年額" }
    unit:  { es: "al año",      ca: "a l'any",     en: "per year",    ja: "／年" }

categories:
  - id: adults
    name: { es: "17 años o más", ca: "17 anys o més", en: "17 and over", ja: "17歳以上" }
    who:  { es: "Todas las clases, en todos los espacios", ca: "Totes les classes, a tots els espais",
            en: "Every class, at every space", ja: "すべての稽古場所・すべての稽古" }
  - id: children
    name: { es: "Hasta 16 años", ca: "Fins a 16 anys", en: "Up to 16", ja: "16歳まで" }
    who:  { es: "Todas las clases, en todos los espacios", ca: "Totes les classes, a tots els espais",
            en: "Every class, at every space", ja: "すべての稽古場所・すべての稽古" }

# fee  = what you pay for the period
# base = the same period paid month by month, which is what the saving is against
prices:
  monthly:
    adults:   { fee: 39,  base: 39 }
    children: { fee: 29,  base: 29 }
  quarterly:
    adults:   { fee: 99,  base: 117 }
    children: { fee: 75,  base: 87 }
  annual:
    adults:   { fee: 360, base: 468 }
    children: { fee: 270, base: 348 }

included:
  - { es: "Acceso a todos los espacios", ca: "Accés a tots els espais", en: "Access to every space", ja: "すべての稽古場所に通える" }
  - { es: "Inscripción gratuita",  ca: "Inscripció gratuïta",  en: "Free registration",       ja: "入会金無料" }
  - { es: "2 clases de prueba",    ca: "2 classes de prova",   en: "Two trial classes",       ja: "体験稽古2回" }

# ---------------------------------------------------------------------------
# FAMILIES: ONE RULE INSTEAD OF THREE CATEGORIES.
#
# Every member of the same household after the first pays `amount` less per
# month, on whichever plan they are on: 45 € less a quarter, 180 € less a year.
# A flat amount rather than a percentage, so it reads the same on every card
# and nobody has to work out which member is "the second".
# ---------------------------------------------------------------------------
family:
  amount: 15
  eyebrow: { es: "Familias", ca: "Famílies", en: "Families", ja: "家族割" }
  title:   { es: "Cada persona más de la familia, 15 € menos al mes",
             ca: "Cada persona més de la família, 15 € menys al mes",
             en: "Each extra family member pays 15 € less a month",
             ja: "2人目からは、ひとりにつき月15ユーロ引き" }
  body:
    es: "A partir de la segunda persona del mismo núcleo familiar, cada una paga 15 € menos al mes, con cualquier modalidad: 45 € menos al trimestre o 180 € menos al año. Vale para todas las edades y todos los espacios."
    ca: "A partir de la segona persona del mateix nucli familiar, cadascuna paga 15 € menys al mes, amb qualsevol modalitat: 45 € menys al trimestre o 180 € menys a l'any. Val per a totes les edats i tots els espais."
    en: "From the second person in the same household on, each pays 15 € less a month, on any plan: 45 € less a quarter or 180 € less a year. It applies at every age and at every space."
    ja: "同じ世帯の2人目からは、どの支払い方法でもひとりにつき月15ユーロ引きです（3か月なら45ユーロ引き、1年なら180ユーロ引き）。年齢や稽古場所を問いません。"
  # Worked examples, monthly, computed on the page from the prices above.
  examples:
    - { label: { es: "Dos personas de 17 años o más", ca: "Dues persones de 17 anys o més", en: "Two people aged 17 or over", ja: "17歳以上が2人" }, people: [adults, adults] }
    - { label: { es: "Una de 17 o más y una hasta 16", ca: "Una de 17 o més i una fins a 16", en: "One aged 17 or over and one up to 16", ja: "17歳以上と16歳までが1人ずつ" }, people: [adults, children] }
    - { label: { es: "Dos hasta 16 años", ca: "Dues fins a 16 anys", en: "Two up to 16", ja: "16歳までが2人" }, people: [children, children] }
  note:
    es: "Los ejemplos son mes a mes. El descuento no se suma a la cuota con abono."
    ca: "Els exemples són mes a mes. El descompte no se suma a la quota amb abonament."
    en: "The examples are month by month. The discount does not combine with the members' rate."
    ja: "例は月払いの場合です。施設会員料金との併用はできません。"

# ---------------------------------------------------------------------------
# THE MEMBERS' RATE, AND WHY IT COVERS ONE SPACE.
#
# Two of our spaces are municipal sports centres. Their own members get a
# reduced fee for the classes held THERE: it is part of the arrangement with
# each centre. If it covered every space it would undercut the general fee for
# everyone: buying a sports-centre membership would become the cheap way to
# train at the Badalona dojo. So it is the fee for that centre's classes, and
# the general fee is the one that opens every door.
# ---------------------------------------------------------------------------
members:
  eyebrow: { es: "Con abono municipal", ca: "Amb abonament municipal", en: "Sports-centre members", ja: "市立施設の会員" }
  title:   { es: "Si ya tienes abono del polideportivo", ca: "Si ja tens abonament del poliesportiu",
             en: "If you already hold a sports-centre membership", ja: "スポーツセンターの会員の方" }
  body:
    es: "Si tienes el abono del CxEM Espronceda o del polideportivo Marina-Besòs, pagas una cuota reducida, mes a mes, por las clases de ese espacio. Es parte del acuerdo con cada polideportivo, y por eso cubre solo ese espacio: para entrenar también en Badalona o en los otros espacios, la cuota general da acceso a todos."
    ca: "Si tens l'abonament del CxEM Espronceda o del poliesportiu Marina-Besòs, pagues una quota reduïda, mes a mes, per les classes d'aquell espai. Forma part de l'acord amb cada poliesportiu, i per això cobreix només aquell espai: per entrenar també a Badalona o als altres espais, la quota general dona accés a tots."
    en: "If you hold a membership of CxEM Espronceda or of the Marina-Besòs sports centre, you pay a reduced fee, month by month, for the classes at that space. It is part of our arrangement with each centre, which is why it covers that space only: to train in Badalona or at the other spaces as well, the general fee covers them all."
    ja: "エスプロンセダまたはマリナ・バゾスのスポーツセンターの会員の方は、その施設での稽古について、月払いの会員料金をご利用いただけます。各施設との取り決めによるもので、対象はその施設のみです。バダロナなどほかの稽古場所にも通う場合は、すべての稽古場所に有効な一般の月謝となります。"
  rows:
    - { venue: espronceda, adults: 19, children: 9 }
    # No 17-and-over price at Marina-Besòs: its only class is for ages 6 to 16.
    - { venue: sant-adria, children: 9 }
  note:
    es: "Hay que acreditar el abono al apuntarse. Solo mes a mes; no se combina con el descuento familiar."
    ca: "Cal acreditar l'abonament en apuntar-s'hi. Només mes a mes; no es combina amb el descompte familiar."
    en: "Show your membership when you sign up. Month by month only; it does not combine with the family discount."
    ja: "入会時に会員証をご提示ください。月払いのみで、家族割との併用はできません。"

# THE STANDING OFFER. Not a `included:` line, because that list is the same on
# every card and this is not: it is what you get for choosing a billing period
# other than monthly, in any category. Rendered once, under the cards.
offer:
  eyebrow: { es: "Oferta permanente", ca: "Oferta permanent",
             en: "Standing offer", ja: "常設の特典" }
  title:   { es: "El keikogi, de regalo", ca: "El keikogi, de regal",
             en: "The keikogi is on us", ja: "稽古着を進呈" }
  body:
    es: "Si te apuntas por trimestre o por año en lugar de mes a mes, el keikogi lo pone el dojo. Vale para todas las cuotas y en todos los espacios."
    ca: "Si t'apuntes per trimestre o per any en comptes de mes a mes, el keikogi el posa el dojo. Val per a totes les quotes i a tots els espais."
    en: "Sign up by the quarter or the year instead of month by month, and the dojo provides the keikogi. It applies to every fee, at every space."
    ja: "月払いではなく3か月払い・年払いでお申し込みの方には、道場から稽古着を一式お渡しします。すべての区分・すべての稽古場所が対象です。"
  note:
    es: "Un equipo por persona, en la primera matrícula."
    ca: "Un equip per persona, en la primera matrícula."
    en: "One set per person, on your first enrolment."
    ja: "お一人につき一式、初回入会時のみ。"

# ---------------------------------------------------------------------------
# WHAT IS NOT IN THE FEE
#
# The page used to end with "las cuotas indicadas son únicamente para las clases
# de Aikido", which opens a question and does not answer it. An outside reader
# scored the site down for exactly that: the class fee is published and the cost
# of practising is not.
#
# Nothing here is new money. It is what the dojo already tells people at the
# door, written down.
# ---------------------------------------------------------------------------
extras:
  eyebrow: { es: "Lo que no está en la cuota", ca: "El que no és a la quota",
             en: "What the fee does not cover", ja: "月謝に含まれないもの" }
  title:   { es: "El coste real de practicar", ca: "El cost real de practicar",
             en: "What practising actually costs", ja: "稽古にかかる費用のすべて" }
  intro:
    es: "La cuota mensual paga las clases de aikido y nada más. Esto es todo lo demás, sin letra pequeña."
    ca: "La quota mensual paga les classes d'aikido i res més. Això és tota la resta, sense lletra petita."
    en: "The monthly fee pays for the aikido classes and nothing else. This is everything else, with no small print."
    ja: "月謝に含まれるのは合気道の稽古のみです。それ以外にかかる費用を、隠さずすべて挙げます。"
  items:
    - k: { es: "Licencia federativa y seguro", ca: "Llicència federativa i assegurança",
           en: "Federation licence and insurance", ja: "連盟登録料と保険" }
      v:
        es: "45 € al año, que se pagan en marzo y van aparte de la cuota. Se tramitan desde el dojo a través de Arashi Group, incluyen el seguro deportivo, que es obligatorio, y dan derecho a examen."
        ca: "45 € l'any, que es paguen al març i van a part de la quota. Es tramiten des del dojo a través d'Arashi Group, inclouen l'assegurança esportiva, que és obligatòria, i donen dret a examen."
        en: "45 € a year, paid in March and separate from the fee. The dojo handles it through Arashi Group; it includes the sports insurance, which is compulsory, and it carries the right to be examined."
        ja: "年額45ユーロ。3月に納め、月謝とは別です。道場が嵐グループを通じて手続きします。加入が義務づけられているスポーツ保険が含まれ、審査を受ける資格が伴います。"
    - k: { es: "Exámenes de kyū", ca: "Exàmens de kyū", en: "Kyū gradings", ja: "級位審査" }
      v:
        es: "Sin coste. Se hacen en el propio dojo, dos veces al año, en julio y en diciembre, y el tribunal es la dirección técnica de Aikido Musubi."
        ca: "Sense cost. Es fan al mateix dojo, dues vegades l'any, al juliol i al desembre, i el tribunal és la direcció tècnica d'Aikido Musubi."
        en: "Free. They are held at the dojo twice a year, in July and in December, and the panel is Aikido Musubi's own technical direction."
        ja: "無料です。年二回、7月と12月に当道場で行い、審査は合気道産靈の技術指導部が担当します。"
    - k: { es: "Exámenes de dan", ca: "Exàmens de dan", en: "Dan gradings", ja: "段位審査" }
      v:
        es: "Se presentan a través de Arashi Group, y el tribunal es su dirección técnica. El precio lo fija la Aikikai."
        ca: "Es presenten a través d'Arashi Group, i el tribunal és la seva direcció tècnica. El preu el fixa l'Aikikai."
        en: "They go through Arashi Group, and the panel is its technical direction. The price is set by the Aikikai."
        ja: "嵐グループを通じて受審し、審査は同グループの技術指導部が担当します。料金は合気会が定めます。"
    - k: { es: "Keikogi", ca: "Keikogi", en: "Keikogi", ja: "稽古着" }
      v:
        es: "Lo pone el dojo si te apuntas por trimestre o por año en lugar de mes a mes. Para empezar no hace falta: ropa cómoda de manga y pantalón largos."
        ca: "El posa el dojo si t'apuntes per trimestre o per any en comptes de mes a mes. Per començar no cal: roba còmoda de màniga i pantaló llargs."
        en: "The dojo provides it if you sign up by the quarter or the year instead of month by month. You do not need one to start: comfortable long sleeves and long trousers will do."
        ja: "3か月払い・年払いを選ばれた場合は道場からお渡しします。始めるだけなら不要で、長袖・長ズボンの動きやすい服装で構いません。"
    - k: { es: "Armas", ca: "Armes", en: "Weapons", ja: "武器" }
      v:
        es: "El dojo tiene bokken y jō para usar. Es recomendable acabar teniendo los tuyos, pero no es una compra obligatoria y no hace ninguna falta el primer día."
        ca: "El dojo té bokken i jō per fer servir. És recomanable acabar tenint els teus, però no és una compra obligatòria i no cal gens el primer dia."
        en: "The dojo has bokken and jō to use. Owning your own is recommended in the end, but it is not a compulsory purchase and it is not needed on day one."
        ja: "道場に木刀と杖があり、自由に使えます。いずれご自身のものを持つことをおすすめしますが、購入は義務ではなく、初日には必要ありません。"
    - k: { es: "Seminarios y cursos", ca: "Seminaris i cursos", en: "Seminars and courses", ja: "講習会" }
      v:
        es: "Se pagan aparte, y cada uno publica su precio. Las personas socias del dojo, quien tenga menos de 25 años y el alumnado tienen descuento. Las masterclass son gratuitas salvo que se indique lo contrario."
        ca: "Es paguen a part, i cadascun publica el seu preu. Les persones sòcies del dojo, qui tingui menys de 25 anys i l'alumnat tenen descompte. Les masterclass són gratuïtes llevat que s'indiqui el contrari."
        en: "Paid separately, and each one publishes its price. Dojo members, under-25s and students get a discount. Masterclasses are free unless stated otherwise."
        ja: "別途お支払いいただきます。料金は講習会ごとに公開しています。道場の会員、25歳未満の方、学生の方は割引があります。マスタークラスは、特に記載がない限り無料です。"

# ---------------------------------------------------------------------------
# THE THING THE DOJO DOES AND NEVER SAID ANYWHERE.
#
# It has funded a significant share of its members' seminar fees elsewhere for
# years, to push people to train with other organisations. It is the strongest
# single fact on this page and it was not on the site at all, so it gets a block
# of its own rather than a line in the list above.
# ---------------------------------------------------------------------------
support:
  eyebrow: { es: "Formación", ca: "Formació", en: "Training beyond the dojo", ja: "道場の外での学び" }
  title:   { es: "El dojo paga parte de los seminarios de fuera",
             ca: "El dojo paga part dels seminaris de fora",
             en: "The dojo pays part of the seminars you attend elsewhere",
             ja: "外部講習会の費用を道場が一部負担します" }
  body:
    es: "Desde hace años el dojo financia una parte significativa del precio de los seminarios que sus miembros hacen con otras organizaciones. No es una ayuda puntual: es una manera de entender la formación, que no se acaba en el propio tatami."
    ca: "Des de fa anys el dojo finança una part significativa del preu dels seminaris que els seus membres fan amb altres organitzacions. No és un ajut puntual: és una manera d'entendre la formació, que no s'acaba al propi tatami."
    en: "For years the dojo has funded a significant share of what its members pay for seminars run by other organisations. It is not an occasional favour: it is what the association thinks training is, and training does not stop at our own mat."
    ja: "当道場では長年、会員がほかの団体の講習会に参加する際の費用の相当部分を負担しています。一時的な補助ではありません。稽古は自分の道場の畳の上だけで完結しないという考え方によるものです。"
  note:
    es: "Pregúntanos antes de inscribirte en uno y te decimos cómo funciona."
    ca: "Pregunta'ns abans d'inscriure't en un i t'expliquem com funciona."
    en: "Ask us before you sign up for one and we will tell you how it works."
    ja: "お申し込みの前にご相談ください。仕組みをご説明します。"

