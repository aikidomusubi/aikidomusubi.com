  full:      { es: "Seminario completo", ca: "Seminari complet", en: "Full seminar", ja: "全日程" }
  single:    { es: "Una clase suelta", ca: "Una classe solta", en: "Single class", ja: "1回のみ" }
  friday:    { es: "Masterclass del viernes", ca: "Masterclass del divendres",
               en: "Friday masterclass", ja: "金曜のマスタークラス" }
  free:      { es: "Entrada libre", ca: "Entrada lliure", en: "Free entry", ja: "参加無料" }
