categories:
  - id: aikido
    color: "#FF7E79"
    name: { es: "Aikido",   ca: "Aikido",   en: "Aikido",   ja: "合気道" }
  - id: iaijutsu
    color: "#94FF94"
    name: { es: "Iaijutsu", ca: "Iaijutsu", en: "Iaijutsu", ja: "居合術" }
  - id: judo
    color: "#76D6FF"
    name: { es: "Judo",     ca: "Judo",     en: "Judo",     ja: "柔道" }
  - id: karate
    color: "#FFE600"
    name: { es: "Karate",   ca: "Karate",   en: "Karate",   ja: "空手" }

# Reusable level labels, so the four translations are written once rather than
# repeated on all eighteen classes.
levels:
  - id: all
    name: { es: "Todos los niveles", ca: "Tots els nivells", en: "All levels", ja: "一般" }
  - id: beginners
    name: { es: "Principiantes",     ca: "Principiants",     en: "Beginners",  ja: "初心者" }
  - id: weapons
    name: { es: "Armas",             ca: "Armes",            en: "Weapons",    ja: "武器" }

classes:
  # ---- Aikido Musubi (the dojo) ----
  - { category: aikido,   location: musubi,     level: all,       days: [tue, thu], start: "18:30", end: "19:30" }
  - { category: aikido,   location: musubi,     level: beginners, days: [tue],      start: "19:30", end: "20:30" }
  - { category: aikido,   location: musubi,     level: weapons,   days: [thu],      start: "19:30", end: "20:30" }
  - { category: aikido,   location: musubi,     level: all,       days: [tue, thu], start: "20:30", end: "21:30" }
  - { category: aikido,   location: musubi,     level: beginners, days: [wed],      start: "20:00", end: "20:45" }
  # Wednesday only. Monday's 20:45–21:30 Aikido was withdrawn; the Monday
  # Iaijutsu class below now runs through that slot instead.
  - { category: aikido,   location: musubi,     level: all,       days: [wed],      start: "20:45", end: "21:30" }
  - { category: aikido,   location: musubi,     level: all,       days: [fri],      start: "19:00", end: "20:00" }
  - { category: aikido,   location: musubi,     level: all,       days: [sat],      start: "08:00", end: "09:00" }

  - { category: iaijutsu, location: musubi,     level: all,       days: [mon],      start: "20:00", end: "21:30" }
  # Once a month, not weekly. `frequency` keeps it out of the weekly grid — a
  # block drawn every Saturday would be wrong three weeks in four, and it also
  # collided with the Aikido class above it — and lists it underneath instead.
  - { category: iaijutsu, location: musubi,     level: all,       days: [sat],      start: "08:00", end: "10:00", frequency: monthly }

  - { category: judo,     location: musubi,     level: all,       days: [mon, wed], start: "18:30", end: "20:00" }

  - { category: karate,   location: musubi,     level: all,       days: [tue],      start: "21:30", end: "22:30" }
  - { category: karate,   location: musubi,     level: all,       days: [fri],      start: "20:00", end: "21:00" }
  - { category: karate,   location: musubi,     level: all,       days: [sat],      start: "11:00", end: "13:00" }

  # ---- Sant Adrià de Besòs ----
  - { category: aikido,   location: sant-adria, level: all,       days: [mon],      start: "20:00", end: "21:00" }
  - { category: aikido,   location: sant-adria, level: all,       days: [wed],      start: "20:15", end: "21:15" }

  # ---- Universidad de Barcelona ----
  - { category: aikido,   location: ub,         level: beginners, days: [mon, wed], start: "19:00", end: "20:00" }
