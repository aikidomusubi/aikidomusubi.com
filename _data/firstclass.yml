  ca: "Una hora al tatami, de principi a fi i sense adorns: a quina hora arribes, què passa als primers quinze minuts i com és la sala. Si no has fet mai aikido, aquesta és la pàgina."
  en: "An hour on the mat, start to finish and with nothing dressed up: when you arrive, what happens in the first fifteen minutes and what the room is like. If you have never done aikido, this is the page for you."
  ja: "畳の上での一時間を、そのままお伝えします。何時に来るのか、最初の十五分に何をするのか、道場はどんな場所なのか。合気道がはじめての方のためのページです。"

