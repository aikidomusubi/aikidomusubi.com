# /como-es-una-clase/ — the prose. Everything else the page shows is derived.
#
# WHY THE PAGE EXISTS. Asked what could not be verified about this dojo from
# outside, the answer was the room and the hour: how big the mat is, how many
# people are on it, and what actually happens during a class. /clases/ says
# which disciplines there are, /horarios/ when, /cuotas/ how much, /visitantes/
# is written for aikidoka passing through. Nobody said what an hour is like.
#
# WHAT IS WRITTEN HERE AND WHAT IS NOT. The clock, the room and the doubts are
# written; the address, the fee, the beginners' class and the number of
# training days are read from _data/venues.yml, _data/fees.yml and
# _data/schedule.yml by the layout. Move the beginners' class an hour in
# schedule.yml and this page moves with it.
#
# HOW IT STAYS OFF THE DOORWAY-PAGE SIDE OF THE LINE. CLAUDE.md is blunt about
# pages that rearrange words the site already has under a new heading. The
# clock and the room are new and exist nowhere else. `doubts` IS mostly the
# FAQ, and it is deliberately the short version in a closed accordion with a
# link to the long one, not a second copy competing for the same query.
#
# NO EM DASHES ANYWHERE IN THIS FILE. House rule, and this page in particular
# has to read as though a person at the dojo wrote it.

