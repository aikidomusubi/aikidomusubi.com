  - { n: 4, id: kyu4, color: "#1A7444", name: { es: "4.º kyū", ca: "4t kyū", en: "4th kyū", ja: "四級" } }
  - { n: 3, id: kyu3, color: "#064F6E", name: { es: "3.er kyū", ca: "3r kyū", en: "3rd kyū", ja: "三級" } }
  - { n: 2, id: kyu2, color: "#6450A1", name: { es: "2.º kyū", ca: "2n kyū", en: "2nd kyū", ja: "二級" } }
  - { n: 1, id: kyu1, color: "#AE5224", name: { es: "1.er kyū", ca: "1r kyū", en: "1st kyū", ja: "一級" } }

