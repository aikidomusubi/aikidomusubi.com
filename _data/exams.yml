  print:      { es: "Imprimir", ca: "Imprimir", en: "Print", ja: "印刷" }
  legend:     { es: "Se añade en", ca: "S'afegeix a", en: "Added at", ja: "追加される級" }
  legend_5:   { es: "Base de 5.º kyū", ca: "Base de 5è kyū", en: "5th kyū base", ja: "五級の基本" }
  all_title:  { es: "Todo el programa, de 5.º a 1.er kyū",
                ca: "Tot el programa, de 5è a 1r kyū",
                en: "The whole programme, 5th to 1st kyū",
                ja: "全要項（五級〜一級）" }
