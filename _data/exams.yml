  - { id: hanmi,   name: { es: "Hanmi-handachi", ca: "Hanmi-handachi", en: "Hanmi-handachi", ja: "半身半立" } }
  - { id: tachi,   name: { es: "Tachi-waza", ca: "Tachi-waza", en: "Tachi-waza", ja: "立技" } }
  - { id: jiyu,    name: { es: "Jiyū-waza", ca: "Jiyū-waza", en: "Jiyū-waza", ja: "自由技" } }
  - { id: buki,    name: { es: "Armas", ca: "Armes", en: "Weapons", ja: "武器" } }
