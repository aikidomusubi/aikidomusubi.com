# ---------------------------------------------------------------------------
# Programa de examen — kyū grades
#
# Transcribed from the dojo's five PDFs. The PDFs are not published: this is
# the content, the page renders it, and the browser's own print-to-PDF cannot
# go stale.
#
# EACH GRADE LISTS ONLY WHAT IT ADDS. The syllabus is cumulative — 4th kyū is
# everything in 5th plus more — and it used to be stored as five complete
# lists, which meant the same technique was written up to five times and the
# grades could silently disagree. They did: the 1st kyū PDF had lost Udekime-
# nage and Maki-otoshi from yokomen, the whole jō programme, and Kata-dori
# nikyō. Storing the additions makes that impossible to express.
#
# `tools/exam-cumulative.py` accumulates these into the six sheets the page
# renders, stamping every technique with the grade it first appears at.
#
#   a   the attack, rōmaji — universal, not translated
#   an  a note ON the attack, which is prose and IS translated
#   w   the techniques. A plain string, or {n:, note:} when something has to be
#       said about one that is not part of its name.
#
# NOTATION, decided once and applied everywhere:
#   · macrons on long vowels — Shihō-nage, Kokyū-hō, Ikkyō, Jō — matching
#     _data/glossary.yml, which has spelled rōmaji that way from the start
#   · compound terms hyphenated: Shōmen-uchi, Katate-dori, Ushiro ryōte-dori
#   · qualifiers follow the name, space-separated, NO parentheses:
#     `Katate-dori gyaku-hanmi`, `Ikkyō jōdan`, `Kaiten-nage uchi`
#   · Kaiten-nage names the direction after the technique: `Kaiten-nage uchi`,
#     `Kaiten-nage soto`, or `Kaiten-nage uchi, soto` for both
#   · anything that is NOT part of the name — a condition, an instruction — is
#     a `note` and renders in italic beside it
#
# CORRECTIONS to the PDFs, all spelling: Shino-nage → Shihō-nage, Nikkyo →
# Nikyō, Tenchin-nage → Tenchi-nage, Ju-waza → Jiyū-waza.
# Left as written, being the dojo's own jō vocabulary: Kaete / Junte / Keshi
# uchiotoshi, Sanshō, Ude-kime-nage, Hiji-kime-osae.
# ---------------------------------------------------------------------------

