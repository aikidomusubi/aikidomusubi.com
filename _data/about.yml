          - { name: "Joan Manel Molina", name_ja: "ジョアン・マネル　モリナ", grade: { es: "3.er dan", ca: "3r dan", en: "3rd dan", ja: "三段" } }
          - { name: "Guanlong Zheng", name_ja: "グアンロン　ジェン",       grade: { es: "3.er dan", ca: "3r dan", en: "3rd dan", ja: "三段" } }
          - { name: "Daniil Mikhaylov", name_ja: "ダニール　ミハイロフ",   grade: { es: "3.er dan", ca: "3r dan", en: "3rd dan", ja: "三段" } }
        more:
          - label: { es: "Quién da cada clase", ca: "Qui fa cada classe",
                     en: "Who teaches which class", ja: "各稽古の担当" }
            url:   { es: "/horarios/", ca: "/ca/horaris/",
                     en: "/en/training-schedule/", ja: "/ja/training-schedule/" }

      - heading: { es: "Dirección técnica", ca: "Direcció tècnica",
                   en: "Technical direction", ja: "指導部" }
        body:
          es:
            - "<strong>Pablo Martín</strong> (Badalona, 1977) empezó a practicar aikido en Badalona en el año 1999 con Ricard Coll. Después ha continuado su práctica al mismo tiempo que ejerce como instructor en <strong>Aikido Musubi</strong>. A lo largo de su trayectoria ha participado en numerosos cursos y seminarios de maestros reputados como Yamada Y. Shihan, Sugano S. Shihan, Shibata I. Shihan, M. Flynn Shihan, D. Waite Shihan y P. Bernath Shihan, entre otros. También ha viajado a Japón para entrenar en la sede mundial del aikido, el Hombu Dojo, con Ueshiba Moriteru Doshu, Miyamoto T. Shihan, Yokota Y. Shihan, Osawa Hayato Shihan, Kuribayashi T. Shihan, Kanazawa T. Shihan y Suzuki T. Shihan, entre otros."
            - "Con el propósito de promover el aikido en Barcelona y sus alrededores, estableció la Asociación Cultural Musubi Aikido en el año 2008, y más tarde asumió los roles de presidente de la asociación y director técnico."
            - "Actualmente tiene el grado de 4.º dan y el título de <em>shidoin</em> (instructor cualificado), otorgado por Aikido Doshu Ueshiba Moriteru y reconocido a nivel mundial por la <em>Aikikai Foundation</em> y la <em>International Aikido Federation</em>."
          ca:
            - "<strong>Pablo Martín</strong> (Badalona, 1977) va començar a practicar aikido a Badalona l'any 1999 amb en Ricard Coll. Després ha continuat la seva pràctica alhora que exerceix com a instructor a <strong>Aikido Musubi</strong>. Al llarg de la seva trajectòria ha participat en nombrosos cursos i seminaris de mestres reputats com Yamada Y. Shihan, Sugano S. Shihan, Shibata I. Shihan, M. Flynn Shihan, D. Waite Shihan i P. Bernath Shihan, entre d'altres. També ha viatjat al Japó per entrenar a la seu mundial de l'aikido, el Hombu Dojo, amb Ueshiba Moriteru Doshu, Miyamoto T. Shihan, Yokota Y. Shihan, Osawa Hayato Shihan, Kuribayashi T. Shihan, Kanazawa T. Shihan i Suzuki T. Shihan, entre d'altres."
            - "Amb el propòsit de promoure l'aikido a Barcelona i rodalia, va establir l'Associació Cultural Musubi Aikido l'any 2008, i més tard va assumir els rols de president de l'associació i director tècnic."
            - "Actualment té el grau de 4t dan i el títol de <em>shidoin</em> (instructor qualificat), atorgat per l'Aikido Doshu Ueshiba Moriteru i reconegut mundialment per la <em>Aikikai Foundation</em> i la <em>International Aikido Federation</em>."
          en:
            - "<strong>Pablo Martín</strong> (Badalona, 1977) began practising aikido in Badalona in 1999 with Ricard Coll. He has continued his own practice while teaching at <strong>Aikido Musubi</strong>. Over the years he has taken part in many courses and seminars with well-known teachers including Yamada Y. Shihan, Sugano S. Shihan, Shibata I. Shihan, M. Flynn Shihan, D. Waite Shihan and P. Bernath Shihan. He has also travelled to Japan to train at aikido's world headquarters, the Hombu Dojo, with Ueshiba Moriteru Doshu, Miyamoto T. Shihan, Yokota Y. Shihan, Osawa Hayato Shihan, Kuribayashi T. Shihan, Kanazawa T. Shihan and Suzuki T. Shihan, among others."
            - "To promote aikido in Barcelona and the surrounding area he established the Asociación Cultural Musubi Aikido in 2008, later taking on the roles of president of the association and technical director."
            - "He currently holds the grade of 4th dan and the title of <em>shidoin</em> (qualified instructor), awarded by Aikido Doshu Ueshiba Moriteru and recognised worldwide by the <em>Aikikai Foundation</em> and the <em>International Aikido Federation</em>."
          ja:
            - "<strong>パブロ・マルティン</strong>（1977年、バダロナ生まれ）は1999年にバダロナでリカルド・コイに師事して合気道を始めました。以後、<strong>合気道産靈</strong>で指導にあたりながら自身の稽古を続けています。これまでに山田嘉光師範、菅野誠一師範、柴田一郎師範、M・フリン師範、D・ウェイト師範、P・ベルナート師範などの講習会に参加。また日本へ渡り、合気道の総本部である本部道場で、植芝守央道主、宮本鶴蔵師範、横田愛明師範、大澤勇人師範、栗林孝典師範、金澤威師範、鈴木俊雄師範らの指導を受けています。"
            - "バルセロナとその周辺で合気道を広めるため、2008年に産靈合気道文化協会を設立し、のちに会長および指導部長を務めています。"
            - "現在は四段、および植芝守央道主より授与された<em>指導員</em>の資格を持ち、（財）合気会と国際合気道連盟によって国際的に認められています。"

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Preguntas frecuentes.
  #
  # Written from what people actually ask before a first class, in roughly the
  # order they ask it: does it work, will I get hurt, do I have to be fit, what
  # does it cost, what do I wear. The awkward ones are in here on purpose —
  # whether the bowing is religious, how long until a hakama, whether you can
  # film — because leaving them out does not stop anyone wondering.
  - id: faq
    slug: { es: "preguntas-frecuentes", ca: "preguntes-frequents",
            en: "faq", ja: "faq" }
    title: { es: "Preguntas frecuentes", ca: "Preguntes freqüents",
             en: "Frequently asked questions", ja: "よくある質問" }
    lede:
      es: "Lo que se pregunta antes de la primera clase, respondido sin rodeos."
      ca: "El que es pregunta abans de la primera classe, respost sense embuts."
      en: "What people ask before their first class, answered plainly."
      ja: "はじめての稽古の前によく聞かれることに、率直にお答えします。"
    faq:
      - q: { es: "¿Sirve el aikido para defenderse?", ca: "Serveix l'aikido per defensar-se?",
             en: "Is aikido any use for self-defence?", ja: "合気道は護身に役立ちますか。" }
        a:
          es: ["Sí, pero no es la razón por la que la mayoría se queda. El aikido enseña a no estar donde llega el golpe, a mantener la distancia y a controlar a alguien sin hacerle daño, y todo eso sirve. Lo que no hace es prepararte para una pelea en dos meses: es un estudio largo y lo dice de entrada."]
          ca: ["Sí, però no és la raó per la qual la majoria s'hi queda. L'aikido ensenya a no ser on arriba el cop, a mantenir la distància i a controlar algú sense fer-li mal, i tot això serveix. El que no fa és preparar-te per a una baralla en dos mesos: és un estudi llarg i ho diu d'entrada."]
          en: ["Yes, but it is not why most people stay. Aikido teaches you not to be where the strike lands, to keep your distance, and to control someone without hurting them, and all of that is useful. What it will not do is prepare you for a fight in two months. It is a long study and it says so up front."]
          ja: ["役に立ちます。ただ、多くの人が続ける理由はそこではありません。打たれる位置に居ない体さばき、間合いの取り方、相手を痛めずに制すること——どれも実際に役立ちます。一方で、二か月で喧嘩に強くなるものではありません。長く続ける稽古であることは、最初にお伝えしています。"]
      - q: { es: "¿Es peligroso? ¿Me van a hacer daño?", ca: "És perillós? Em faran mal?",
             en: "Is it dangerous? Will I get hurt?", ja: "危なくありませんか。怪我をしませんか。" }
        a:
          es: ["Se practica por parejas y con contacto, así que hay que tener cuidado, y eso es exactamente lo que se entrena. No hay competición ni golpes al contacto, la intensidad la ponen los dos y basta con decir que algo molesta para que se pare.",
               "Lo primero que se aprende, antes que cualquier técnica, es a caer."]
          ca: ["Es practica per parelles i amb contacte, així que cal anar amb compte, i això és exactament el que s'entrena. No hi ha competició ni cops al contacte, la intensitat la posen tots dos i n'hi ha prou de dir que alguna cosa molesta perquè es pari.",
               "El primer que s'aprèn, abans que cap tècnica, és a caure."]
          en: ["You practise in pairs and in contact, so care is needed — and care is exactly what you are training. There is no competition and no contact striking; the two of you set the intensity, and saying that something hurts is enough to stop it.",
               "The first thing you learn, before any technique, is how to fall."]
          ja: ["二人一組で、実際に触れて稽古します。だからこそ気をつける必要があり、その気配りこそが稽古の中身です。試合はなく、当てる打撃もありません。強さは二人で決めるもので、痛ければそう言えば止まります。",
               "どんな技よりも先に習うのは、受け身です。"]
      - q: { es: "¿Tengo que ser flexible o estar en forma?", ca: "He de ser flexible o estar en forma?",
             en: "Do I need to be flexible or fit?", ja: "体が硬くても、運動不足でも大丈夫ですか。" }
        a:
          es: ["No. Se empieza donde se está, y el calentamiento y el ukemi construyen la movilidad que hace falta. Si tienes una lesión o una limitación concreta, dilo antes de empezar y se adapta."]
          ca: ["No. Es comença on s'és, i l'escalfament i l'ukemi construeixen la mobilitat que cal. Si tens una lesió o una limitació concreta, digues-ho abans de començar i s'adapta."]
          en: ["No. You start where you are, and the warm-up and the ukemi build the mobility you need. If you have an injury or a specific limitation, say so before you start and it will be adapted."]
          ja: ["必要ありません。今の状態から始めれば大丈夫です。準備運動と受け身が、必要な動きを少しずつつくっていきます。怪我や制限がある場合は、始める前にお知らせください。合わせて稽古します。"]
      - q: { es: "¿Desde qué edad? ¿Hay clases para niños?", ca: "A partir de quina edat? Hi ha classes per a nens?",
             en: "From what age? Are there children's classes?", ja: "何歳から始められますか。子ども向けの稽古はありますか。" }
        a:
          es: ["Escríbenos y te decimos qué grupo encaja. Hay adultos de todas las edades practicando a la vez, que es una de las cosas buenas de que no haya categorías por peso ni por edad."]
          ca: ["Escriu-nos i et diem quin grup encaixa. Hi ha adults de totes les edats practicant alhora, que és una de les coses bones que no hi hagi categories per pes ni per edat."]
          en: ["Write to us and we will tell you which group fits. Adults of every age practise together, which is one of the good things about having no weight or age categories."]
          ja: ["ご連絡ください。どの稽古が合うかお伝えします。年齢の幅は広く、いろいろな世代が同じ時間に稽古しています。体重別も年齢別もない稽古の、良いところの一つです。"]
      - q: { es: "¿Cuánto cuesta empezar?", ca: "Quant costa començar?",
             en: "What does it cost to start?", ja: "始めるのにいくらかかりますか。" }
        a:
          es: ["Las dos primeras clases no cuestan nada y la inscripción es gratuita todo el año. A partir de ahí hay una cuota mensual según la actividad: está toda en <a href=\"/cuotas/\">Cuotas</a>."]
          ca: ["Les dues primeres classes no costen res i la inscripció és gratuïta tot l'any. A partir d'aquí hi ha una quota mensual segons l'activitat: és tota a <a href=\"/ca/quotes/\">Quotes</a>."]
          en: ["The first two classes are free and enrolment is free all year. After that there is a monthly fee depending on the activity, all of it on the <a href=\"/en/fees/\">Fees</a> page."]
          ja: ["最初の二回は無料で、入会金は一年を通じてかかりません。その後は活動ごとの月謝があります。詳しくは<a href=\"/ja/fees/\">月謝</a>のページに。"]
      - q: { es: "¿Qué me pongo el primer día?", ca: "Què em poso el primer dia?",
             en: "What do I wear on the first day?", ja: "初日は何を着ていけばいいですか。" }
        a:
          es: ["Ropa cómoda que cubra los brazos y las piernas, del tipo chándal y camiseta de manga larga. Al tatami se entra descalzo. El keikogi ya llegará cuando decidas quedarte."]
          ca: ["Roba còmoda que cobreixi els braços i les cames, del tipus xandall i samarreta de màniga llarga. Al tatami s'hi entra descalç. El keikogi ja arribarà quan decideixis quedar-t'hi."]
          en: ["Something comfortable that covers your arms and legs — tracksuit bottoms and a long-sleeved top. You step onto the mat barefoot. The keikogi can wait until you decide to stay."]
          ja: ["腕と脚が隠れる動きやすい服装で。ジャージと長袖のシャツで十分です。畳には裸足で上がります。稽古着は、続けると決めてからで構いません。"]
      - q: { es: "¿Cuándo puedo empezar?", ca: "Quan puc començar?",
             en: "When can I start?", ja: "いつから始められますか。" }
        a:
          es: ["Cualquier semana del año. No hay curso ni temporada: los grupos son abiertos y se entra cuando se puede."]
          ca: ["Qualsevol setmana de l'any. No hi ha curs ni temporada: els grups són oberts i s'hi entra quan es pot."]
          en: ["Any week of the year. There is no term and no season: the groups are open and you join when you can."]
          ja: ["いつでも。学期も季節もありません。稽古は常に開かれていて、都合のつくときに始められます。"]
      - q: { es: "¿Cuánto se tarda en llevar hakama?", ca: "Quant es triga a portar hakama?",
             en: "How long until I wear a hakama?", ja: "袴はいつから着けられますか。" }
        a:
          es: ["Depende del dojo y de la línea. En la nuestra el hakama va asociado al grado, no al tiempo, y el grado llega cuando el trabajo está hecho. Nadie te va a dar una fecha, y esa es parte de la respuesta."]
          ca: ["Depèn del dojo i de la línia. A la nostra el hakama va associat al grau, no al temps, i el grau arriba quan la feina està feta. Ningú et donarà una data, i això forma part de la resposta."]
          en: ["It depends on the dojo and the line. In ours the hakama goes with the grade, not with time served, and the grade comes when the work is done. Nobody will give you a date, and that is part of the answer."]
          ja: ["道場や系統によって異なります。私たちのところでは、袴は年数ではなく段位に結びついています。段位は稽古が仕上がったときに来ます。日付をお答えする人はいませんし、それ自体が答えの一部です。"]
      - q: { es: "¿Hay competiciones?", ca: "Hi ha competicions?",
             en: "Are there competitions?", ja: "試合はありますか。" }
        a:
          es: ["No. El aikido no tiene competición por decisión de su fundador, y eso cambia bastante cómo se practica: tu compañero no es un rival, es la persona con la que estás aprendiendo."]
          ca: ["No. L'aikido no té competició per decisió del seu fundador, i això canvia força com es practica: el teu company no és un rival, és la persona amb qui estàs aprenent."]
          en: ["No. Aikido has no competition, by its founder's decision, and that changes how it is practised: your partner is not an opponent, they are the person you are learning with."]
          ja: ["ありません。開祖の考えにより、合気道は試合を行いません。そのぶん稽古の質が変わります。相手は敵ではなく、ともに学ぶ人です。"]
      - q: { es: "¿Puedo ir a mirar antes de apuntarme?", ca: "Puc anar a mirar abans d'apuntar-m'hi?",
             en: "Can I come and watch first?", ja: "見学だけでもできますか。" }
        a:
          es: ["Sí. Avísanos con un día y te decimos cuándo venir. Dicho esto, mirar aikido dice bastante menos que probarlo, y probarlo tampoco cuesta nada."]
          ca: ["Sí. Avisa'ns amb un dia i et diem quan venir. Dit això, mirar aikido diu força menys que provar-lo, i provar-lo tampoc no costa res."]
          en: ["Yes. Give us a day's notice and we will tell you when to come. That said, watching aikido tells you a good deal less than trying it, and trying it is free too."]
          ja: ["できます。前日までにご連絡いただければ、都合のよい日をお伝えします。ただ、合気道は見るよりやってみるほうがずっとわかります。体験も無料です。"]
      - q: { es: "Estoy de paso por Barcelona y practico aikido. ¿Puedo entrenar?",
             ca: "Sóc de pas a Barcelona i practico aikido. Puc entrenar?",
             en: "I practise aikido and I am passing through Barcelona. Can I train?",
             ja: "バルセロナに滞在中の合気道稽古者です。稽古に参加できますか。" }
        a:
          es: ["Claro. Escríbenos antes con tu grado y tu dojo de origen y te decimos qué clases hay esos días. Está explicado en <a href=\"/visitantes/\">Visitantes</a>."]
          ca: ["És clar. Escriu-nos abans amb el teu grau i el teu dojo d'origen i et diem quines classes hi ha aquells dies. Està explicat a <a href=\"/ca/visitants/\">Visitants</a>."]
          en: ["Of course. Write to us first with your grade and your home dojo and we will tell you what is on those days. It is explained on the <a href=\"/en/visitors/\">Visitors</a> page."]
          ja: ["どうぞ。段級とご所属の道場をそえて、事前にご連絡ください。その期間の稽古をお知らせします。詳しくは<a href=\"/ja/visitors/\">ビジターの方へ</a>に。"]
      - q: { es: "¿Hay que saber japonés?", ca: "Cal saber japonès?",
             en: "Do I need to know Japanese?", ja: "日本語がわからなくても大丈夫ですか。" }
        a:
          es: ["No, pero se oye japonés en cada clase: los nombres de las técnicas, los saludos y los números. Se aprende solo, por repetición. Y si quieres adelantarte, está el <a href=\"/glosario/\">glosario</a>."]
          ca: ["No, però se sent japonès a cada classe: els noms de les tècniques, les salutacions i els números. S'aprèn sol, per repetició. I si vols avançar-t'hi, hi ha el <a href=\"/ca/glossari/\">glossari</a>."]
          en: ["No, but you will hear Japanese in every class: the names of the techniques, the greetings and the numbers. It sticks by repetition. If you want a head start, there is the <a href=\"/en/glossary/\">glossary</a>."]
          ja: ["必要ありません。ただ、稽古では毎回日本語を耳にします。技の名前、挨拶、数の数え方。繰り返すうちに自然に覚えます。先に見ておきたい方は<a href=\"/ja/glossary/\">用語集</a>をどうぞ。"]
      - q: { es: "¿Tengo que federarme?", ca: "M'he de federar?",
             en: "Do I have to take out a federation licence?", ja: "連盟の登録は必要ですか。" }
        a:
          es: ["Sí, la licencia federativa incluye el seguro deportivo, que es obligatorio. Se tramita desde el dojo una vez al año."]
          ca: ["Sí, la llicència federativa inclou l'assegurança esportiva, que és obligatòria. Es tramita des del dojo un cop l'any."]
          en: ["Yes. The federation licence includes the sports insurance, which is compulsory. The dojo handles it once a year."]
          ja: ["必要です。連盟登録にはスポーツ保険が含まれており、加入は義務です。手続きは道場が年に一度まとめて行います。"]
      - q: { es: "¿Cuántos días a la semana hay que ir?", ca: "Quants dies a la setmana cal anar-hi?",
             en: "How many days a week should I come?", ja: "週に何回通えばいいですか。" }
        a:
          es: ["Con dos ya se avanza. Con uno se mantiene, y con tres o cuatro se nota mucho. No hay un mínimo obligatorio: la cuota da acceso a todas las clases de tu actividad y vas las que puedas."]
          ca: ["Amb dos ja s'avança. Amb un es manté, i amb tres o quatre es nota molt. No hi ha un mínim obligatori: la quota dóna accés a totes les classes de la teva activitat i hi vas les que puguis."]
          en: ["Two is enough to make progress. One keeps you where you are; three or four shows quickly. There is no compulsory minimum — the fee covers every class in your activity and you come to the ones you can."]
          ja: ["週二回でしっかり進みます。一回なら維持、三、四回になるとはっきり変わります。最低回数の決まりはありません。月謝はその活動のすべての稽古に有効で、来られる日に来ていただければ十分です。"]
      - q: { es: "Tengo una lesión antigua. ¿Puedo practicar?", ca: "Tinc una lesió antiga. Puc practicar?",
             en: "I have an old injury. Can I practise?", ja: "古い怪我があります。稽古できますか。" }
        a:
          es: ["Casi siempre sí, y hay gente entrenando con rodillas, hombros y espaldas de todo tipo. Cuéntanoslo antes de la primera clase y el instructor te dirá qué adaptar. Lo que no hacemos es decidir por ti: si tu médico te ha dicho algo, hazle caso a él."]
          ca: ["Gairebé sempre sí, i hi ha gent entrenant amb genolls, espatlles i esquenes de tota mena. Explica'ns-ho abans de la primera classe i l'instructor et dirà què adaptar. El que no fem és decidir per tu: si el teu metge t'ha dit alguna cosa, fes-li cas a ell."]
          en: ["Almost always, yes; there are people training here with knees, shoulders and backs of every description. Tell us before your first class and the instructor will say what to adapt. What we will not do is decide for you: if your doctor has told you something, listen to them."]
          ja: ["ほとんどの場合は可能です。膝や肩、腰にそれぞれ事情のある人が稽古しています。初回の前にお知らせいただければ、指導者が調整をお伝えします。ただ、判断を代わることはできません。医師の指示があるなら、そちらに従ってください。"]
      - q: { es: "¿Saludar es una cosa religiosa?", ca: "Saludar és una cosa religiosa?",
             en: "Is the bowing religious?", ja: "礼には宗教的な意味がありますか。" }
        a:
          es: ["No. El saludo al frente del dojo reconoce que lo que se practica aquí lo construyeron otros antes; el saludo al compañero es agradecerle que preste su cuerpo para que aprendas. No hay culto, ni oración, ni se pide creer en nada."]
          ca: ["No. La salutació al front del dojo reconeix que allò que es practica aquí ho van construir altres abans; la salutació al company és agrair-li que presti el seu cos perquè aprenguis. No hi ha culte, ni oració, ni es demana creure en res."]
          en: ["No. The bow to the front of the dojo acknowledges that what is practised here was built by others first; the bow to your partner thanks them for lending you their body so that you can learn. There is no worship, no prayer, and nothing you are asked to believe."]
          ja: ["ありません。正面への礼は、ここで稽古できるものを築いた先人への確認です。相手への礼は、学ばせてもらうために体を貸してくれることへの感謝です。信仰も祈りもなく、何かを信じるよう求めることもありません。"]
      - q: { es: "¿Hay vestuarios y duchas? ¿Dónde aparco?", ca: "Hi ha vestidors i dutxes? On aparco?",
             en: "Are there changing rooms and showers? Where do I park?",
             ja: "更衣室やシャワーはありますか。駐車場は。" }
        a:
          es: ["En Badalona hay vestuarios y el aparcamiento es gratuito. Los otros dos espacios son instalaciones municipales y universitarias con sus propias condiciones: están detalladas en <a href=\"/acceso/\">Acceso</a>."]
          ca: ["A Badalona hi ha vestidors i l'aparcament és gratuït. Els altres dos espais són instal·lacions municipals i universitàries amb les seves pròpies condicions: estan detallades a <a href=\"/ca/acces/\">Accés</a>."]
          en: ["In Badalona there are changing rooms and parking is free. The other two are municipal and university facilities with their own arrangements, set out on the <a href=\"/en/access-information/\">Access</a> page."]
          ja: ["バダロナには更衣室があり、駐車は無料です。ほかの二か所は市とバルセロナ大学の施設で、それぞれ条件が異なります。<a href=\"/ja/access-information/\">アクセス</a>のページに詳しく記しています。"]
      - q: { es: "¿Se para en agosto o en vacaciones?", ca: "Es para a l'agost o per vacances?",
             en: "Do you stop in August or over holidays?", ja: "八月や祝日は休みですか。" }
        a:
          es: ["En agosto el horario se reduce y en los festivos el dojo cierra. Todo eso está, con fechas, en el <a href=\"/calendario/\">calendario</a>."]
          ca: ["A l'agost l'horari es redueix i els festius el dojo tanca. Tot això és, amb dates, al <a href=\"/ca/calendari/\">calendari</a>."]
          en: ["In August the timetable is reduced, and the dojo closes on public holidays. It is all there, with dates, in the <a href=\"/en/calendar/\">calendar</a>."]
          ja: ["八月は稽古時間が短くなり、祝日は休みになります。日付はすべて<a href=\"/ja/calendar/\">カレンダー</a>に載せています。"]
      - q: { es: "Si dejo de venir unos meses, ¿pierdo algo?", ca: "Si deixo de venir uns mesos, hi perdo alguna cosa?",
             en: "If I stop for a few months, do I lose anything?", ja: "数か月休むと、何か失いますか。" }
        a:
          es: ["No. Se puede pausar y volver, y volver después de años también. El grado no caduca y el sitio sigue estando."]
          ca: ["No. Es pot pausar i tornar, i tornar després d'anys també. El grau no caduca i el lloc continua sent-hi."]
          en: ["No. You can pause and come back, and come back after years as well. The grade does not expire and the place is still here."]
          ja: ["何も失いません。休んで戻ることも、何年か経ってから戻ることもできます。段級は失効しませんし、場所もそのままあります。"]
      - q: { es: "¿Tengo que comprar armas?", ca: "He de comprar armes?",
             en: "Do I have to buy weapons?", ja: "武器は買わないといけませんか。" }
        a:
          es: ["Al principio no. Hay bokken y jō del dojo para usar. Cuando decidas comprarte los tuyos te decimos dónde y qué medida te conviene."]
          ca: ["Al principi no. Hi ha bokken i jō del dojo per fer servir. Quan decideixis comprar-te els teus et diem on i quina mida et convé."]
          en: ["Not at first. The dojo has bokken and jō you can use. When you decide to buy your own we will tell you where, and what length suits you."]
          ja: ["最初は必要ありません。道場の木刀と杖を使えます。自分のものを持ちたくなったら、購入先と適した寸法をお伝えします。"]
      - q: { es: "¿Puedo hacer fotos o vídeo en clase?", ca: "Puc fer fotos o vídeo a classe?",
             en: "Can I take photos or video in class?", ja: "稽古中に写真や動画を撮ってもいいですか。" }
        a:
          es: ["Pregunta antes. En el tatami hay menores y hay gente que no quiere salir, y eso manda por encima de cualquier foto."]
          ca: ["Pregunta abans. Al tatami hi ha menors i hi ha gent que no vol sortir-hi, i això mana per sobre de qualsevol foto."]
          en: ["Ask first. There are minors on the mat and there are people who would rather not appear, and that comes before any photograph."]
          ja: ["まずひと声かけてください。畳の上には未成年もいますし、写りたくない人もいます。それはどんな一枚よりも優先されます。"]
      - q: { es: "¿Y las otras artes que se dan en el dojo?", ca: "I les altres arts que es fan al dojo?",
             en: "What about the other arts taught in the dojo?", ja: "道場で行われている他の武道は。" }
        a:
          es: ["El mismo tatami acoge iaijutsu, judo y karate, cada uno con su instructor y su horario. Están en <a href=\"/clases/\">Clases</a>."]
          ca: ["El mateix tatami acull iaijutsu, judo i karate, cadascun amb el seu instructor i el seu horari. Són a <a href=\"/ca/classes/\">Classes</a>."]
          en: ["The same mat hosts iaijutsu, judo and karate, each with its own instructor and timetable. They are on the <a href=\"/en/classes/\">Classes</a> page."]
          ja: ["同じ畳で居合術、柔道、空手も行っています。それぞれに指導者と稽古時間があります。<a href=\"/ja/classes/\">各クラスの紹介</a>をご覧ください。"]

# ---------------------------------------------------------------------------
# Instructors in training
#
# The Tuesday 20:30 slot has said "Instructor en formación" in the timetable
# since the programme started, and nothing on the site explained it. This is
# that explanation.
#
# It lives on THE ASSOCIATION page, not on Classes: it is not a class anyone
# can sign up to, it is how the dojo keeps having teachers — which is what the
# association page is for. Rendered by _layouts/about.html for `topic:
# association` only, as the last thing before the footer.
#
# Places open as they free up rather than in cohorts, and there is no fee.
# ---------------------------------------------------------------------------
instructors:
  eyebrow: { es: "Instructores en formación", ca: "Instructors en formació",
             en: "Instructors in training", ja: "指導者研修" }
  title:
    es: "Enseñar también se aprende"
    ca: "Ensenyar també s'aprèn"
    en: "Teaching is learned too"
    ja: "教えることもまた学ぶこと"
  lede:
    es: "Los martes a las 20:30 la clase la da alguien que está aprendiendo a darla."
    ca: "Els dimarts a les 20:30 la classe la fa algú que està aprenent a fer-la."
    en: "On Tuesdays at 20:30 the class is taught by someone who is learning to teach it."
    ja: "火曜20:30の稽古は、教えることを学んでいる者が指導します。"
  body:
    es: "Un dojo dura lo que duran sus profesores. Enseñar aikido no se sigue de saber hacerlo: son dos cosas distintas, y la segunda se aprende como se aprende la primera, en el tatami y delante de gente."
    ca: "Un dojo dura el que duren els seus professors. Ensenyar aikido no se segueix de saber-lo fer: són dues coses diferents, i la segona s'aprèn com s'aprèn la primera, al tatami i davant de gent."
    en: "A dojo lasts as long as its teachers do. Teaching aikido does not follow from being able to do it: they are two different things, and the second is learned the way the first is, on the mat and in front of people."
    ja: "道場は指導者が続く限り続きます。合気道を教えることは、できることの延長ではありません。二つは別のものであり、後者もまた前者と同じく、畳の上で人の前に立って学ぶものです。"
  timetable:
    es: "En el horario ese hueco ya aparece: <b>martes, 20:30, Instructor en formación</b>."
    ca: "A l'horari aquest buit ja hi apareix: <b>dimarts, 20:30, Instructor en formació</b>."
    en: "The slot is already in the timetable: <b>Tuesday, 20:30, Instructor in training</b>."
    ja: "この枠は時間割にすでにあります。<b>火曜 20:30、指導者研修中</b>。"
  # NOT "Escríbenos". The footer's invitation band sits a few hundred pixels
  # below with a button that already says exactly that; this one names what
  # it is asking about instead.
  cta: { es: "Pregunta por el programa", ca: "Pregunta pel programa",
         en: "Ask about the programme", ja: "課程について問い合わせる" }
  parts:
    - head: { es: "El programa", ca: "El programa", en: "The programme", ja: "課程について" }
      items:
        - es: "Cada martes de 20:30 a 21:30 la clase la dirige un yūdansha en formación. El director técnico está en el tatami, practicando como uno más."
          ca: "Cada dimarts de 20:30 a 21:30 la classe la dirigeix un yūdansha en formació. El director tècnic és al tatami, practicant com un més."
          en: "Every Tuesday from 20:30 to 21:30 the class is led by a yūdansha in training. The technical director is on the mat, practising alongside everyone else."
          ja: "毎週火曜20:30から21:30まで、研修中の有段者が稽古を指導します。技術部長も畳に上がり、一人の稽古者として加わります。"
        - es: "El comentario llega después de la clase, o de forma periódica según el momento del programa. Nunca durante, y nunca delante de los alumnos."
          ca: "El comentari arriba després de la classe, o de manera periòdica segons el moment del programa. Mai durant, i mai davant dels alumnes."
          en: "The feedback comes after class, or periodically depending on where you are in the programme. Never during, and never in front of the students."
          ja: "講評は稽古の後、または課程の段階に応じて折々に伝えます。稽古中に、また門人の前で行うことはありません。"
        - es: "No es una clase de prueba ni una suplencia. Es la clase de ese día, con sus alumnos y su programa."
          ca: "No és una classe de prova ni una suplència. És la classe d'aquell dia, amb els seus alumnes i el seu programa."
          en: "It is not a trial class or a stand-in. It is that day's class, with its students and its syllabus."
          ja: "試しの稽古でも代講でもありません。その日の稽古そのものであり、門人も内容も本来のものです。"
    - head: { es: "Los dos años", ca: "Els dos anys", en: "The two years", ja: "二年の流れ" }
      items:
        - es: "El primer año se observa y se asiste: preparar la sesión, corregir en pareja, llevar el calentamiento, tomar el examen de otro."
          ca: "El primer any s'observa i s'assisteix: preparar la sessió, corregir en parella, portar l'escalfament, prendre l'examen d'un altre."
          en: "The first year is watching and assisting: preparing the session, correcting in pairs, leading the warm-up, sitting on someone else's grading."
          ja: "一年目は見て、手伝う年です。稽古の準備、二人組での修正、準備運動の指導、他者の審査への同席。"
        - es: "El segundo se dirige. La frecuencia sube y el comentario baja, hasta que la clase se sostiene sola."
          ca: "El segon es dirigeix. La freqüència puja i el comentari baixa, fins que la classe se sosté sola."
          en: "The second year is leading. The frequency goes up and the commentary goes down, until the class holds itself."
          ja: "二年目は指導する年です。回数が増え、講評は減り、やがて稽古はひとりでに立ちます。"
        - es: "Dos años no es una cifra ritual: es lo que tarda alguien en pasar por un curso entero de programa, dos ciclos de exámenes y un verano."
          ca: "Dos anys no és una xifra ritual: és el que triga algú a passar per un curs sencer de programa, dos cicles d'exàmens i un estiu."
          en: "Two years is not a ceremonial number: it is how long it takes to go through a full year of syllabus, two grading cycles and a summer."
          ja: "二年という数に儀式的な意味はありません。要項を一巡し、審査を二度経験し、夏を一度越すのに要する時間です。"
    - head: { es: "Qué se espera", ca: "Què s'espera", en: "What is asked of you", ja: "求められること" }
      items:
        - es: "Grado de yūdansha y práctica regular, aquí o en el dojo de origen."
          ca: "Grau de yūdansha i pràctica regular, aquí o al dojo d'origen."
          en: "Yūdansha grade and regular practice, here or at your own dojo."
          ja: "有段者であること、そして当道場または所属道場での継続した稽古。"
        - es: "Asistencia sostenida: enseñar los martes exige entrenar el resto de la semana."
          ca: "Assistència sostinguda: ensenyar els dimarts exigeix entrenar la resta de la setmana."
          en: "Steady attendance: teaching on Tuesdays asks that you train the rest of the week."
          ja: "続けて通うこと。火曜に教えるには、週の残りを稽古する必要があります。"
        - es: "Preparar cada sesión: saber qué se va a trabajar y por qué, antes de subir al tatami."
          ca: "Preparar cada sessió: saber què es treballarà i per què, abans de pujar al tatami."
          en: "Prepare each session: know what you will work on and why, before you step on the mat."
          ja: "毎回の稽古を準備すること。何をなぜ行うのかを、畳に上がる前に定めておく。"
    - head: { es: "Cómo entrar", ca: "Com entrar-hi", en: "How to join", ja: "参加について" }
      items:
        - es: "Cuatro plazas, y se entra cuando queda una libre. No hay convocatorias ni fechas de inscripción."
          ca: "Quatre places, i s'hi entra quan en queda una de lliure. No hi ha convocatòries ni dates d'inscripció."
          en: "Four places, and you join when one frees up. There are no intakes and no application dates."
          ja: "定員は四名。空きが出たときに加わります。募集期間や締切はありません。"
        - es: "El programa no tiene coste para quien participa."
          ca: "El programa no té cap cost per a qui hi participa."
          en: "The programme costs those taking part nothing."
          ja: "この課程に参加費はかかりません。"
        - es: "Escríbenos y hablamos. Si practicas en otro dojo, ven con el visto bueno de tu sensei."
          ca: "Escriu-nos i en parlem. Si practiques en un altre dojo, vine amb el vistiplau del teu sensei."
          en: "Write to us and we will talk. If you train at another dojo, come with your own sensei's blessing."
          ja: "まずはご連絡ください。他道場で稽古されている方は、ご自身の指導者の了解を得たうえでお越しください。"
