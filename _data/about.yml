# Sobre nosotros — the four topics behind the nav dropdown.
#
# This is the content that used to sit on the homepage as five long sections.
# It did not belong there: a beginner never read past the first, and another
# dojo or a federation wants a page it can link to, not an anchor two thirds of
# the way down a front page. Nothing was cut in the move.
#
# ONE SOURCE, FOUR LANGUAGES. Each topic below carries `title`, `lede` and a
# list of `blocks`. A block is a heading plus paragraphs, and optionally an
# image or a definition list of facts. _layouts/about.html renders them; the
# sixteen page files are stubs that name a topic and nothing else.

ui:
  section:  { es: "Sobre nosotros", ca: "Sobre nosaltres",
              en: "About us",       ja: "私たちについて" }

topics:
  # ---------------------------------------------------------------------------
  - id: dojo
    image: index-8oGCaMDs-02
    slug: { es: "el-dojo", ca: "el-dojo", en: "the-dojo", ja: "the-dojo" }
    title: { es: "El dojo", ca: "El dojo", en: "The dojo", ja: "道場" }
    lede:
      es: "Dónde entrenamos, cómo se cuida el espacio y qué encontrarás cuando llegues."
      ca: "On entrenem, com es cuida l'espai i què hi trobaràs quan arribis."
      en: "Where we train, how the space is looked after, and what you will find when you arrive."
      ja: "稽古の場、その手入れ、そして訪れたときに目にするもの。"
    blocks:
      - heading: { es: "Un espacio para las artes marciales", ca: "Un espai per a les arts marcials",
                   en: "A space for martial arts", ja: "武道のための場所" }
        body:
          es:
            - "Nuestro dojo es un espacio grande y diáfano destinado exclusivamente a la práctica y la enseñanza de las artes marciales. Está supervisado y gestionado por el director técnico y los instructores de la asociación; pero siendo responsabilidad de todos, y no sólo de los instructores o del profesor, lo mantienen y lo cuidan los estudiantes."
            - "El dojo es un lugar ideal para profundizar en el estudio y la comprensión de las artes marciales, y para conocer todo tipo de personas independientemente de su edad, sexo y ocupación."
          ca:
            - "El nostre dojo és un espai gran i diàfan destinat exclusivament a la pràctica i l'ensenyament de les arts marcials. Està supervisat i gestionat pel director tècnic i els instructors de l'associació; però com que és responsabilitat de tothom, i no només dels instructors o del professor, el mantenen i el cuiden els estudiants."
            - "El dojo és un lloc ideal per aprofundir en l'estudi i la comprensió de les arts marcials, i per conèixer tota mena de persones independentment de la seva edat, sexe i ocupació."
          en:
            - "Our dojo is a large, open space given over entirely to the practice and teaching of martial arts. It is supervised and run by the technical director and the association's instructors; but because looking after it is everyone's responsibility and not only the instructors', it is the students who maintain and care for it."
            - "The dojo is a good place to study martial arts seriously, and to meet all kinds of people whatever their age, sex or occupation."
          ja:
            - "私たちの道場は、武道の稽古と指導のためだけに使われる、広く見通しのよい空間です。運営は指導部と協会の指導者が担いますが、道場の手入れは指導者だけの仕事ではなく全員の務めであり、実際に維持し整えているのは稽古生です。"
            - "道場は武道を深く学ぶのに適した場所であり、年齢や性別、職業を問わずさまざまな人と出会える場でもあります。"
      # Reihō. Written as a numbered list rather than prose because it is a
      # list — someone reading it the night before their first class wants to
      # be able to count the things they have to remember.
      - heading: { es: "Cómo se entra y cómo se sale", ca: "Com s'hi entra i com se'n surt",
                   en: "How you come in and how you leave", ja: "入り方と出方" }
        body:
          es:
            - "La etiqueta del dojo, el <em>礼法 reihō</em>, no es ceremonia: es la manera de que cuarenta personas descalzas compartan un suelo sin estorbarse. Nadie espera que la sepas el primer día, y nadie te va a corregir con mala cara. Esto es todo lo que hay que saber."
          ca:
            - "L'etiqueta del dojo, el <em>礼法 reihō</em>, no és cerimònia: és la manera que quaranta persones descalces comparteixin un terra sense fer-se nosa. Ningú espera que la sàpigues el primer dia, i ningú et corregirà amb mala cara. Això és tot el que cal saber."
          en:
            - "Dojo etiquette, <em>礼法 reihō</em>, is not ceremony: it is how forty barefoot people share one floor without getting in each other's way. Nobody expects you to know it on your first day, and nobody will correct you unkindly. This is all of it."
          ja:
            - "道場の作法、<em>礼法</em>は儀式ではありません。裸足の四十人が一つの床を分け合うための約束事です。初日から知っている必要はありませんし、きつく直されることもありません。必要なのは次のことだけです。"
        steps:
          - es: "<b>El calzado se queda en el borde.</b> Al tatami se entra descalzo, siempre. Deja los zapatos con las puntas hacia fuera, para poder ponértelos sin girarte."
            ca: "<b>El calçat es queda a la vora.</b> Al tatami s'hi entra descalç, sempre. Deixa les sabates amb les puntes cap enfora, per poder posar-te-les sense girar-te."
            en: "<b>Shoes stay at the edge.</b> You step onto the mat barefoot, always. Leave them pointing outwards so you can put them on without turning round."
            ja: "<b>履物は畳の外に。</b>畳には必ず裸足で上がります。靴は爪先を外に向けて置くと、向きを変えずに履けます。"
          - es: "<b>Saluda al entrar y al salir del tatami.</b> De pie, mirando al frente del dojo, una inclinación breve. Es lo que separa la calle del sitio donde vas a entrenar."
            ca: "<b>Saluda en entrar i en sortir del tatami.</b> Dret, mirant al front del dojo, una inclinació breu. És el que separa el carrer del lloc on entrenaràs."
            en: "<b>Bow as you step on and off the mat.</b> Standing, facing the front of the dojo, a short bow. It is what separates the street from the place you are about to train in."
            ja: "<b>畳に上がるとき、降りるときに礼を。</b>立ったまま正面に向かい、軽く一礼します。これが外と稽古の場との区切りです。"
          - es: "<b>Saluda a tu compañero antes y después.</b> Antes se dice <em>お願いします onegaishimasu</em>; después, <em>ありがとうございました arigatō gozaimashita</em>."
            ca: "<b>Saluda el teu company abans i després.</b> Abans es diu <em>お願いします onegaishimasu</em>; després, <em>ありがとうございました arigatō gozaimashita</em>."
            en: "<b>Bow to your partner before and after.</b> Before, you say <em>お願いします onegaishimasu</em>; after, <em>ありがとうございました arigatō gozaimashita</em>."
            ja: "<b>相手にも稽古の前後に礼を。</b>始めに<em>お願いします</em>、終わりに<em>ありがとうございました</em>。"
          - es: "<b>Si llegas tarde</b>, cámbiate, siéntate en <em>seiza</em> en el borde del tatami y espera a que el instructor te haga una señal. No cruces por delante de él."
            ca: "<b>Si arribes tard</b>, canvia't, seu en <em>seiza</em> a la vora del tatami i espera que l'instructor et faci un senyal. No creuis per davant seu."
            en: "<b>If you are late</b>, change, sit in <em>seiza</em> at the edge of the mat and wait for the instructor to wave you on. Do not cross in front of them."
            ja: "<b>遅れたときは</b>着替えて畳の端で正座し、指導者の合図を待ちます。指導者の前を横切らないようにします。"
          - es: "<b>Nada de anillos, relojes ni pendientes</b>, y las uñas de manos y pies cortas. Las dos cosas hacen daño, y no a quien las lleva."
            ca: "<b>Res d'anells, rellotges ni arracades</b>, i les ungles de mans i peus curtes. Totes dues coses fan mal, i no a qui les porta."
            en: "<b>No rings, watches or earrings</b>, and keep finger and toe nails short. Both hurt somebody, and not the person wearing them."
            ja: "<b>指輪、腕時計、ピアスは外し</b>、手足の爪は短く。どちらも怪我をさせるのは自分ではなく相手です。"
          - es: "<b>El keikogi limpio</b>, cada día. Se entrena muy cerca de otra persona."
            ca: "<b>El keikogi net</b>, cada dia. S'entrena molt a prop d'una altra persona."
            en: "<b>A clean keikogi</b>, every day. You train very close to another person."
            ja: "<b>稽古着は毎回洗ったものを。</b>相手とごく近い距離で稽古します。"
          - es: "<b>No se come ni se bebe en el tatami</b>, y el móvil se queda en el vestuario."
            ca: "<b>No es menja ni es beu al tatami</b>, i el mòbil es queda al vestidor."
            en: "<b>No food or drink on the mat</b>, and phones stay in the changing room."
            ja: "<b>畳の上での飲食はしません。</b>携帯電話は更衣室に置いておきます。"
          - es: "<b>Al final se limpia entre todos.</b> Lleva cinco minutos y no es tarea de los principiantes: es de todos, y el director técnico también barre."
            ca: "<b>Al final es neteja entre tots.</b> Són cinc minuts i no és feina dels principiants: és de tothom, i el director tècnic també escombra."
            en: "<b>Everyone cleans at the end.</b> It takes five minutes and it is not the beginners' job: it is everybody's, and the technical director sweeps too."
            ja: "<b>終わったら全員で掃除をします。</b>五分ほどで、初心者の仕事ではありません。全員の務めで、指導部長も箒を持ちます。"

      - heading: { es: "La primera vez, paso a paso", ca: "La primera vegada, pas a pas",
                   en: "Your first time, step by step", ja: "はじめての一日" }
        body:
          es:
            - "Llegas quince minutos antes. Te enseñamos dónde está el vestuario, te cambias con ropa cómoda de manga larga y sales al borde del tatami. Alguien te explicará las dos o tres cosas de la lista de arriba: nadie espera que las sepas."
            - "La clase empieza sentados en <em>seiza</em>, con un saludo al frente del dojo y otro entre el instructor y el grupo. Después hay un calentamiento y unos ejercicios de <em>ukemi</em>, la caída, que es lo primero que se aprende y lo que más se repite. Luego el instructor muestra una técnica y se practica por parejas, cambiando de compañero varias veces. Se cierra con un ejercicio de respiración y otro saludo."
            - "Dura una hora. No hay marcador y no gana nadie. Si algo te molesta, se para y ya está: se dice y se para."
          ca:
            - "Arribes quinze minuts abans. T'ensenyem on és el vestidor, et canvies amb roba còmoda de màniga llarga i surts a la vora del tatami. Algú t'explicarà les dues o tres coses de la llista de dalt: ningú espera que les sàpigues."
            - "La classe comença asseguts en <em>seiza</em>, amb una salutació al front del dojo i una altra entre l'instructor i el grup. Després hi ha un escalfament i uns exercicis d'<em>ukemi</em>, la caiguda, que és el primer que s'aprèn i el que més es repeteix. Tot seguit l'instructor mostra una tècnica i es practica per parelles, canviant de company diverses vegades. Es tanca amb un exercici de respiració i una altra salutació."
            - "Dura una hora. No hi ha marcador i no guanya ningú. Si alguna cosa et molesta, es para i ja està: es diu i es para."
          en:
            - "Arrive fifteen minutes early. We will show you the changing room; put on something comfortable with long sleeves and come out to the edge of the mat. Someone will run you through the two or three things on the list above — nobody expects you to know them."
            - "The class starts seated in <em>seiza</em>, with a bow to the front of the dojo and another between the instructor and the group. Then a warm-up and some <em>ukemi</em>, the falls, which are the first thing you learn and the thing you repeat most. The instructor then shows a technique and you practise it in pairs, changing partner several times. It closes with a breathing exercise and one more bow."
            - "It lasts an hour. There is no score and nobody wins. If something hurts, you say so and it stops. That is all it takes."
          ja:
            - "十五分前にお越しください。更衣室をご案内します。長袖の動きやすい服に着替えて、畳の端まで出てきてください。上の項目のうち大事なところは、その場で誰かが教えます。知らなくて構いません。"
            - "稽古は正座から始まり、正面への礼、そして指導者と全員との礼を交わします。次に準備運動と<em>受け身</em>。受け身は最初に習い、いちばん多く繰り返すものです。そのあと指導者が技を示し、相手を何度か替えながら二人一組で稽古します。最後に呼吸法を行い、もう一度礼をして終わります。"
            - "所要は一時間。点数はつかず、勝ち負けもありません。痛いところがあれば、言えばそこで止めます。それだけのことです。"

      - heading: { es: "El shōmen", ca: "El shōmen", en: "The shōmen", ja: "正面" }
        body:
          es:
            - "El frente del dojo, el <em>正面 shōmen</em>, es la pared hacia la que se saluda. En la nuestra hay una caligrafía y un retrato del fundador, Morihei Ueshiba. El saludo no va dirigido a una persona ni a una religión: reconoce que lo que se practica aquí lo construyeron otros antes, y que uno lo recibe prestado."
            - "A la entrada del tatami hay además una frase que no es japonesa de origen: <em lang=\"ja\">唱えよ、友、そして入れ</em>, «habla, amigo, y entra». Quien la reconozca sabrá de dónde viene. Quien no, tiene la traducción justo debajo."
          ca:
            - "El front del dojo, el <em>正面 shōmen</em>, és la paret cap a la qual se saluda. A la nostra hi ha una cal·ligrafia i un retrat del fundador, Morihei Ueshiba. La salutació no va dirigida a una persona ni a una religió: reconeix que allò que es practica aquí ho van construir altres abans, i que un ho rep en préstec."
            - "A l'entrada del tatami hi ha a més una frase que no és japonesa d'origen: <em lang=\"ja\">唱えよ、友、そして入れ</em>, «parla, amic, i entra». Qui la reconegui sabrà d'on ve. Qui no, té la traducció just a sota."
          en:
            - "The front of the dojo, the <em>正面 shōmen</em>, is the wall you bow towards. Ours carries a piece of calligraphy and a portrait of the founder, Morihei Ueshiba. The bow is not addressed to a person or to a religion: it acknowledges that what is practised here was built by others first, and that you have it on loan."
            - "At the entrance to the mat there is also a line that is not Japanese in origin: <em lang=\"ja\">唱えよ、友、そして入れ</em>, \"speak, friend, and enter\". Anyone who recognises it will know where it comes from. Anyone who does not has the translation right underneath."
          ja:
            - "道場の<em>正面</em>は、礼をする側の壁です。私たちの道場には書と、開祖・植芝盛平の写真を掲げています。この礼は特定の人物や宗教に向けたものではありません。ここで稽古できるものを築いたのは先人であり、自分はそれを借りているにすぎない、という確認です。"
            - "畳の入口には、もともとは日本語ではない一文も掲げてあります。<em>唱えよ、友、そして入れ</em>。出典がわかる人にはわかりますし、わからなくても、すぐ下に訳が添えてあります。"

      - heading: { es: "Nuestros espacios", ca: "Els nostres espais",
                   en: "Our spaces", ja: "私たちの稽古場" }
        body:
          es:
            - "Además de nuestra actividad en el dojo, <strong>Aikido Musubi</strong> ofrece clases en otros espacios de Barcelona y sus alrededores. Actualmente impartimos clases en el Polideportivo Municipal Marina-Besòs, en el Complejo Deportivo Municipal Espronceda y en la Facultad de Derecho de la Universidad de Barcelona, acercando la práctica del aikido a nuevos entornos y comunidades."
          ca:
            - "A més de l'activitat al dojo, <strong>Aikido Musubi</strong> ofereix classes en altres espais de Barcelona i rodalia. Actualment fem classes al Poliesportiu Municipal Marina-Besòs, al Complex Esportiu Municipal Espronceda i a la Facultat de Dret de la Universitat de Barcelona, acostant la pràctica de l'aikido a nous entorns i comunitats."
          en:
            - "Beyond the dojo itself, <strong>Aikido Musubi</strong> teaches in other spaces around Barcelona. We currently run classes at the Marina-Besòs municipal sports centre, at the Espronceda municipal sports complex and at the Faculty of Law of the University of Barcelona, bringing aikido to new places and communities."
          ja:
            - "道場での活動に加え、<strong>産靈合気道文化協会</strong>はバルセロナ周辺の他の施設でも稽古を行っています。現在はマリナ・バゾス市立スポーツセンター、エスプロンセダ市立スポーツ複合施設、そしてバルセロナ大学法学部で稽古を開いており、合気道を新しい場所と人びとに届けています。"
        # The three cards come from _data/venues.yml and the days from
        # _data/schedule.yml. Nothing about a venue is written twice, so a
        # class moving night cannot leave this page saying the old one.
        venues: true
        more:
          - label: { es: "Cómo llegar a cada uno", ca: "Com arribar a cadascun",
                     en: "How to get to each one", ja: "それぞれへの行き方" }
            url:   { es: "/acceso/", ca: "/ca/acces/",
                     en: "/en/access-information/", ja: "/ja/access-information/" }
          - label: { es: "Qué se da en cada uno", ca: "Què s'hi fa a cadascun",
                     en: "What is taught at each", ja: "それぞれの稽古内容" }
            url:   { es: "/horarios/", ca: "/ca/horaris/",
                     en: "/en/training-schedule/", ja: "/ja/training-schedule/" }

  # ---------------------------------------------------------------------------
  - id: aikido
    image: classes-CJc2lhFv-27
    slug: { es: "aikido", ca: "aikido", en: "aikido", ja: "aikido" }
    title: { es: "Aikido", ca: "Aikido", en: "Aikido", ja: "合気道" }
    lede:
      es: "Qué es, de dónde viene y cómo se practica aquí."
      ca: "Què és, d'on ve i com es practica aquí."
      en: "What it is, where it comes from, and how it is practised here."
      ja: "合気道とは何か、どこから来たのか、そしてここでどう稽古するのか。"
    blocks:
      - heading: { es: "El arte", ca: "L'art", en: "The art", ja: "この武道について" }
        body:
          es:
            - "El aikido es un arte marcial japonés no competitivo desarrollado a principios del siglo XX por Morihei Ueshiba (1883-1969). Se basa en otras artes marciales tradicionales de Japón, principalmente <em>Daitō-ryū Aiki-jūjutsu</em>, y utiliza movimientos flexibles, naturales y altamente efectivos para evadir, redirigir o neutralizar los ataques utilizando la fuerza del oponente."
            - "La práctica del aikido es un entrenamiento físico arduo que se basa en la repetición de ejercicios, manteniendo un buen balance entre la izquierda y la derecha, y alternando entre la realización de técnicas y su aceptación. El aikido no sólo es bueno para la salud, sino que también desarrolla la autoconfianza de forma natural para la vida diaria."
            - "Se puede empezar a practicar aikido en cualquier momento, independientemente de la edad o de la condición física; tanto hombres como mujeres, desde adultos hasta niños."
          ca:
            - "L'aikido és un art marcial japonès no competitiu desenvolupat a principis del segle XX per Morihei Ueshiba (1883-1969). Es basa en altres arts marcials tradicionals del Japó, principalment el <em>Daitō-ryū Aiki-jūjutsu</em>, i utilitza moviments flexibles, naturals i altament efectius per evadir, redirigir o neutralitzar els atacs aprofitant la força de l'oponent."
            - "La pràctica de l'aikido és un entrenament físic exigent basat en la repetició d'exercicis, mantenint un bon equilibri entre l'esquerra i la dreta, i alternant entre fer les tècniques i rebre-les. L'aikido no només és bo per a la salut, sinó que també desenvolupa la confiança en un mateix de manera natural per a la vida diària."
            - "Es pot començar a practicar aikido en qualsevol moment, independentment de l'edat o de la condició física; tant homes com dones, des d'adults fins a nens."
          en:
            - "Aikido is a non-competitive Japanese martial art developed in the early twentieth century by Morihei Ueshiba (1883-1969). It draws on other traditional Japanese martial arts, principally <em>Daitō-ryū Aiki-jūjutsu</em>, and uses supple, natural and highly effective movement to evade, redirect or neutralise an attack using the opponent's own force."
            - "Practice is demanding physical training built on repetition, keeping a balance between left and right and alternating between performing a technique and receiving it. Aikido is not only good for your health; it builds self-confidence that carries naturally into daily life."
            - "You can begin at any time, whatever your age or physical condition, men and women, adults and children alike."
          ja:
            - "合気道は、20世紀初頭に植芝盛平（1883–1969）が大成した、試合を行わない日本の武道です。日本の古流武術、とりわけ<em>大東流合気柔術</em>を土台とし、しなやかで自然な、しかも極めて有効な体さばきによって、相手の力を用いて攻撃をかわし、導き、無力化します。"
            - "稽古は反復を重ねる厳しい鍛錬です。左右の均衡を保ち、技をかける側と受ける側を交互に務めます。合気道は健康によいだけでなく、日常生活に自然につながる自信を育てます。"
            - "年齢や体力を問わず、男女を問わず、大人も子どもも、いつからでも始められます。"
      # What an hour actually looks like. The commonest question from someone
      # who has never done a martial art is not "what is aikido" but "what
      # will happen to me for sixty minutes".
      - heading: { es: "Una clase por dentro", ca: "Una classe per dins",
                   en: "A class from the inside", ja: "稽古の一時間" }
        body:
          es:
            - "Una hora, con la misma estructura casi siempre. Se empieza y se termina sentados, y en medio se repite mucho."
          ca:
            - "Una hora, amb la mateixa estructura gairebé sempre. Es comença i s'acaba asseguts, i al mig es repeteix molt."
          en:
            - "One hour, and almost always the same shape. It starts and ends seated, and in between there is a great deal of repetition."
          ja:
            - "一時間。流れはほぼ毎回同じです。座って始まり、座って終わり、その間はひたすら繰り返します。"
        steps:
          - es: "<b>Saludo.</b> En <em>seiza</em>, al frente del dojo y entre el instructor y el grupo."
            ca: "<b>Salutació.</b> En <em>seiza</em>, al front del dojo i entre l'instructor i el grup."
            en: "<b>The bow.</b> In <em>seiza</em>, to the front of the dojo and between the instructor and the group."
            ja: "<b>礼。</b>正座で、正面へ、そして指導者と全員とで。"
          - es: "<b>Calentamiento.</b> Movilidad de muñecas, hombros y caderas. Las muñecas se calientan mucho porque muchas técnicas trabajan sobre ellas."
            ca: "<b>Escalfament.</b> Mobilitat de canells, espatlles i malucs. Els canells s'escalfen molt perquè moltes tècniques hi treballen."
            en: "<b>Warm-up.</b> Wrists, shoulders and hips. The wrists get a lot of attention, because a lot of the techniques work on them."
            ja: "<b>準備運動。</b>手首、肩、腰をほぐします。手首を入念にするのは、多くの技が手首にかかるからです。"
          - es: "<b>Ukemi.</b> Caídas hacia atrás, hacia delante, rodando. Es la mitad del aikido y lo primero que aprende quien llega."
            ca: "<b>Ukemi.</b> Caigudes enrere, endavant, rodant. És la meitat de l'aikido i el primer que aprèn qui arriba."
            en: "<b>Ukemi.</b> Falling backwards, forwards, rolling. It is half of aikido and the first thing a newcomer learns."
            ja: "<b>受け身。</b>後ろ受け身、前受け身、前回り受け身。合気道の半分であり、入門して最初に習うものです。"
          - es: "<b>Técnica.</b> El instructor la muestra dos o tres veces y se practica por parejas, alternando quien la hace y quien la recibe, y cambiando de compañero varias veces."
            ca: "<b>Tècnica.</b> L'instructor la mostra dues o tres vegades i es practica per parelles, alternant qui la fa i qui la rep, i canviant de company diverses vegades."
            en: "<b>Technique.</b> The instructor shows it two or three times, then you work in pairs, swapping who does it and who receives it, and changing partner several times."
            ja: "<b>技。</b>指導者が二、三度示し、二人一組で稽古します。取りと受けを交代し、相手も何度か替えます。"
          - es: "<b>Kokyū hō.</b> Un ejercicio de respiración sentados, que cierra la sesión."
            ca: "<b>Kokyū hō.</b> Un exercici de respiració asseguts, que tanca la sessió."
            en: "<b>Kokyū hō.</b> A seated breathing exercise that closes the session."
            ja: "<b>呼吸法。</b>座って行う呼吸の稽古で締めくくります。"
          - es: "<b>Saludo y limpieza.</b> Cinco minutos entre todos."
            ca: "<b>Salutació i neteja.</b> Cinc minuts entre tots."
            en: "<b>Bow, then cleaning.</b> Five minutes, everybody."
            ja: "<b>礼、そして掃除。</b>全員で五分ほど。"

      - heading: { es: "Las armas", ca: "Les armes", en: "The weapons", ja: "武器の稽古" }
        body:
          es:
            - "Un arte que no compite estudia armas por una razón concreta: el aikido nace del trabajo con el sable, y muchos movimientos de mano vacía se entienden mejor cuando se han hecho antes con un <em>bokken</em> en las manos. Las tres son de madera y nunca se usan con filo."
          ca:
            - "Un art que no competeix estudia armes per una raó concreta: l'aikido neix del treball amb el sabre, i molts moviments de mà buida s'entenen millor quan abans s'han fet amb un <em>bokken</em> a les mans. Les tres són de fusta i mai no es fan servir amb tall."
          en:
            - "A non-competitive art studies weapons for a specific reason: aikido comes out of swordwork, and a lot of empty-hand movement makes more sense once you have done it holding a <em>bokken</em>. All three are wooden, and never bladed."
          ja:
            - "試合をしない武道が武器を学ぶのには理由があります。合気道は剣の理合いから生まれており、素手の動きの多くは、一度<em>木刀</em>を持って行ってみるとよくわかります。いずれも木製で、刃のあるものは使いません。"
        weapons:
          - k: 木刀
            r: bokken
            d:
              es: "El sable de madera. De él vienen los cortes <em>shōmen</em> y <em>yokomen</em>, que son la base de medio programa."
              ca: "El sabre de fusta. D'ell vénen els talls <em>shōmen</em> i <em>yokomen</em>, que són la base de mig programa."
              en: "The wooden sword. The <em>shōmen</em> and <em>yokomen</em> strikes come from it, and they are half the syllabus."
              ja: "木の刀。<em>正面打ち</em>と<em>横面打ち</em>はここから来ており、稽古の半分の土台になります。"
          - k: 杖
            r: jō
            d:
              es: "El bastón, de metro y pico. Enseña la distancia y el trabajo con las dos manos separadas."
              ca: "El bastó, de metre i escaig. Ensenya la distància i el treball amb les dues mans separades."
              en: "The staff, a little over a metre. It teaches distance, and working with the hands apart."
              ja: "一メートルあまりの杖。間合いと、両手を離して使う体の運びを学びます。"
          - k: 短刀
            r: tantō
            d:
              es: "El cuchillo. Se usa para las técnicas de desarme, siempre despacio y siempre con el compañero avisado."
              ca: "El ganivet. S'usa per a les tècniques de desarmament, sempre a poc a poc i sempre amb el company avisat."
              en: "The knife. Used for disarming techniques, always slowly and always with your partner warned."
              ja: "短刀。取り上げの稽古に用います。必ずゆっくり、必ず相手に断ってから。"
        more:
          - label: { es: "Cuándo es la clase de armas", ca: "Quan és la classe d'armes",
                     en: "When the weapons class is", ja: "武器稽古の曜日と時間" }
            url:   { es: "/horarios/", ca: "/ca/horaris/",
                     en: "/en/training-schedule/", ja: "/ja/training-schedule/" }

      - heading: { es: "Grados y exámenes", ca: "Graus i exàmens",
                   en: "Grades and examinations", ja: "段級と審査" }
        body:
          es:
            - "Los grados <em>kyu</em> los examina el dojo. Los grados <em>dan</em> se presentan y quedan registrados en la Aikikai Foundation de Tokio, que los reconoce internacionalmente a través de la International Aikido Federation."
            - "No hay una fecha fija para presentarse: se propone cuando el instructor considera que el trabajo está hecho. Cada examen tiene un programa concreto de ataques y técnicas, y un número mínimo de días de práctica desde el grado anterior. Antes de cada convocatoria hay clases de preparación abiertas a todo el que se vaya a examinar."
          ca:
            - "Els graus <em>kyu</em> els examina el dojo. Els graus <em>dan</em> es presenten i queden registrats a la Aikikai Foundation de Tòquio, que els reconeix internacionalment a través de la International Aikido Federation."
            - "No hi ha una data fixa per presentar-s'hi: es proposa quan l'instructor considera que la feina està feta. Cada examen té un programa concret d'atacs i tècniques, i un nombre mínim de dies de pràctica des del grau anterior. Abans de cada convocatòria hi ha classes de preparació obertes a tothom qui s'hagi d'examinar."
          en:
            - "<em>Kyu</em> grades are examined by the dojo. <em>Dan</em> grades are presented and registered with the Aikikai Foundation in Tokyo, which recognises them internationally through the International Aikido Federation."
            - "There is no fixed date for taking one: you are put forward when the instructor thinks the work is done. Each examination has a specific syllabus of attacks and techniques, and a minimum number of practice days since the previous grade. Preparation classes run before every session, open to anyone who is going to be examined."
          ja:
            - "<em>級</em>の審査は道場で行います。<em>段</em>は東京の財団法人合気会に登録され、国際合気道連盟を通じて国際的に認められます。"
            - "受審の日取りは決まっていません。稽古が仕上がったと指導者が判断したときに推薦されます。審査ごとに攻撃と技の内容が定められており、前の級・段からの最低稽古日数もあります。審査の前には、受ける人なら誰でも参加できる準備稽古があります。"

      - heading: { es: "Una historia breve", ca: "Una història breu",
                   en: "A short history", ja: "簡単な歴史" }
        body:
          es:
            - "Morihei Ueshiba nace en Tanabe en 1883 y estudia varias escuelas tradicionales antes de encontrar el <em>Daitō-ryū Aiki-jūjutsu</em> de Sokaku Takeda, que sería la base técnica de lo que vino después. En los años treinta abre en Tokio el dojo que acabaría llamándose Aikikai Hombu Dojo, y va desplazando el arte desde la eficacia marcial pura hacia la idea que le da nombre: unirse a la fuerza del otro en lugar de chocar con ella."
            - "Tras la Segunda Guerra Mundial, y con la ocupación levantando la prohibición sobre las artes marciales, sus alumnos empiezan a enseñar fuera de Japón. Llega a Europa en los años cincuenta y sesenta, y a España en los setenta. Hoy la Aikikai Foundation, dirigida por el nieto del fundador, coordina el reconocimiento de grados en todo el mundo a través de la International Aikido Federation."
          ca:
            - "Morihei Ueshiba neix a Tanabe el 1883 i estudia diverses escoles tradicionals abans de trobar el <em>Daitō-ryū Aiki-jūjutsu</em> de Sokaku Takeda, que seria la base tècnica del que vindria després. Als anys trenta obre a Tòquio el dojo que acabaria dient-se Aikikai Hombu Dojo, i va desplaçant l'art des de l'eficàcia marcial pura cap a la idea que li dóna nom: unir-se a la força de l'altre en lloc de xocar-hi."
            - "Després de la Segona Guerra Mundial, i amb l'ocupació aixecant la prohibició sobre les arts marcials, els seus alumnes comencen a ensenyar fora del Japó. Arriba a Europa als anys cinquanta i seixanta, i a Espanya als setanta. Avui l'Aikikai Foundation, dirigida pel nét del fundador, coordina el reconeixement de graus arreu del món a través de la International Aikido Federation."
          en:
            - "Morihei Ueshiba was born in Tanabe in 1883 and studied several traditional schools before meeting Sokaku Takeda's <em>Daitō-ryū Aiki-jūjutsu</em>, which became the technical basis of everything that followed. In the 1930s he opened the Tokyo dojo that would come to be called the Aikikai Hombu Dojo, and gradually moved the art away from pure martial efficiency towards the idea that gives it its name: joining the other person's force rather than colliding with it."
            - "After the Second World War, once the occupation lifted the ban on martial arts, his students began teaching outside Japan. It reached Europe in the 1950s and 60s and Spain in the 70s. Today the Aikikai Foundation, headed by the founder's grandson, coordinates the recognition of grades worldwide through the International Aikido Federation."
          ja:
            - "植芝盛平は1883年に田辺に生まれ、いくつかの古流を学んだのち、武田惣角の<em>大東流合気柔術</em>に出会います。これがのちの技術的な土台となりました。1930年代には東京に道場を開き、それがのちの合気会本部道場となります。この時期を通じて、武術としての効きから、名の由来である「相手の力とぶつからず合わせる」という考えへと重心を移していきました。"
            - "第二次世界大戦後、占領下で武道の禁止が解かれると、門人たちが日本の外で教え始めます。ヨーロッパには1950〜60年代に、スペインには1970年代に伝わりました。現在は開祖の孫が率いる（財）合気会が、国際合気道連盟を通じて世界各地の段位の認定をとりまとめています。"

