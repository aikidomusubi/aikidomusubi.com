  - id: association
    image: index-8oGCaMDs-11
    slug: { es: "la-asociacion", ca: "l-associacio", en: "the-association", ja: "the-association" }
    title: { es: "La asociación", ca: "L'associació", en: "The association", ja: "協会について" }
    lede:
      es: "Quiénes somos, cómo nos organizamos y con quién estamos afiliados."
      ca: "Qui som, com ens organitzem i amb qui estem afiliats."
      en: "Who we are, how we are organised, and who we are affiliated with."
      ja: "私たちの成り立ち、運営のかたち、そして所属について。"
    blocks:
      - heading: { es: "La asociación", ca: "L'associació", en: "The association", ja: "協会" }
        body:
          es:
            - "<strong>Aikido Musubi</strong> (CIF: G-64799554) es una asociación cultural fundada en 2008. Es la primera asociación en Barcelona autogestionada y sin ánimo de lucro cuyo objetivo es promover la práctica del aikido y los valores de las artes marciales tradicionales de Japón. Desde entonces somos un actor principal en el área metropolitana de Barcelona ofreciendo un espacio 100 % dedicado a las artes marciales y la cultura japonesa."
            - "<strong>Aikido Musubi</strong> no aboga, apoya ni practica la discriminación ilegal basada en la edad, el origen étnico, el género, el origen nacional, la discapacidad, la raza, la religión, la orientación sexual o los antecedentes socioeconómicos."
          ca:
            - "<strong>Aikido Musubi</strong> (CIF: G-64799554) és una associació cultural fundada el 2008. És la primera associació de Barcelona autogestionada i sense ànim de lucre amb l'objectiu de promoure la pràctica de l'aikido i els valors de les arts marcials tradicionals del Japó. Des de llavors som un actor principal a l'àrea metropolitana de Barcelona oferint un espai 100 % dedicat a les arts marcials i la cultura japonesa."
            - "<strong>Aikido Musubi</strong> no defensa, dóna suport ni practica la discriminació il·legal basada en l'edat, l'origen ètnic, el gènere, l'origen nacional, la discapacitat, la raça, la religió, l'orientació sexual o els antecedents socioeconòmics."
          en:
            - "<strong>Aikido Musubi</strong> (tax ID G-64799554) is a cultural association founded in 2008. It was the first self-managed, non-profit association in Barcelona set up to promote the practice of aikido and the values of Japan's traditional martial arts. Since then we have been a significant presence in the Barcelona metropolitan area, offering a space given over entirely to martial arts and Japanese culture."
            - "<strong>Aikido Musubi</strong> does not advocate, support or practise unlawful discrimination on the basis of age, ethnicity, gender, national origin, disability, race, religion, sexual orientation or socioeconomic background."
          ja:
            - "<strong>合気道産靈</strong>（登録番号 G-64799554）は2008年に設立された文化協会です。合気道の稽古と日本の伝統武道の価値を広めることを目的とした、バルセロナで最初の自主運営・非営利の団体です。以来、武道と日本文化のためだけの場を提供し、バルセロナ都市圏で中心的な役割を担ってきました。"
            - "<strong>合気道産靈</strong>は、年齢、民族的出自、性別、国籍、障害、人種、宗教、性的指向、社会経済的背景に基づく違法な差別を、支持も容認も実践もしません。"
        facts:
          - { label: { es: "Denominación", ca: "Denominació", en: "Registered name", ja: "名称" },
              value: { es: "Asociación Cultural Musubi Aikido", ca: "Associació Cultural Musubi Aikido",
                       en: "Asociación Cultural Musubi Aikido", ja: "産靈合気道文化協会" } }
          - { label: { es: "CIF", ca: "CIF", en: "Tax ID", ja: "登録番号" },
              value: { es: "G-64799554", ca: "G-64799554", en: "G-64799554", ja: "G-64799554" } }
          - { label: { es: "Fundación", ca: "Fundació", en: "Founded", ja: "設立" },
              value: { es: "2008, Badalona", ca: "2008, Badalona", en: "2008, Badalona", ja: "2008年・バダロナ" } }
          - { label: { es: "Afiliación", ca: "Afiliació", en: "Affiliation", ja: "所属" },
              value: { es: "Aikido Arashi Group, Aikikai Foundation (Hombu Dojo, Tokio)",
                       ca: "Aikido Arashi Group, Aikikai Foundation (Hombu Dojo, Tòquio)",
                       en: "Aikido Arashi Group, Aikikai Foundation (Hombu Dojo, Tokyo)",
                       ja: "嵐グループ、（財）合気会 本部道場（東京）" } }
      - heading: { es: "Desde 2008", ca: "Des del 2008", en: "Since 2008", ja: "2008年から" }
        body:
          es:
            - "Empezamos con un tatami en Badalona y desde entonces no hemos parado ningún curso. Por el camino se abrieron las clases de Sant Adrià de Besòs y las de la Facultad de Derecho de la Universidad de Barcelona, salieron los primeros grados dan de la casa, y el dojo pasó de recibir maestros de vez en cuando a traer varios seminarios cada año."
            - "No llevamos la cuenta con solemnidad, pero sí la llevamos: el archivo y el registro de seminarios están en Ura, y arranca en 2020. Es una historia mejor contada en fotos que en fechas."
          ca:
            - "Vam començar amb un tatami a Badalona i des de llavors no hem aturat cap curs. Pel camí es van obrir les classes de Sant Adrià de Besòs i les de la Facultat de Dret de la Universitat de Barcelona, van sortir els primers graus dan de la casa, i el dojo va passar de rebre mestres de tant en tant a portar diversos seminaris cada any."
            - "No en portem el compte amb solemnitat, però el portem: l'arxiu i el registre de seminaris són a Ura, i arrenca el 2020. És una història més ben explicada en fotos que en dates."
          en:
            - "We started with one mat in Badalona and have not missed a season since. Along the way the Sant Adrià de Besòs classes opened, and the ones at the Faculty of Law of the University of Barcelona; the first dan grades came out of the dojo; and we went from hosting a visiting teacher now and then to running several seminars a year."
            - "We do not keep the count solemnly, but we do keep it: the archive and the seminar log live in Ura, and the log starts in 2020. It is a story better told in photographs than in dates."
          ja:
            - "バダロナの一枚の畳から始まり、以来ひと年も稽古を絶やしていません。その間にサント・アドリアー・ダ・バゾスの稽古と、バルセロナ大学法学部の稽古が始まり、道場から最初の有段者が出て、たまに講師を招く道場から、年に何度も講習会を開く道場になりました。"
            - "大げさに数えてはいませんが、記録は残しています。写真の記録と講習会の記録は「裏」にあり、講習会の記録は2020年から始まります。日付より写真のほうがよく伝わる歴史です。"
        more:
          - label: { es: "El archivo, en Ura", ca: "L'arxiu, a Ura",
                     en: "The archive, in Ura", ja: "「裏」の記録" }
            url:   { es: "/ura/#ura-archive", ca: "/ca/ura/#ura-archive",
                     en: "/en/ura/#ura-archive", ja: "/ja/ura/#ura-archive" }
          - label: { es: "El registro de seminarios", ca: "El registre de seminaris",
                     en: "The seminar log", ja: "講習会の記録" }
            url:   { es: "/ura/#ura-seminars", ca: "/ca/ura/#ura-seminars",
                     en: "/en/ura/#ura-seminars", ja: "/ja/ura/#ura-seminars" }

      - heading: { es: "Cómo funciona", ca: "Com funciona", en: "How it works", ja: "運営のしくみ" }
        body:
          es:
            - "La Junta Directiva está constituida por la Presidencia, la Secretaría y la Tesorería, que a su vez asumen el rol de dirección técnica e instrucción respectivamente. Son miembros fundadores activos con experiencia significativa dentro de la asociación que han sido elegidos por la Asamblea General, compuesta por todos los miembros de la asociación."
            - "La Asamblea se reúne una vez al año, aprueba las cuentas y decide lo que hay que decidir. Cualquier miembro puede asistir, hablar y votar. <strong>Nadie cobra por enseñar</strong>: las cuotas cubren el alquiler del espacio, el mantenimiento del tatami, los seguros, las licencias federativas y los seminarios que traemos. Lo que sobra se queda en el dojo."
            - "Los estatutos y las cuentas están a disposición de cualquier miembro que los pida."
          ca:
            - "La Junta Directiva està constituïda per la Presidència, la Secretaria i la Tresoreria, que alhora assumeixen el rol de direcció tècnica i instrucció respectivament. Són membres fundadors actius amb experiència significativa dins de l'associació, escollits per l'Assemblea General, formada per tots els membres."
            - "L'Assemblea es reuneix un cop l'any, aprova els comptes i decideix el que s'hagi de decidir. Qualsevol membre hi pot assistir, parlar i votar. <strong>Ningú cobra per ensenyar</strong>: les quotes cobreixen el lloguer de l'espai, el manteniment del tatami, les assegurances, les llicències federatives i els seminaris que portem. El que sobra es queda al dojo."
            - "Els estatuts i els comptes estan a disposició de qualsevol membre que els demani."
          en:
            - "The board is made up of the President, the Secretary and the Treasurer, who also serve as technical director and instructors. They are active founding members with substantial experience in the association, elected by the General Assembly, which is made up of all its members."
            - "The Assembly meets once a year, approves the accounts and decides whatever needs deciding. Any member may attend, speak and vote. <strong>Nobody is paid to teach</strong>: the fees cover the rent, the upkeep of the mat, insurance, federation licences and the seminars we bring in. What is left stays in the dojo."
            - "The statutes and the accounts are available to any member who asks for them."
          ja:
            - "理事会は会長・書記・会計で構成され、それぞれ指導部長および指導者を兼ねます。いずれも協会内で長い経験を持つ現役の創設メンバーであり、全会員からなる総会によって選出されます。"
            - "総会は年に一度開かれ、会計を承認し、決めるべきことを決めます。会員は誰でも出席し、発言し、投票できます。<strong>指導に報酬は出ません。</strong>会費は場所の賃料、畳の維持、保険、連盟登録、そして招く講習会にあてられ、残りは道場に留まります。"
            - "定款と会計は、求める会員にはいつでも開示します。"

