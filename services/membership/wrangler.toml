# Membership signup and fee collection: the Worker behind api.aikidomusubi.com.
#
# Nothing here is secret. The secrets (Stripe key, webhook signing secret, the
# two signing keys, the Brevo key) are set with `wrangler secret put` and live
# only in Cloudflare; see docs/membership/SETUP.md. Locally they go in
# .dev.vars, which is gitignored.
#
# `npm run deploy` deploys the TEST environment by default ([env.test] below is
# not used: the top level IS test). Live is `wrangler deploy --env live`, and
# only after Juanma has said so.

name = "membership-test"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Daily at 08:00 UTC. The day of the month decides what runs: see src/cron.ts.
[triggers]
crons = ["0 8 * * *"]

[vars]
ENVIRONMENT = "test"
# Test mode runs against the site on your own machine (`bin/dev start`), so the
# page that posts here, and the thank-you page Stripe returns to, are local.
SITE_ORIGIN = "http://localhost:4000"
# This test Worker's own address, printed by the first `npm run deploy`
# (https://membership-test.<your-subdomain>.workers.dev). The buttons in the
# admin emails point here.
API_ORIGIN = "https://membership-test.aikidomusubi.workers.dev"
ADMIN_EMAIL = "admin@aikidomusubi.com"
FROM_EMAIL = "no-reply@aikidomusubi.com"
REPLY_TO = "info@aikidomusubi.com"
# Spec section 16, as configuration with the decided defaults.
PUBLIC_PRORATION = "create_prorations"
RENEWAL_NOTICE_MONTHLY = "true"
AUTO_AGE_UPGRADE = "false"
MEMBER_FAILED_EMAIL_SEPA = "true"
# The list of who to leave out of the bank remittance, on the 1st of each
# month while existing members move over. Switch off once nobody is left.
MIGRATION_REMITTANCE_LIST = "true"
# The dojo's back office at /panel/. Only these addresses can sign in (a
# six-digit code by email, no password); after the colon, the name it greets
# them by. The dojo's own mailboxes, never a personal one: this file is public.
PANEL_USERS = "admin@aikidomusubi.com:Alberto,info@aikidomusubi.com"
# EMAIL_OVERRIDE (send every test email to one address) and TEST_CLOCK (a
# Stripe test clock id) are test-mode only and set with `wrangler secret put`,
# NOT here: Cloudflare refuses a secret whose name is also a var, and this file
# is public, so a personal address must not be written in it.

[[kv_namespaces]]
binding = "KV"
id = "1c3d9420d3a641ceba848d1ff5e99479"

# Ten posts a minute per IP on /checkout and /withdrawal. Counted in memory by
# Cloudflare, so it costs no KV writes. namespace_id is any number unique in
# the account.
[[ratelimits]]
name = "RL_FORMS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[env.live]
name = "membership"
routes = [{ pattern = "api.aikidomusubi.com", custom_domain = true }]
[env.live.vars]
ENVIRONMENT = "live"
SITE_ORIGIN = "https://aikidomusubi.com"
API_ORIGIN = "https://api.aikidomusubi.com"
ADMIN_EMAIL = "admin@aikidomusubi.com"
FROM_EMAIL = "no-reply@aikidomusubi.com"
REPLY_TO = "info@aikidomusubi.com"
PUBLIC_PRORATION = "create_prorations"
RENEWAL_NOTICE_MONTHLY = "true"
AUTO_AGE_UPGRADE = "false"
MEMBER_FAILED_EMAIL_SEPA = "true"
MIGRATION_REMITTANCE_LIST = "true"
PANEL_USERS = "admin@aikidomusubi.com:Alberto,info@aikidomusubi.com"
[[env.live.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_LIVE_KV_ID"
[env.live.triggers]
crons = ["0 8 * * *"]
[[env.live.ratelimits]]
name = "RL_FORMS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
