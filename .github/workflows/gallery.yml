# Collect new Instagram posts and Facebook albums into the gallery.
#
# Runs on its own overnight and commits what it finds. Nothing it commits is
# visible on the site: every entry lands with `show: false`, so publishing stays
# a decision a person makes. Flip the ones worth keeping in _data/gallery.yml
# and delete the rest.
#
# On the Page route the token does not expire and there is nothing to renew. On
# the fallback Instagram-login route the token lasts about 60 days, and if it is
# inside ten days of expiry the run fails loudly and opens an issue — the
# failure worth avoiding is the page quietly stopping in March and nobody
# noticing until June.
name: Gallery

on:
  schedule:
    - cron: "17 3 * * *"      # 03:17 UTC, nightly. Off the hour on purpose:
                              # GitHub's scheduler is busiest on the hour.
  workflow_dispatch:          # and a "Run workflow" button for when you post
                              # something you want up straight away

permissions:
  contents: write             # to commit the new entries and thumbnails
  issues: write               # to tell you when the token needs renewing

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests pillow

      - name: Fetch
        id: fetch
        env:
          # The Page route needs FB_TOKEN + IG_USER_ID and does not expire.
          # IG_TOKEN is the fallback for the direct Instagram-login route.
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/fetch-social.py --tags training

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain _data/gallery.yml images/)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/gallery.yml images/
          git commit -m "Collect new gallery items (pending approval)"
          git push

      # Only when the fetch step failed, which it does on an expiring token.
      - name: Open an issue if the token needs attention
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Gallery: the Instagram token needs renewing';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'gallery-token'
            });
            if (open.data.length) return;          // one is enough
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['gallery-token'],
              body: [
                'The nightly gallery job could not complete.',
                '',
                'The usual cause is the Instagram long-lived token nearing or past',
                'its 60-day expiry. Generate a new one and update the `IG_TOKEN`',
                'secret: Settings → Secrets and variables → Actions.',
                '',
                'Steps are in `docs/meta-setup.md`.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });
