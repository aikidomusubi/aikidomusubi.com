<ul>
  {% assign num = page.photos.size %}
    {% for i in (1..num) %}
      <li>
        <picture>
          <source type="image/webp" srcset="/photos/{{ page.photos.album }}/{{ page.photos.album }}-{{ i }}.webp">
          <source type="image/jpeg" srcset="/photos/{{ page.photos.album }}/{{ page.photos.album }}-{{ i }}.jpg">
          <img src="{{ site.baseurl }}/photos/{{ page.photos.album }}/{{ page.photos.album }}-{{ i }}.jpg" class="img-fluid" loading="lazy" alt="Photo {{ i }} from {{ page.title }}">
        </picture>
      </li>
    {% endfor %}
</ul>
