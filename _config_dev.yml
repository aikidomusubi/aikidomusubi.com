# Development-only overrides. Layered on top of _config.yml:
#
#   bundle exec jekyll serve --config _config.yml,_config_dev.yml
#
# Templates build asset URLs from {{ site.url }}, which in production must be
# the absolute canonical host (canonical tags, og:url, hreflang and the
# sitemap all depend on it). Without this override a locally served page
# pulls its CSS, JS and images from the live site, so local changes to those
# assets are invisible no matter how many times you rebuild.
#
# Never reference this file from _config.yml — GitHub Pages builds with
# _config.yml alone, which is exactly what we want it to use.
url: "http://localhost:4000"
