# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Aikido Musubi
email: info@aikidomusubi.com
phone: 34717171177
description: >-
  Aikido Musubi is a self-managed, non-profit cultural association that promotes aikido in Badalona, Barcelona.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aikidomusubi.com" # the base hostname & protocol for your site, e.g. http://example.com
github:
  repo:  https://github.com/aikidomusubi/aikidomusubi.com
timezone: Europe/Madrid

facebook_username: aikidomusubibadalona
github_username: aikidomusubi
instagram_username: aikidomusubi
twitter_username: aikidomusubibdn
youtube_username: musubiaikidobdn

# Build settings
markdown: kramdown

kramdown:
  auto_ids: false

# permalink: /:title-:short_year:month:day

plugins:
  - jekyll-feed
  - jekyll-redirect-from

collections:
  events:
    output: false
    layout: "event"
  photos:
    output: true
    layout: "photo"
  videos:
    output: false
    layout: "video"

defaults:
  - scope:
      path: "photos"
      type: "photos"
    values:
      image: true

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# Only two asset files are actually served: styles/all.min.css and
# scripts/all.min.js. Everything Gulp consumes to build them is excluded
# here, as are the build/tooling files. glightbox.* is deliberately NOT
# excluded — the courses page loads it directly rather than via the bundle.
# Which training-schedule renderer to use.
#
#   native       build-time timetable from _data/schedule.yml (no dependency)
#   fullcalendar the previous FullCalendar 4.3.1 implementation
#
# Both are present so they can be compared side by side. Flip this to roll
# back; nothing in plugins/fullcalendar-4.3.1/, _includes/fullcalendar.html or
# the training-schedule-*.json files has been removed.
schedule_engine: native

exclude:
  # Gulp inputs, bundled into all.min.js / all.min.css
  - scripts/default.js
  - scripts/schedule.js
  - scripts/calendar.js
  - scripts/bootstrap.bundle.min.js
  - scripts/bootstrap.bundle.min.js.map
  - styles/base.less
  - styles/default.less
  - styles/schedule.less
  - styles/calendar.less
  - styles/bootstrap.min.css
  - styles/bootstrap.min.css.map
  # Unminified build output, kept locally for debugging only
  - scripts/all.js
  # Tooling and repo files
  - _includes/cssrelpreload.js
  - assets/
  - node_modules/
  # Font subsetter and its ~2.5 MB of unsubset source faces. Inputs only —
  # what ships is the subset output in /fonts/.
  - tools/
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - package-lock.json
  - package.json
  - ".well-known"
  - CLAUDE.md

include:
  - sitemap.xml
