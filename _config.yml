# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Aikido Musubi
email: info@aikidomusubi.com
phone: 34717171177
description: >-
  Aikido Musubi is a self-managed, non-profit cultural association that promotes aikido in Badalona, Barcelona.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aikidomusubi.com" # the base hostname & protocol for your site, e.g. http://example.com
github:
  repo:  https://github.com/aikidomusubi/aikidomusubi.com
timezone: Europe/Madrid

facebook_username: aikidomusubibadalona
github_username: aikidomusubi
instagram_username: aikidomusubi
twitter_username: aikidomusubibdn
youtube_username: musubiaikidobdn

# Build settings
markdown: kramdown

kramdown:
  auto_ids: false

# permalink: /:title-:short_year:month:day

plugins:
  - jekyll-feed
  - jekyll-redirect-from

collections:
  events:
    output: false
    layout: "event"
  elsewhere:
    output: false
    layout: "elsewhere"
  videos:
    output: false
    layout: "video"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# What ships is the built bundles: styles/all.min.css, scripts/all.min.js and
# the per-page ones beside them. Everything Gulp consumes to build them is
# excluded here, as are the build/tooling files. glightbox.* is deliberately
# NOT excluded — the Seminars page loads it on the first poster click rather
# than through the bundle.

exclude:
  - docs

  # Working files. `temp/` held the two source posters for the July masterclass
  # and the UB course — 8 MB of print-resolution PNG, copied straight into
  # _site and bound for production, because Jekyll publishes any directory it
  # is not told to skip. `check-assets` did not catch it: it looks for .less
  # and unminified .js, not for stray source images.
  - temp

  # GULP INPUTS — never served.
  #
  # This was a hand-written list of every source file, and it drifted: every
  # stylesheet and script added after it was written kept leaking into _site.
  # At the last count that was 65 KB of .less and unminified .js deployed to
  # production. Globs instead of names, so a new source file is covered the
  # moment it is created. `npx gulp build` fails if anything slips through —
  # see `check-assets` in gulpfile.js.
  - "styles/*.less"
  - "styles/bootstrap.min.css"
  - "styles/bootstrap.min.css.map"
  #
  # The scripts are still named one by one, and it still drifts: glossary.js
  # shipped to _site on its first build. `exclude: "scripts/*.js"` plus
  # `include: "scripts/*.min.js"` does NOT work — Jekyll's include? does not
  # rescue a glob-excluded file, and the result is a site with no scripts at
  # all, which `check-assets` now also refuses to let past. The real fix is to
  # move the sources under scripts/src/ so one glob covers them for good.
  - "scripts/default.js"
  - "scripts/schedule.js"
  - "scripts/calendar.js"
  - "scripts/fees.js"
  - "scripts/gallery.js"
  - "scripts/press.js"
  - "scripts/seminars.js"
  - "scripts/nav.js"
  - "scripts/ura.js"
  - "scripts/notfound.js"
  - "scripts/glossary.js"
  - "scripts/resources.js"

  # Tooling and repo files
  - _includes/cssrelpreload.js
  - assets/
  - node_modules/
  # Font subsetter and its ~2.5 MB of unsubset source faces. Inputs only —
  # what ships is the subset output in /fonts/.
  - tools/
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - package-lock.json
  - package.json
  - ".well-known"
  - CLAUDE.md

include:
  - sitemap.xml
