<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · Ukemi de kaiju</title>
<link rel="stylesheet" href="/styles/all.min.css">
<style>
:root{--ink:#111314;--mute:#5c6a70;--line:rgba(17,19,20,.13)}
html,body{margin:0;background:#FFF200;color:var(--ink);overflow:hidden;
  font-family:'Noto Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2{font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:400;margin:0;letter-spacing:.04em}
p{margin:0}
.fu{font-family:Futura,'Trebuchet MS',Arial,sans-serif}

.stage{position:relative;height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  user-select:none;touch-action:manipulation}
.mat{position:absolute;left:0;right:0;bottom:0;height:34vh;background:#111314;z-index:1}
.mat::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:84px 84px}

/* ── head ──────────────────────────────────────────────────────────────── */
.head{position:relative;z-index:6;padding:3.4rem 6rem 0;text-align:center}
@media(max-width:767.98px){.head{padding:2rem 1.4rem 0}}
.kicker{font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:.64rem;letter-spacing:.3em;
  text-transform:uppercase;color:#4a4300;margin-bottom:.9rem}
.num{font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:clamp(4rem,13vw,9rem);
  line-height:.85;color:#111314}
.lede{margin:1.1rem auto 0;max-width:34rem;font-size:1.02rem;line-height:1.65;color:#2c2800}

/* ── the field of play ─────────────────────────────────────────────────── */
.field{position:relative;z-index:4;min-height:0}
.zone{position:absolute;left:50%;bottom:9vh;width:clamp(120px,17vw,210px);height:clamp(120px,17vw,210px);
  transform:translate(-50%,50%);border:1px dashed rgba(17,19,20,.35);border-radius:50%;
  pointer-events:none;z-index:3}
.zone::after{content:'MA-AI';position:absolute;left:50%;top:-1.5rem;transform:translateX(-50%);
  font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:.54rem;letter-spacing:.24em;
  color:#4a4300}

.kaiju{position:absolute;bottom:8vh;left:0;width:clamp(74px,9vw,116px);z-index:5;
  transform-origin:50% 88%;will-change:transform,left}
.kaiju svg{width:100%;height:auto;display:block;overflow:visible}
.kaiju .body{fill:#111314}
.kaiju .eye{fill:#FFF200}
.kaiju.flip{transform:scaleX(-1)}
.walk{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-1.6deg)}to{transform:translateY(-7%) rotate(1.6deg)}}

.ring{position:absolute;bottom:8vh;left:0;width:0;height:0;z-index:4;pointer-events:none;
  border:2px solid #111314;border-radius:50%;transform:translate(-50%,50%);opacity:.5}

.thrown{transition:transform .9s cubic-bezier(.3,.9,.3,1),left .9s cubic-bezier(.3,.9,.3,1),
  bottom .9s cubic-bezier(.34,1.25,.4,1),opacity .35s .55s linear;opacity:0 !important}
.boom{position:absolute;z-index:3;width:10px;height:10px;border-radius:50%;border:3px solid #FFF200;
  transform:translate(-50%,50%);opacity:0;pointer-events:none}
.boom.go{animation:boom .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes boom{0%{opacity:.95;width:10px;height:10px}
  100%{opacity:0;width:900px;height:900px}}

/* ── hud ───────────────────────────────────────────────────────────────── */
.hud{position:absolute;top:1.4rem;right:1.6rem;z-index:7;text-align:right;
  font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:.56rem;letter-spacing:.16em;
  text-transform:uppercase;color:#4a4300}
.hud b{display:block;font-size:1.7rem;color:#111314;line-height:1;margin:.25rem 0 .8rem}
.call{position:absolute;left:50%;bottom:26vh;transform:translateX(-50%);z-index:7;
  font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:1.15rem;letter-spacing:.16em;
  text-transform:uppercase;opacity:0;white-space:nowrap}
.call.on{animation:call .9s ease-out forwards}
@keyframes call{0%{opacity:0;transform:translate(-50%,10px)}
  25%{opacity:1;transform:translate(-50%,-4px)}100%{opacity:0;transform:translate(-50%,-26px)}}
.call.good{color:#111314}.call.bad{color:#8a1f1a}

.hint{position:relative;z-index:7;text-align:center;padding:0 1.4rem 1.6rem;
  font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:.58rem;letter-spacing:.18em;
  text-transform:uppercase;color:#fff}
.hint b{color:#FFF200;font-weight:400}
.acts{position:relative;z-index:7;padding:0 6rem 2.2rem;display:flex;gap:1.6rem;
  justify-content:center;flex-wrap:wrap}
@media(max-width:767.98px){.acts{padding:0 1.4rem 1.6rem;gap:1.1rem}}
.acts a{font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-size:.64rem;letter-spacing:.15em;
  text-transform:uppercase;color:#fff;text-decoration:none;border-bottom:2px solid #FFF200;
  padding-bottom:.22rem}
.acts a:hover{border-bottom-color:#fff}
@media(prefers-reduced-motion:reduce){.walk{animation:none}.thrown{transition:none}
  .boom.go{animation:none}}
</style></head>
<body>
<div class="stage" id="stage" role="button" tabindex="0"
     aria-label="Proyectar al kaijū cuando entre en la distancia correcta">
  <div class="mat" aria-hidden="true"></div>

  <div class="head">
    <p class="kicker">Error 404</p>
    <h1 class="num">404</h1>
    <p class="lede">Godzilla tampoco encontró esta página. Lo que sí encontró fue un
       <em>kote gaeshi</em>.</p>
  </div>

  <div class="field" id="field">
    <div class="zone" aria-hidden="true"></div>
    <span class="ring" id="ring" aria-hidden="true"></span>
    <span class="boom" id="boom" aria-hidden="true"></span>
    <div class="kaiju walk" id="kaiju" aria-hidden="true">
      <!-- Kaijū genérico, dibujado aquí mismo. No es un recorte de nadie. -->
      <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
        <g class="body">
          <!-- cola -->
          <path d="M52 76 C34 88 18 98 3 92 C10 102 34 104 55 92 Z"/>
          <!-- patas -->
          <path d="M56 78 L50 106 L40 111 L62 111 L66 80 Z"/>
          <path d="M74 78 L70 106 L60 111 L84 111 L86 80 Z"/>
          <!-- torso -->
          <ellipse cx="70" cy="60" rx="23" ry="29" transform="rotate(-9 70 60)"/>
          <!-- brazos -->
          <path d="M82 52 L100 60 L97 68 L79 62 Z"/>
          <path d="M78 60 L94 70 L91 77 L75 69 Z"/>
          <!-- cuello y cabeza -->
          <path d="M76 40 L92 22 L104 26 L88 46 Z"/>
          <path d="M88 18 C104 14 124 20 128 30 C130 37 120 41 108 40 L88 38 Z"/>
          <!-- mandíbula -->
          <path d="M104 38 C116 39 126 36 128 32 C127 42 112 47 100 44 Z"/>
          <!-- placas dorsales -->
          <path d="M56 40 L48 30 L46 44 Z"/><path d="M50 52 L38 44 L40 58 Z"/>
          <path d="M48 64 L34 60 L38 73 Z"/><path d="M50 76 L36 78 L44 87 Z"/>
          <path d="M64 30 L60 18 L72 26 Z"/>
        </g>
        <circle class="eye" cx="112" cy="28" r="3.2"/>
      </svg>
    </div>
    <p class="call" id="call" aria-live="polite"></p>
  </div>

  <p class="hud" aria-live="polite">Seguidas<b id="streak">0</b>Mejor<b id="best">0</b></p>

  <p class="hint">Proyéctalo cuando entre en el círculo. <b>Clic, toque o barra espaciadora</b></p>
  <div class="acts">
    <a href="/">Volver a la portada</a>
    <a href="/clases/">Aprender a caer</a>
    <a href="/contacto/">Escribirnos</a>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'), field=document.getElementById('field'),
      k=document.getElementById('kaiju'), ring=document.getElementById('ring'),
      boom=document.getElementById('boom'), call=document.getElementById('call'),
      elS=document.getElementById('streak'), elB=document.getElementById('best'),
      reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0, mid=0, zone=0, x=0, dir=1, speed=0, live=false, streak=0, best=0, raf=0;

  function measure(){
    W=field.clientWidth; mid=W/2;
    zone=Math.min(Math.max(W*0.085,60),105);   // half-width of the ma-ai ring
  }
  function place(){
    k.style.left=x+'px';
    var d=Math.abs(x-mid), r=Math.max(d*2,10);
    ring.style.width=r+'px'; ring.style.height=r+'px'; ring.style.left=mid+'px';
    ring.style.opacity=String(Math.max(.12,.6-d/W));
  }
  function spawn(){
    measure();
    dir = Math.random()<.5 ? 1 : -1;
    x = dir>0 ? -90 : W+90;
    speed = (2.0 + Math.min(streak,9)*0.34) * dir;   // it gets faster as you improve
    k.className='kaiju walk'+(dir<0?' flip':'');
    k.style.opacity=''; k.style.bottom=''; k.style.transform='';
    live=true; place(); loop();
  }
  function loop(){
    if(!live) return;
    x+=speed; place();
    if((dir>0 && x>W+120)||(dir<0 && x<-120)){ live=false; say('Se fue','bad'); reset(); return; }
    raf=requestAnimationFrame(loop);
  }
  function say(t,cls){ call.textContent=t; call.className='call on '+cls;
    setTimeout(function(){ call.className='call '+cls; },900); }
  function reset(){ streak=0; elS.textContent=0; setTimeout(spawn,700); }

  function strike(){
    if(!live) return;
    live=false; cancelAnimationFrame(raf);
    var d=Math.abs(x-mid);
    if(d<=zone){
      streak++; best=Math.max(best,streak);
      elS.textContent=streak; elB.textContent=best;
      say(d<=zone*0.45?'¡Ma-ai!':'Ukemi','good');
      boom.style.left=x+'px'; boom.className='boom'; void boom.offsetWidth; boom.className='boom go';
      k.classList.remove('walk'); k.classList.add('thrown');
      k.style.transform=(dir<0?'scaleX(-1) ':'')+'rotate(206deg) scale(.8)';
      k.style.left=(x+dir*230)+'px'; k.style.bottom='22vh';
      setTimeout(spawn,1150);
    } else {
      say(d>zone*2.4?'Muy pronto':'Muy tarde','bad');
      streak=0; elS.textContent=0;
      setTimeout(function(){ live=true; loop(); },380);
    }
  }
  stage.addEventListener('pointerdown',function(e){ if(!e.target.closest('a')) strike(); });
  stage.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); strike(); } });
  addEventListener('resize',measure);
  if(reduce){ measure(); x=mid; place(); k.classList.remove('walk'); }
  else setTimeout(spawn,500);
})();
</script>
</body></html>
