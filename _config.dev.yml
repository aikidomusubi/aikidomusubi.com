# Layered over _config.yml by `bin/dev start`, and by nothing else.
#
# KEEP THE RENDERED MOCKUPS THROUGH A REBUILD. docs/mockups/render.sh copies
# them into _dev/mockups/, and `jekyll serve` empties its destination of
# anything it did not generate every time it regenerates, so the next edit to
# any page made /mockups/… a 404.
#
# THIS MUST NOT GO IN _config.yml. It was tried there first: `keep_files`
# then also kept _site/mockups/ through `npx gulp build`, the CSS purge read
# the mockup pages as if they were the site, and all.min.css shipped 7 KB of
# classes no real page uses (51 KB -> 58 KB). The production build has to
# start from an empty _site; only the dev server may keep anything.
#
# `.git` and `.svn` are Jekyll's own defaults, restated because setting the
# key replaces them.
keep_files: [.git, .svn, mockups]
